name: Qelly Prompt 2B Verified Source Installer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/prompt2b-install-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-source-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_BASE: 9cb98780893924ad26fbf4baaa9048e80a162b2c
      EXPECTED_STAGING_HEAD: 2c5841b42e5451df3e27530ba654f2918612579f
    steps:
      - name: Check out exact manifested staging checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify manifest, payload and ancestry
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, json, subprocess

          def sha256(data): return hashlib.sha256(data).hexdigest()
          def git_blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          base=subprocess.check_output(['git','merge-base','HEAD','${{ env.EXPECTED_BASE }}'],text=True).strip()
          if parent!='${{ env.EXPECTED_STAGING_HEAD }}': raise SystemExit(f'parent mismatch: {parent}')
          if base!='${{ env.EXPECTED_BASE }}': raise SystemExit(f'base mismatch: {base}')

          manifest_path=Path('.github/qelly-prompt2b-install-v2/manifest.json')
          manifest=json.loads(manifest_path.read_text())
          expected_paths=[f'.github/qelly-prompt2b-install-v2/part-{i:02d}.b64' for i in range(6)]
          actual=[item['path'] for item in manifest['parts']]
          if actual!=expected_paths: raise SystemExit(f'part order mismatch: {actual}')
          combined=b''
          for item in manifest['parts']:
              data=Path(item['path']).read_bytes()
              checks=(len(data)==item['bytes'],sha256(data)==item['sha256'],git_blob(data)==item['gitBlobSha'])
              if not all(checks): raise SystemExit(f'part integrity failure: {item["path"]} {len(data)} {sha256(data)} {git_blob(data)}')
              combined+=data
          payload=manifest['payload']
          if len(combined)!=payload['base64Bytes'] or sha256(combined)!=payload['base64Sha256']:
              raise SystemExit('combined base64 integrity failure')
          compressed=base64.b64decode(combined,validate=True)
          if len(compressed)!=payload['gzipBytes'] or sha256(compressed)!=payload['gzipSha256']:
              raise SystemExit('gzip integrity failure')
          patch=gzip.decompress(compressed)
          if len(patch)!=payload['patchBytes'] or sha256(patch)!=payload['patchSha256']:
              raise SystemExit('patch integrity failure')
          if not patch.startswith(b'diff --git '): raise SystemExit('decoded payload is not a git patch')
          Path('/tmp/qelly-prompt2b.patch.gz').write_bytes(compressed)
          Path('/tmp/qelly-prompt2b.patch').write_bytes(patch)
          Path('/tmp/PATCH_SHA256.txt').write_text(payload['patchSha256']+'\n')
          Path('/tmp/PATCH_GZIP_SHA256.txt').write_text(payload['gzipSha256']+'\n')
          print(json.dumps({'head':head,'parent':parent,'parts':len(actual),'patchBytes':len(patch),'patchSha256':payload['patchSha256']},indent=2))

      - name: Enforce Wave 1 patch scope and safety boundaries
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import re
          patch=Path('/tmp/qelly-prompt2b.patch').read_text(encoding='utf-8')
          paths=[]
          for match in re.finditer(r'^diff --git a/(.+?) b/(.+?)$',patch,re.M):
              left,right=match.groups()
              if left!=right: raise SystemExit(f'rename/copy not permitted: {left} -> {right}')
              pure=PurePosixPath(right)
              if pure.is_absolute() or '..' in pure.parts or '.git' in pure.parts: raise SystemExit(f'unsafe path: {right}')
              allowed=(right=='package.json' or right.startswith('apps/web/public/') or
                  right.startswith('packages/calculation-contracts/') or right.startswith('packages/formulas/') or
                  right.startswith('packages/indicators/') or right.startswith('packages/financial-rules/') or
                  right.startswith('packages/schemas/') or right.startswith('src/calculations/') or
                  right in {'src/server/runtime.mjs','src/server/server.mjs','src/server/route-manifest.mjs'} or
                  right in {'scripts/build-frontend.mjs','scripts/product-validate.mjs','scripts/release-check.mjs','scripts/smoke.mjs'} or
                  right.startswith('tests/prompt2b-'))
              if not allowed: raise SystemExit(f'path outside Prompt 2B Wave 1 scope: {right}')
              paths.append(right)
          if not paths or len(paths)!=len(set(paths)): raise SystemExit('empty or duplicate patch paths')
          required={'packages/calculation-contracts/calculation-contracts.mjs','packages/formulas/formula-engine.mjs',
              'packages/indicators/indicator-engine.mjs','packages/financial-rules/india-rule-registry.mjs',
              'src/calculations/calculation-service.mjs','src/calculations/calculation-store.mjs',
              'apps/web/public/assets/routes/calculator-indicator-foundation.mjs',
              'tests/prompt2b-formula-indicator-foundation.test.mjs','tests/prompt2b-server-persistence-api.test.mjs'}
          missing=sorted(required-set(paths))
          if missing: raise SystemExit(f'missing required source paths: {missing}')
          forbidden=[r'realMoneyTrading\s*:\s*true',r'custody\s*:\s*true',r'depositsWithdrawals\s*:\s*true',
              r'privateKeyStorage\s*:\s*true',r'seedPhraseCollection\s*:\s*true',r'autonomousExecution\s*:\s*true',
              r'IMPLEMENTED_CONNECTED[^\n]*(?:market|broker|wallet|exchange)']
          for pattern in forbidden:
              if re.search(pattern,patch,re.I): raise SystemExit(f'forbidden capability/claim: {pattern}')
          Path('/tmp/PATCH_PATHS.txt').write_text('\n'.join(paths)+'\n')
          print(f'verified {len(paths)} scoped source paths')

      - name: Apply patch and run focused source tests
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/qelly-prompt2b.patch
          git apply /tmp/qelly-prompt2b.patch
          while IFS= read -r file; do
            case "$file" in
              *.mjs|*.js) node --check "$file" ;;
              *.json) node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$file" ;;
            esac
          done < /tmp/PATCH_PATHS.txt
          node --test tests/prompt2b-formula-indicator-foundation.test.mjs tests/prompt2b-server-persistence-api.test.mjs
          node --input-type=module <<'NODE'
          import { formulaDefinitions } from './packages/formulas/formula-engine.mjs';
          import { indicatorDefinitions } from './packages/indicators/indicator-engine.mjs';
          if(formulaDefinitions().length < 36) throw new Error('formula catalog below 36');
          if(indicatorDefinitions().length < 32) throw new Error('indicator catalog below 32');
          console.log({formulas:formulaDefinitions().length,indicators:indicatorDefinitions().length});
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run validate:brand
          npm run security:scan
          npm test
          npm run build
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:product
          npm run inventory:product
          npm run smoke
          NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
          npm run release:check
          npm audit --audit-level=high

      - name: Commit source and remove every temporary transport
        shell: bash
        run: |
          set -euo pipefail
          patch_sha=$(cat /tmp/PATCH_SHA256.txt)
          gzip_sha=$(cat /tmp/PATCH_GZIP_SHA256.txt)
          paths=$(wc -l < /tmp/PATCH_PATHS.txt | tr -d ' ')
          cat >> project-state/QELLY_PROMPT2B_EXECUTION_LEDGER.md <<EOF

          ## Verified source installation

          - Manifest staging head: \`$EXPECTED_STAGING_HEAD\`
          - Decoded patch SHA-256: \`$patch_sha\`
          - Compressed payload SHA-256: \`$gzip_sha\`
          - Scoped source paths: $paths
          - Formula definitions: at least 36
          - Indicator definitions: at least 32
          - Core reference/property/persistence/API tests: passed
          - Complete repository gates: passed before commit
          - All payload parts, manifest and temporary start/installer workflows: removed in this commit
          EOF
          rm -rf .github/qelly-prompt2b-install .github/qelly-prompt2b-install-v2
          rm -f .github/workflows/prompt2b-start-gate.yml .github/workflows/prompt2b-install-source.yml
          git add -A
          git diff --cached --check
          git config user.name 'Qelly Wave 1 Automation'
          git config user.email 'hemangsah@users.noreply.github.com'
          git commit -m 'feat(prompt2b): install deterministic calculator and indicator foundation'
          git push origin HEAD:feature/calculator-and-indicator-foundation
