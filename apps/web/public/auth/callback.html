<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Qelly Authentication Callback</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;background:#10070b;color:#f8eef2;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,560px);background:#241018;border:1px solid #673247;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0008}.mark{font-weight:800;letter-spacing:.18em;color:#f5b8cb}.card[data-state=error]{border-color:#d36b78}.card[data-state=success]{border-color:#4ca779}label{display:grid;gap:8px;margin:20px 0}input{font:inherit;padding:12px;border-radius:10px;border:1px solid #805165;background:#14090d;color:#fff}button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:10px;background:#8f294c;color:#fff;cursor:pointer}button:disabled{opacity:.6}</style>
</head>
<body>
  <main class="card" id="qelly-auth-callback" data-state="working">
    <div class="mark">QELLY</div>
    <h1>Completing authentication</h1>
    <p>Verifying the provider session without storing tokens in browser storage.</p>
    <form id="recovery-form" hidden>
      <label>New password<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></label>
      <button type="submit">Update password</button>
    </form>
  </main>
  <script type="module" src="../assets/qelly-auth-callback.mjs"></script>
</body>
</html>
