name: Qelly Logo Brand Source Bootstrap

on:
  push:
    branches: [feature/logo-first-brand-system]
    paths:
      - '.qelly-brand-bootstrap/**'
      - '.github/workflows/logo-brand-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.qelly-brand-bootstrap/**'
      - '.github/workflows/logo-brand-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qelly-logo-brand-source-bootstrap
  cancel-in-progress: true

jobs:
  install-validate-commit:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/logo-first-brand-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact logo branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 0
          persist-credentials: true

      - name: Detect prepared source chunks
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.qelly-brand-bootstrap/chunk-*' >/dev/null; then
            echo 'install=true' >> "$GITHUB_OUTPUT"
            echo 'mode=base64' >> "$GITHUB_OUTPUT"
          elif compgen -G '.qelly-brand-bootstrap/bin-*' >/dev/null; then
            echo 'install=true' >> "$GITHUB_OUTPUT"
            echo 'mode=binary' >> "$GITHUB_OUTPUT"
          else
            echo 'install=false' >> "$GITHUB_OUTPUT"
            echo 'mode=none' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.install == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Assemble and validate prepared source bundle
        if: steps.detect.outputs.install == 'true'
        env:
          CHUNK_MODE: ${{ steps.detect.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/qelly-brand-bundle.tar.gz
          extract=/tmp/qelly-brand-bundle
          if [ "$CHUNK_MODE" = base64 ]; then
            cat .qelly-brand-bootstrap/chunk-* | tr -d '\r\n' | base64 --decode > "$archive"
          else
            cat .qelly-brand-bootstrap/bin-* > "$archive"
          fi
          actual_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected_sha='840d9910e193daa3d001436c0c44b556b010742d5e779fd072f6db7bce313558'
          test "$actual_sha" = "$expected_sha"
          test -z "$(tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$)|(^|/)\.git(/|$))' || true)"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          test -f "$extract/apps/web/public/assets/qelly-brand.mjs"
          test -f "$extract/scripts/generate-logo-assets.mjs"
          test -f "$extract/scripts/logo-brand-governance.mjs"
          test -f "$extract/scripts/logo-brand-review.mjs"
          test -f "$extract/tests/logo-brand-system.test.mjs"
          tar -tzf "$archive" | sort > /tmp/QELLY_PREPARED_BUNDLE_CONTENTS.txt
          cp -a "$extract"/. .
          rm -rf .qelly-brand-bootstrap
          rm -f .github/workflows/logo-brand-bootstrap.yml

      - name: Install locked dependencies
        if: steps.detect.outputs.install == 'true'
        run: npm ci --ignore-scripts

      - name: Generate governed favicon and PWA assets
        if: steps.detect.outputs.install == 'true'
        run: npm run generate:brand-assets

      - name: Create hash-verified source manifest
        if: steps.detect.outputs.install == 'true'
        env:
          FOUNDATION_SHA: 239f6f0c7c663801662f4e5f940ca76fb6941bf1
          BUNDLE_SHA256: 840d9910e193daa3d001436c0c44b556b010742d5e779fd072f6db7bce313558
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, struct, subprocess

          root = pathlib.Path('.').resolve()
          foundation = os.environ['FOUNDATION_SHA']
          excluded = {
              '.github/workflows/logo-brand-bootstrap.yml',
              'design/brand/QELLY_LOGO_SOURCE_MANIFEST.json',
              'design/brand/QELLY_LOGO_IMPLEMENTATION_STATUS.md',
          }

          def run(*args, text=True):
              return subprocess.check_output(args, text=text)

          changed = set()
          for line in run('git','status','--porcelain=v1','-z').split('\0'):
              if not line:
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              if path.startswith('.qelly-brand-bootstrap/') or path in excluded:
                  continue
              absolute = root / path
              if absolute.is_file():
                  changed.add(path)

          def purpose(path):
              rules = [
                  ('apps/web/public/assets/brand/', 'official production logo asset'),
                  ('apps/web/public/assets/qelly-brand', 'runtime brand integration'),
                  ('apps/web/public/assets/routes/', 'logo-first product experience'),
                  ('apps/web/public/', 'web shell, icon or manifest integration'),
                  ('design/brand/', 'brand governance and handoff'),
                  ('figma-brand-foundations/', 'editable Figma brand foundations'),
                  ('scripts/', 'brand generation, validation or review automation'),
                  ('tests/', 'brand governance regression coverage'),
                  ('.github/workflows/', 'brand validation and visual review workflow'),
                  ('package', 'locked repository command integration'),
              ]
              for prefix, label in rules:
                  if path.startswith(prefix):
                      return label
              return 'logo-first integration source'

          def png_dimensions(data):
              if data[:8] == b'\x89PNG\r\n\x1a\n' and len(data) >= 24:
                  return [struct.unpack('>I', data[16:20])[0], struct.unpack('>I', data[20:24])[0]]
              return None

          def ico_dimensions(data):
              if len(data) < 6 or data[:4] != b'\x00\x00\x01\x00':
                  return None
              count = struct.unpack('<H', data[4:6])[0]
              dims=[]
              offset=6
              for _ in range(count):
                  if offset+16 > len(data): break
                  w=data[offset] or 256; h=data[offset+1] or 256
                  dims.append([w,h]); offset += 16
              return dims

          files=[]
          for path in sorted(changed):
              data=(root/path).read_bytes()
              try:
                  data.decode('utf-8')
                  kind='text'
              except UnicodeDecodeError:
                  kind='binary'
              exists_before = subprocess.run(
                  ['git','cat-file','-e',f'{foundation}:{path}'],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL
              ).returncode == 0
              entry={
                  'path':path,
                  'purpose':purpose(path),
                  'kind':kind,
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'gitBlobSha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),
                  'change':'updated' if exists_before else 'created',
                  'validationResult':'verified-worktree-and-git-blob',
                  'sourceProvenance':'prepared logo-first bundle reconstructed from the user-selected authoritative Qelly logo',
                  'authoritativeSelectedLogoRelationship':'preserves the approved burgundy Q ring and tail, trajectory curve, red and green nodes, and QELLY wordmark',
              }
              dims=png_dimensions(data)
              if dims: entry['dimensions']=dims
              ico=ico_dimensions(data)
              if ico: entry['iconDimensions']=ico
              files.append(entry)

          manifest={
              'schemaVersion':1,
              'repository':'hemangsah/qelly-intelligence',
              'branch':'feature/logo-first-brand-system',
              'foundationCommit':foundation,
              'foundationTag':'qelly-design-foundation-v1',
              'preparedBundleSha256':os.environ['BUNDLE_SHA256'],
              'selectedLogo':'user-supplied authoritative Qelly mark',
              'ibmPlexLock':True,
              'manifestSelfExcludedFromRecursiveHash':True,
              'fileCount':len(files),
              'files':files,
          }
          out=root/'design/brand/QELLY_LOGO_SOURCE_MANIFEST.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')

          status=root/'design/brand/QELLY_LOGO_IMPLEMENTATION_STATUS.md'
          status.write_text(
              '# Qelly Logo Implementation Status\n\n'
              '## Durable installation\n\n'
              f'- Prepared bundle SHA-256: `{os.environ["BUNDLE_SHA256"]}`\n'
              f'- Verified installed source files: `{len(files)}`\n'
              '- Missing intended files: `0` at installation stage\n'
              '- Failed files: `0`\n'
              '- Transport resolution: existing bounded Base64 chunks decoded as one verified byte stream; the one-large-payload method was not retried\n'
              '- Every installed file records byte size, SHA-256 and Git blob SHA in `QELLY_LOGO_SOURCE_MANIFEST.json`\n'
              '- Current durable source commit: resolved by the branch head after the coherent install commit\n'
              '- Next action: complete full repository, browser, workflow and review-artifact validation\n',
              encoding='utf-8'
          )
          print(json.dumps({'installedFiles':len(files)},indent=2))
          PY

      - name: Validate affected brand source before commit
        if: steps.detect.outputs.install == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/public/assets/qelly-brand.mjs
          node --check apps/web/public/assets/routes/feature-universe.mjs
          node --check scripts/generate-logo-assets.mjs
          node --check scripts/logo-brand-governance.mjs
          node --check scripts/logo-brand-review.mjs
          node --check tests/logo-brand-system.test.mjs
          node --check figma-brand-foundations/code.js
          node --test tests/logo-brand-system.test.mjs
          npm run validate:brand
          git diff --check
          npm run security:scan

      - name: Build and validate static integration
        if: steps.detect.outputs.install == 'true'
        env:
          QELLY_STATIC_VISUAL_PREVIEW: 'true'
          QELLY_PUBLIC_BASE_PATH: /qelly-intelligence/
          QELLY_DEPLOYMENT_ENVIRONMENT: logo-brand-bootstrap
        run: |
          npm run build:frontend
          npm run validate:pages-preview
          npm run smoke:pages-preview

      - name: Commit coherent logo-first source
        if: steps.detect.outputs.install == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Qelly Brand Automation'
          git config user.email 'hemangsah@users.noreply.github.com'
          git commit -m 'feat(brand): add official Qelly logo-first system'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch back and verify every committed source file
        if: steps.detect.outputs.install == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          manifest=json.load(open('design/brand/QELLY_LOGO_SOURCE_MANIFEST.json',encoding='utf-8'))
          commit=os.environ['SOURCE_COMMIT']
          failures=[]
          for item in manifest['files']:
              path=item['path']
              data=subprocess.check_output(['git','show',f'{commit}:{path}'])
              sha256=hashlib.sha256(data).hexdigest()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if len(data)!=item['bytes'] or sha256!=item['sha256'] or blob!=item['gitBlobSha']:
                  failures.append({'path':path,'bytes':len(data),'sha256':sha256,'gitBlobSha':blob})
          if failures:
              raise SystemExit(json.dumps({'verificationFailures':failures},indent=2))
          print(json.dumps({'commit':commit,'verifiedFiles':len(manifest['files'])},indent=2))
          PY

      - name: Push one coherent source commit
        if: steps.detect.outputs.install == 'true'
        run: git push origin HEAD:feature/logo-first-brand-system
