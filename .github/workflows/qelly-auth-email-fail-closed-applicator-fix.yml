name: Fix Auth Fail-Closed Applicator

on:
  push:
    branches:
      - agent/qelly-auth-email-fail-closed

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/qelly-auth-email-fail-closed
          fetch-depth: 0
      - name: Correct applicator test harness
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          target=Path('.github/workflows/qelly-auth-email-fail-closed-apply-v2.yml')
          text=target.read_text()
          replacements={
            "    if: github.actor != 'github-actions[bot]'\n":"",
            "import { route } from '../functions/api/v1/[[path]].js';":"import { onRequest } from '../functions/api/v1/[[path]].js';",
            "const response=await route({request,env,params:{path:path.split('/')}});":"const response=await onRequest({request,env,params:{path:path.split('/')}});"
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1: raise SystemExit(f'expected one match for {old!r}, found {count}')
              text=text.replace(old,new,1)
          target.write_text(text)
          Path('.github/workflows/qelly-auth-email-fail-closed-apply.yml').unlink(missing_ok=True)
          Path('.github/workflows/qelly-auth-email-fail-closed-applicator-fix.yml').unlink()
          PY
          git config user.name 'qelly-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/
          git commit -m 'Correct Auth fail-closed test harness'
          git push origin HEAD:agent/qelly-auth-email-fail-closed
