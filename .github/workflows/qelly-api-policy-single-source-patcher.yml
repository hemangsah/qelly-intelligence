name: Qelly API policy single-source patcher

on:
  push:
    branches:
      - fix/api-access-policy-single-source

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact server integration
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/server/server.mjs')
          source=path.read_text()
          import_anchor="import { handleSavedCalculationRequest } from '../calculations/saved-calculation-routes.mjs';\n"
          import_line="import { isPublicApiRequestPath } from './api-access-policy.mjs';\n"
          legacy="const publicApiPaths = new Set(['/api/v1/config','/api/v1/auth/status','/api/v1/auth/register','/api/v1/auth/login','/api/v1/auth/passkeys/authenticate/options','/api/v1/auth/passkeys/authenticate/verify','/api/v1/auth/recovery/request','/api/v1/auth/recovery/status','/api/v1/auth/recovery/reset','/api/v1/production-foundation/status','/api/v1/public/markets/overview','/api/v1/public/markets/assets','/api/v1/public/providers','/api/v1/calculations/metadata','/api/v1/calculations/formulas','/api/v1/calculations/run','/api/v1/calculations/batch','/api/v1/indicators','/api/v1/indicators/run','/api/v1/india/rules','/api/v1/india/charges']);\nfunction isPublicApiPath(pathname){return publicApiPaths.has(pathname)||/^\\/api\\/v1\\/public\\/markets\\/assets\\/[^/]+(?:\\/candles)?$/.test(pathname)||/^\\/api\\/v1\\/calculations\\/formulas\\/[^/]+$/.test(pathname)||/^\\/api\\/v1\\/indicators\\/[^/]+$/.test(pathname);}\n"
          if import_line not in source:
              if source.count(import_anchor)!=1: raise SystemExit('server import anchor drifted')
              source=source.replace(import_anchor,import_anchor+import_line,1)
          if legacy not in source: raise SystemExit('legacy public API gate drifted; refusing broad rewrite')
          source=source.replace(legacy,'',1)
          old='!isPublicApiPath(url.pathname)'
          new='!isPublicApiRequestPath(url.pathname)'
          if source.count(old)!=1: raise SystemExit('runtime auth gate drifted; refusing broad rewrite')
          source=source.replace(old,new,1)
          path.write_text(source)
      - name: Verify focused fail-closed contract
        run: node --test tests/api-inventory-access-truth.test.mjs
      - name: Commit deterministic integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/server.mjs
          git diff --cached --check
          git commit -m "refactor(auth): consume canonical public request policy"
          git push origin HEAD:fix/api-access-policy-single-source
