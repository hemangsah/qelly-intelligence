name: Qelly Prompt 2B Wave 1 Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: qelly-prompt2b-wave1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wave1-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      QELLY_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Wave 1 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies and browser engines
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify installed source manifest
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const manifest=JSON.parse(await readFile('project-state/QELLY_PROMPT2B_SOURCE_MANIFEST.json','utf8'));
          const failures=[];
          for(const file of manifest.files){
            const size=(await stat(file.path)).size;
            const blob=execFileSync('git',['hash-object',file.path],{encoding:'utf8'}).trim();
            if(size!==file.bytes||blob!==file.gitBlobSha)failures.push({path:file.path,expectedBytes:file.bytes,actualBytes:size,expectedBlob:file.gitBlobSha,actualBlob:blob});
          }
          if(manifest.files.length!==manifest.fileCount)failures.push({manifestCount:manifest.files.length,declared:manifest.fileCount});
          console.log(JSON.stringify({verified:manifest.files.length-failures.length,failures},null,2));
          if(failures.length)process.exit(1);
          NODE

      - name: Run repository, formula, security and release gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run validate:brand
          npm run security:scan
          npm test
          node --test tests/calculation-engine.test.mjs tests/calculation-security.test.mjs tests/indicator-engine.test.mjs tests/saved-calculation-store.test.mjs
          npm run build
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:pages-preview
          npm run smoke:pages-preview
          npm run validate:product
          npm run inventory:product
          npm run smoke
          NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
          npm run release:check
          npm audit --audit-level=high
          git diff --check

      - name: Run Chromium Firefox WebKit accessibility and performance matrix
        run: |
          set -euo pipefail
          node scripts/prompt2b-final-review.mjs
          npm run a11y

      - name: Create font-free runnable compiled preview
        run: |
          set -euo pipefail
          mkdir -p .prompt2b-review/compiled-preview
          cp -a dist/frontend/. .prompt2b-review/compiled-preview/
          find .prompt2b-review/compiled-preview -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -delete
          cat > .prompt2b-review/compiled-preview/README.md <<'EOF'
          # Qelly Prompt 2B compiled preview

          This is the exact disconnected static build used by the browser matrix. Serve this directory with any static HTTP server and open the generated `index.html` under the `/qelly-intelligence/` base path.

          Governed font binaries are intentionally excluded from the downloadable review artifact. The repository and validated build retain IBM Plex Sans Variable; the review copy falls back to the declared system stack when those binary files are absent.

          No external financial provider, broker, exchange, wallet, trading, custody or cloud-save service is connected.
          EOF
          if find .prompt2b-review -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) | grep -q .; then exit 1; fi

      - name: Package and integrity-check review artifact
        run: |
          set -euo pipefail
          cp project-state/QELLY_PROMPT2B_SOURCE_MANIFEST.json .prompt2b-review/
          cp project-state/QELLY_PROMPT2B_EXECUTION_LEDGER.md .prompt2b-review/
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const root='.prompt2b-review';
          const walk=async dir=>{const out=[];for(const entry of await readdir(dir,{withFileTypes:true})){const full=path.join(dir,entry.name);if(entry.isDirectory())out.push(...await walk(full));else out.push(full);}return out;};
          const files=(await walk(root)).sort();
          const checks=[];
          for(const file of files){const body=await readFile(file);checks.push({path:path.relative(root,file).replaceAll('\\','/'),bytes:body.length,sha256:createHash('sha256').update(body).digest('hex')});}
          await writeFile(path.join(root,'CHECKSUMS.json'),JSON.stringify({schemaVersion:1,head:process.env.QELLY_REVIEW_HEAD,files:checks},null,2)+'\n');
          NODE
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('.prompt2b-review')
          target=pathlib.Path('qelly-prompt2b-calculator-indicator-foundation-review.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file(): archive.write(file,file.relative_to(root.parent).as_posix())
          with zipfile.ZipFile(target) as archive:
              bad=archive.testzip()
              if bad: raise SystemExit(f'CRC failed: {bad}')
              names=archive.namelist()
              prohibited=[name for name in names if name.lower().endswith(('.woff','.woff2','.ttf','.otf'))]
              if prohibited: raise SystemExit(f'font binaries prohibited: {prohibited}')
          PY
          sha256sum qelly-prompt2b-calculator-indicator-foundation-review.zip > qelly-prompt2b-calculator-indicator-foundation-review.zip.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          p=pathlib.Path('qelly-prompt2b-calculator-indicator-foundation-review.zip')
          with zipfile.ZipFile(p) as z: entries=len(z.infolist())
          meta={'schemaVersion':1,'head':os.environ['QELLY_REVIEW_HEAD'],'filename':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'entryCount':entries,'crcVerified':True,'prohibitedFontBinaries':0}
          pathlib.Path('qelly-prompt2b-calculator-indicator-foundation-review.metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload complete Prompt 2B Wave 1 review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-calculator-indicator-foundation-review
          path: |
            qelly-prompt2b-calculator-indicator-foundation-review.zip
            qelly-prompt2b-calculator-indicator-foundation-review.zip.sha256
            qelly-prompt2b-calculator-indicator-foundation-review.metadata.json
            .prompt2b-review
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
