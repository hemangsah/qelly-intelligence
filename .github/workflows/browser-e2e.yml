4, 0.92)","opacity":1},{"role":"start boundary","foreground":"rgb(245, 174, 195)","opacity":1},{"role":"end boundary","foreground":"rgb(245, 174, 195)","opacity":1},{"role":"start handle","foreground":"rgb(245, 174, 195)","opacity":1},{"role":"end handle","foreground":"rgb(245, 174, 195)","opacity":1}],"volatileMetadataPaths":["macro.ingestionTime","evidence.macro.ingestionTime","pastPresentFuture.present.macro.ingestionTime","performance.totalMs","performance.components.news.ms","performance.components.candleFetch.ms","performance.components.macro.ms","performance.components.derivatives.ms","performance.components.liquidity.ms","performance.components.fundingHistory.ms","performance.components.crossAssetBenchmark.ms","performance.components.multiTimeframe.ms","performance.components.derivativesCompute.ms","performance.components.crossAssetCompute.ms","performance.components.quantCalibrationAnalogs.ms","performance.components.nextMoveCompute.ms","performance.components.riskRewardResearch.ms","performance.components.contextAndEvidenceGraph.ms","performance.components.rangeEvidence.ms"]},validation=validateDecisionChartReadabilityReport(r,sha,expected),negativeVariants=[];for(const[name,mutate]of decisionChartReadabilityInvalidReports()){const bad=structuredClone(r);mutate(bad);assert.throws(()=>validateDecisionChartReadabilityReport(bad,sha,expected),name);negativeVariants.push(name);}assert.equal(negativeVariants.length,29);const screenshots=[];for(const file of r.screenshots){const b=await readFile(root+'/'+file),g=r.captureGeometry.find(x=>x.file===file);assert.ok(b.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));assert.ok(Math.abs(b.readUInt32BE(16)-g.clip.width)<=1);assert.ok(Math.abs(b.readUInt32BE(20)-g.clip.height)<=1);screenshots.push({file,sha256:createHash('sha256').update(b).digest('hex'),width:b.readUInt32BE(16),height:b.readUInt32BE(20)});}assert.equal(screenshots.length,14);const receipt={...validation,negativeVariants,reportSha256:createHash('sha256').update(bytes).digest('hex'),screenshots};await writeFile(root+'/independent-gate-receipt.json',JSON.stringify(receipt)+'\n');console.log({source:sha,contexts:30,selections:10,images:14,invalidReportsRejected:29});
          NODE
      - name: Preserve Decision chart readability evidence in cloud
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qelly-decision-primary-chart-context-readability-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/decision-chart-readability
          if-no-files-found: error
          retention-days: 7
      - name: Verify owned Service Readiness surfaces and customer provenance
        run: node scripts/qelly-readiness-visual-e2e.mjs
      - name: Upload focused Service Readiness visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qelly-readiness-visual-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/readiness-visual-e2e
          retention-days: 7
      - name: Verify Theme Studio and Persona owned surfaces and readable identity
        env:
          QELLY_DIAGNOSTIC_MODE: theme
          QELLY_PRODUCT_SHA: ${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          QELLY_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
        run: node scripts/qelly-focused-owner-diagnostics.mjs
      - name: Independently validate theme focused report before upload
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          function validateFocusedOwnerReport(report, mode, expectedSha) {
            const require = (condition, message) => { if (!condition) throw new Error(`Focused owner report: ${message}`); };
            const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
            const finite = value => typeof value === 'number' && Number.isFinite(value);
            const integer = value => Number.isInteger(value) && value >= 0;
            const nonempty = value => typeof value === 'string' && value.trim().length > 0;
            const equal = (actual, expected, name) => require(actual === expected, `${name} must equal ${JSON.stringify(expected)}`);
            const array = (value, name) => { require(Array.isArray(value), `${name} must be an array`); return value; };
            const color = value => {
              require(nonempty(value), 'computed color missing');
              const text = value.trim().toLowerCase();
              if (text === 'transparent') return [0, 0, 0, 0];
              let match = text.match(/^rgba?\((.*)\)$/), normalized = false;
              if (!match) { match = text.match(/^color\(srgb\s+(.+)\)$/); normalized = true; }
              require(match, `unsupported computed color ${value}`);
              const channels = match[1].replace(/,/g, ' ').replace(/\//g, ' ').trim().split(/\s+/);
              require(channels.length === 3 || channels.length === 4, `invalid computed color ${value}`);
              const values = channels.map((channel, index) => {
                const numeric = Number.parseFloat(channel);
                require(Number.isFinite(numeric), `invalid computed color channel ${value}`);
                return channel.endsWith('%') ? numeric / 100 : (index < 3 && !normalized ? numeric / 255 : numeric);
              });
              if (values.length === 3) values.push(1);
              require(values.every(value => value >= 0 && value <= 1), `computed color out of range ${text}`);
              return values;
            };
            const contrast = (foreground, background) => {
              const front = color(foreground), back = color(background);
              require(back[3] === 1, 'banner background must be opaque');
              const luminance = channels => channels.slice(0, 3).map(value => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4)
                .reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0);
              const combined = front.slice(0, 3).map((value, index) => value * front[3] + back[index] * (1 - front[3]));
              const first = luminance(combined), second = luminance(back);
              return (Math.max(first, second) + 0.05) / (Math.min(first, second) + 0.05);
            };
            const focusRing = shadow => {
              if (!nonempty(shadow) || shadow === 'none') return false;
              return (shadow.match(/(?:rgba?\([^)]*\)|color\([^)]*\)|#[a-f0-9]+)[^,]*/gi) || []).some(part => {
                if (/\binset\b/i.test(part)) return false;
                const computed = part.match(/^(rgba?\([^)]*\)|color\([^)]*\))/i)?.[1];
                if (!computed || color(computed)[3] <= 0) return false;
                const lengths = part.slice(computed.length).match(/-?(?:\d*\.)?\d+px/g)?.map(Number.parseFloat) || [];
                return lengths.length === 4 && lengths[0] === 0 && lengths[1] === 0 && lengths[2] === 0 && lengths[3] >= 3;
              });
            };
            const zeroBorders = (value, name) => require(array(value, name).length === 4 && value.every(edge => /^0(?:px)?$/.test(edge)), `${name} must have four zero borders`);
            const solid = (value, name, borders = false) => {
              require(object(value), `${name} missing`);
              equal(value.image, 'none', `${name}.image`);
              equal(value.shadow, 'none', `${name}.shadow`);
              if (value.backdrop !== undefined) equal(value.backdrop, 'none', `${name}.backdrop`);
              color(value.background);
              if (borders) zeroBorders(value.border, `${name}.border`);
            };
            const spec = {
              'theme-lab': ['.q-ti-page', 'Theme Studio'],
              'theme-personas': ['.q-theme-persona-page', 'Choose how Qelly prioritises intelligence'],
              'account-recovery': ['.q-boundary-page', 'Account Recovery Controls'],
              'portfolio-attribution': ['.q-boundary-page', 'Performance Attribution'],
              'research-history': ['.q-boundary-page', 'Research Version History'],
              'formula-detail': ['.q-formula-detail-page.q-boundary-page', 'Formula Detail'],
              'indicator-detail': ['.q-indicator-detail-page.q-boundary-page', 'Indicator Detail'],
              'calculator-detail': ['.q-calculator-detail-page.q-boundary-page', 'Calculator Detail'],
              'saved-calculation-detail': ['.q-saved-detail-page.q-boundary-page', 'Saved Calculation Detail'],
              'category-detail': ['.q-governed-unavailable.q-boundary-page', 'Category dossier'],
              'venue-detail': ['.q-governed-unavailable.q-boundary-page', 'Venue dossier'],
              'research-article': ['.q-governed-unavailable.q-boundary-page', 'Research article'],
            };
            require(mode === 'theme' || mode === 'boundary', 'mode must be theme or boundary');
            require(typeof expectedSha === 'string' && /^[a-f0-9]{40}$/.test(expectedSha), 'expected checkout SHA must be a full lowercase SHA');
            require(object(report), 'report must be an object');
            equal(report.mode, mode, 'mode');
            equal(report.status, 'passed', 'status');
            equal(report.sourceSha, expectedSha, 'sourceSha');
            equal(report.productSha, expectedSha, 'productSha');
            require(typeof report.runnerSha === 'string' && /^[a-f0-9]{40}$/.test(report.runnerSha), 'runnerSha must be a full SHA');
            for (const name of ['actualBuiltRuntime', 'productionFinalizersConfirmed', 'syntheticGetFixtures', 'rootVisualReviewRequired']) equal(report[name], true, name);
            for (const name of ['manualPresenterInjection', 'realAuthenticationTested', 'preferencesActivated', 'settingsApplied', 'formsSubmitted', 'providersEnabled', 'numericalEnginesChanged']) equal(report[name], false, name);
            for (const name of ['nativePrivateFullWaveAccepted', 'fullBrowserSuiteAccepted', 'nativeAcceptance', 'realAuthAccepted']) require(report[name] === undefined || report[name] === false, `${name} exceeds focused evidence scope`);
            equal(report.scope, 'focused only; no full Browser suite', 'scope');
            equal(report.writeAttempts, 0, 'writeAttempts');
            for (const name of ['failures', 'invalidFailures']) equal(array(report[name], name).length, 0, `${name}.length`);
            const routes = mode === 'theme' ? ['theme-lab', 'theme-personas'] : Object.keys(spec).slice(2);
            const invalidRoutes = mode === 'boundary' ? ['formula-detail', 'indicator-detail', 'calculator-detail', 'saved-calculation-detail'] : [];
            const widths = [1440, 1280, 768, 390, 320], appearances = ['dark', 'light'];
            const defaults = routes.length * widths.length * appearances.length, invalids = invalidRoutes.length * widths.length * appearances.length;
            for (const name of ['expectedDefaultContexts', 'completedDefaultContexts', 'passedDefaultContexts']) equal(report[name], defaults, name);
            for (const name of ['invalidMethodContexts', 'invalidMethodPassed']) equal(report[name], invalids, name);
            const results = array(report.results, 'results'), invalidResults = array(report.invalidResults, 'invalidResults');
            const matrix = (rows, expectedRoutes, name) => {
              equal(rows.length, expectedRoutes.length * widths.length * appearances.length, `${name}.length`);
              const expected = new Set(expectedRoutes.flatMap(route => appearances.flatMap(appearance => widths.map(width => `${route}|${appearance}|${width}`))));
              for (const row of rows) {
                require(object(row), `${name} case must be an object`);
                const key = `${row.route}|${row.appearance}|${row.width}`;
                require(expected.delete(key), `${name} duplicate or unexpected case ${key}`);
              }
              equal(expected.size, 0, `${name} missing cases`);
            };
            matrix(results, routes, 'results');
            matrix(invalidResults, invalidRoutes, 'invalidResults');
            const bannerRatios = [], mobileCases = [], ownerCases = [];
            const checkCase = (row, invalid) => {
              const name = `${invalid ? 'invalid ' : ''}${row.route}/${row.appearance}/${row.width}`;
              equal(row.status, 'passed', `${name}.status`);
              equal(row.root, spec[row.route][0], `${name}.root`);
              equal(row.heading, spec[row.route][1], `${name}.heading`);
              for (const key of ['restAndHoverSolid', 'preferencesUnchanged', 'actualBuiltRoute']) equal(row[key], true, `${name}.${key}`);
              for (const key of ['frames', 'shadows', 'images', 'writeAttempts']) equal(row[key], 0, `${name}.${key}`);
              equal(row.overflow, false, `${name}.overflow`);
              require(integer(row.ordinarySurfaces) && row.ordinarySurfaces > 0, `${name} must inspect ordinary surfaces`);
              require(integer(row.controls), `${name}.controls must be a nonnegative integer`);
              require(object(row.focus) && row.focus.visible === true && finite(row.focus.outline), `${name} visible focus evidence missing`);
              require(row.focus.outline >= 3 || focusRing(row.focus.shadow), `${name} requires a 3px outline or functional focus ring`);
              if (row.controls > 0) {
                require(finite(row.minControlHeight) && row.minControlHeight >= 44, `${name} control target below 44px`);
                equal(row.controlScope, 'owned-route', `${name}.controlScope`);
                equal(row.readOnlyInspection, false, `${name}.readOnlyInspection`);
              } else {
                require(mode === 'boundary' && ['account-recovery', 'portfolio-attribution', 'research-history'].includes(row.route), `${name} unexpectedly has no enabled route controls`);
                equal(row.minControlHeight, null, `${name}.minControlHeight`);
                equal(row.controlScope, 'existing-shell-navigation', `${name}.controlScope`);
                equal(row.readOnlyInspection, true, `${name}.readOnlyInspection`);
              }
              if (mode === 'boundary') {
                const action = row.boundaryActions;
                require(object(action), `${name}.boundaryActions missing`);
                equal(action.restAndHover, true, `${name}.boundaryActions.restAndHover`);
                equal(action.focusRetested, true, `${name}.boundaryActions.focusRetested`);
                require(integer(action.nodes) && action.nodes > 0 && integer(action.buttons), `${name} action counts invalid`);
                equal(action.hovered, action.nodes, `${name} hovered action count`);
                const rest = array(action.rest, `${name} action rest`);
                equal(rest.length, action.nodes, `${name} action rest count`);
                equal(rest.filter(node => node.button === true).length, action.buttons, `${name} action button count`);
                require(rest.some(node => node.classes?.split(/\s+/).includes('q-page-head')), `${name} action page head missing`);
                for (const [index, node] of rest.entries()) {
                  solid(node, `${name} action ${index}`, true);
                  require(typeof node.button === 'boolean' && typeof node.disabled === 'boolean' && typeof node.primary === 'boolean', `${name} action type missing`);
                  if (!node.button) require(color(node.background)[3] === 0, `${name} action header or bar must stay transparent`);
