name: Qelly Logo Compatibility Patch Installer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/logo-compat-install.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qelly-logo-compat-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-verified-compatibility-patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/logo-first-brand-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact logo branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply exact source and renderer compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              file=Path(path)
              source=file.read_text()
              found=source.count(old)
              expected=1 if count is None else count
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}: {old[:100]!r}')
              file.write_text(source.replace(old,new))

          brand='apps/web/public/assets/qelly-brand.mjs'
          replacements={
            '<img data-lockup src="${horizontalLogo()}" alt="Qelly">':'<img data-lockup width="304" height="84" src="${horizontalLogo()}" alt="Qelly">',
            '<img class="q-brand-symbol" src="${symbolLogo()}" alt="" aria-hidden="true">':'<img class="q-brand-symbol" width="84" height="84" src="${symbolLogo()}" alt="" aria-hidden="true">',
            '<img class="q-brand-symbol" src="${symbolLogo()}" alt="">':'<img class="q-brand-symbol" width="84" height="84" src="${symbolLogo()}" alt="">',
            '<img class="qelly-opening__symbol" src="${symbolLogo()}" alt="">':'<img class="qelly-opening__symbol" width="84" height="84" src="${symbolLogo()}" alt="">',
            '<img class="qelly-opening__wordmark" src="${horizontalLogo()}" alt="Qelly">':'<img class="qelly-opening__wordmark" width="304" height="84" src="${horizontalLogo()}" alt="Qelly">',
            '<img class="qelly-hero__logo" src="${horizontalLogo()}" alt="Qelly">':'<img class="qelly-hero__logo" width="304" height="84" src="${horizontalLogo()}" alt="Qelly">'
          }
          for old,new in replacements.items(): replace_exact(brand,old,new)
          replace_exact(brand,'<img src="${horizontalLogo()}" alt="Qelly">','<img width="304" height="84" src="${horizontalLogo()}" alt="Qelly">',2)
          replace_exact(brand,"""  const duration=reduced?120:1180;
          const finish=()=>{overlay.classList.add('is-leaving');setTimeout(()=>overlay.remove(),reduced?0:300)};
          setTimeout(finish,duration);
          overlay.addEventListener('click',finish,{once:true});""","""  const duration=reduced?120:1180;
          const finish=()=>{overlay.classList.add('is-leaving');setTimeout(()=>overlay.remove(),reduced?0:300)};
          const reviewHold=root.dataset.qellyReviewHoldOpening==='true';
          if(!reviewHold)setTimeout(finish,duration);
          overlay.addEventListener('click',finish,{once:true});""")
          replace_exact(brand,"""    const image=document.createElement('img');
              image.className='qelly-state-brand';
              image.src=symbolLogo();""","""    const image=document.createElement('img');
              image.className='qelly-state-brand';
              image.width=84;
              image.height=84;
              image.src=symbolLogo();""")

          css='apps/web/public/assets/qelly-brand.css'
          css_replacements={
            '.q-brand-home img{display:block;width:min(154px,12vw);height:auto;max-height:38px}':'.q-brand-home img{display:block;width:min(154px,12vw);height:auto;max-height:38px;aspect-ratio:304/84}',
            '.q-brand-symbol{width:28px!important;height:28px!important;object-fit:contain}':'.q-brand-symbol{width:28px!important;height:28px!important;aspect-ratio:1/1;object-fit:contain;flex:0 0 28px}',
            '.qelly-opening__symbol{width:clamp(90px,16vw,150px);height:auto;':'.qelly-opening__symbol{width:clamp(90px,16vw,150px);height:auto;aspect-ratio:1/1;',
            '.qelly-opening__wordmark{width:clamp(180px,30vw,290px);height:auto;':'.qelly-opening__wordmark{width:clamp(180px,30vw,290px);height:auto;aspect-ratio:304/84;',
            '.qelly-hero{position:relative;overflow:hidden;':'.qelly-hero{position:relative;overflow:hidden;box-sizing:border-box;max-width:100%;min-width:0;',
            '.qelly-hero__grid{position:relative;':'.qelly-hero__grid{position:relative;min-width:0;max-width:100%;',
            '.qelly-hero__logo{width:min(330px,80%);height:auto;':'.qelly-hero__logo{width:min(330px,80%);height:auto;aspect-ratio:304/84;',
            '.qelly-product-preview{border:':'.qelly-product-preview{min-width:0;max-width:100%;box-sizing:border-box;border:',
            '.qelly-product-preview__row{display:grid;grid-template-columns:1fr auto auto;':'.qelly-product-preview__row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) auto;',
            '.qelly-brand-auth img{width:min(230px,70vw);height:auto}':'.qelly-brand-auth img{width:min(230px,70vw);height:auto;aspect-ratio:304/84}',
            '.qelly-command-brand img{width:98px;height:auto}':'.qelly-command-brand img{width:98px;height:auto;aspect-ratio:304/84}',
            '.qelly-state-brand{width:34px;height:34px;':'.qelly-state-brand{width:34px;height:34px;aspect-ratio:1/1;',
            '@media(max-width:520px){.qelly-hero{padding:1.15rem;':'@media(max-width:520px){.qelly-hero{width:100%;padding:1.15rem;',
            '.qelly-product-preview__metric:last-child{grid-column:1/-1}':'.qelly-product-preview__metric:last-child{grid-column:1/-1}.qelly-product-preview__row span{min-width:0;overflow-wrap:anywhere}'
          }
          for old,new in css_replacements.items(): replace_exact(css,old,new)

          renderer='scripts/logo-brand-review.mjs'
          replace_exact(renderer,"await context.addInitScript(({ seen, themeFamily, appearance, suppressOpening }) => {","await context.addInitScript(({ seen, themeFamily, appearance, suppressOpening, holdOpening }) => {")
          replace_exact(renderer,"""    if (suppressOpening) document.documentElement.dataset.qellyReviewSuppressOpening = 'true';
              window.__qellyReviewMetrics = {""","""    const applyReviewFlags = () => {
                const html = document.documentElement;
                if (!html) return false;
                if (suppressOpening) html.dataset.qellyReviewSuppressOpening = 'true';
                if (holdOpening) html.dataset.qellyReviewHoldOpening = 'true';
                return true;
              };
              if (!applyReviewFlags()) {
                const observer = new MutationObserver(() => { if (applyReviewFlags()) observer.disconnect(); });
                observer.observe(document, { childList: true, subtree: true });
              }
              window.__qellyReviewMetrics = {""")
          replace_exact(renderer,"appearance: options.appearance || null, suppressOpening: Boolean(options.suppressOpening)\n            });","appearance: options.appearance || null, suppressOpening: Boolean(options.suppressOpening), holdOpening: Boolean(options.holdOpening)\n            });")
          replace_exact(renderer,"""async function gotoReady(page, route, meta, options = {}) {
            await page.goto(url(route), { waitUntil: 'domcontentloaded', timeout: options.navigationTimeout || 25000 });
            await waitForAppReady(page, route, options.readinessTimeout || 25000);""","""async function gotoReady(page, route, meta, options = {}) {
            const documentUrl = url(route).split('#')[0];
            try {
              await page.goto(documentUrl, { waitUntil: 'domcontentloaded', timeout: options.navigationTimeout || 25000 });
            } catch (error) {
              const recoverable = /interrupted by another navigation|Timeout 25000ms exceeded/.test(error.message || '');
              if (!recoverable) throw error;
            }
            await page.evaluate((expectedRoute) => {
              const current = location.hash.replace(/^#\\/?/, '').split('/')[0] || '';
              if (current !== expectedRoute) location.hash = `#/${expectedRoute}`;
            }, route);
            await waitForAppReady(page, route, options.readinessTimeout || 30000);""")
          replace_exact(renderer,"""    const overflow = Math.max(0, html.scrollWidth - html.clientWidth, body?.scrollWidth - html.clientWidth || 0);
              const memory = performance.memory ? {""","""    const overflow = Math.max(0, html.scrollWidth - html.clientWidth, body?.scrollWidth - html.clientWidth || 0);
              const overflowElements = [...document.querySelectorAll('body *')].map((element) => {
                const rect = element.getBoundingClientRect();
                return {
                  tag: element.tagName.toLowerCase(), id: element.id || null,
                  className: String(element.className || '').slice(0, 180),
                  left: Math.round(rect.left * 100) / 100, right: Math.round(rect.right * 100) / 100,
                  width: Math.round(rect.width * 100) / 100,
                  scrollWidth: element.scrollWidth, clientWidth: element.clientWidth
                };
              }).filter((item) => item.right > html.clientWidth + 1 || item.left < -1 || item.scrollWidth > item.clientWidth + 1)
                .sort((a, b) => (b.right - html.clientWidth) - (a.right - html.clientWidth)).slice(0, 20);
              const memory = performance.memory ? {""")
          replace_exact(renderer,'      overflow,\n      resourceTransferBytes:','      overflow, overflowElements,\n      resourceTransferBytes:')
          replace_exact(renderer,"await installReviewInit(context, { seen: repeat, suppressOpening: false, themeFamily: 'sovereign-obsidian', appearance: 'dark' });","await installReviewInit(context, { seen: repeat, suppressOpening: false, holdOpening: !repeat, themeFamily: 'sovereign-obsidian', appearance: 'dark' });")
          replace_exact(renderer,"await page.goto(url('market'), { waitUntil: 'domcontentloaded', timeout: 25000 });","await page.goto(url('market').split('#')[0], { waitUntil: 'domcontentloaded', timeout: 25000 }).catch((error) => { if (!/interrupted by another navigation|Timeout 25000ms exceeded/.test(error.message || '')) throw error; });\n    await page.evaluate(() => { if (!location.hash.replace(/^#\\/?/, '').startsWith('market')) location.hash = '#/market'; });")
          replace_exact(renderer,"""    let removalMs = null;
              if (!repeat) {
                await page.locator('.qelly-opening').waitFor({ state: 'detached', timeout: 3500 });
                removalMs = Date.now() - started;
                await waitForAppReady(page, 'market');
              }""","""    let removalMs = null;
              if (!repeat) {
                const configuredDuration = reduced ? 120 : 1180;
                await page.waitForTimeout(configuredDuration);
                await page.locator('.qelly-opening').click({ force: true });
                await page.locator('.qelly-opening').waitFor({ state: 'detached', timeout: 3500 });
                removalMs = Date.now() - started;
                await waitForAppReady(page, 'market');
              }""")

          test='tests/logo-brand-system.test.mjs'
          replace_exact(test,'  assert.match(value, /data-qelly-brand-hero/);','  assert.match(value, /data-qelly-brand-hero/);\n  assert.match(value, /width="304" height="84"/);\n  assert.match(value, /width="84" height="84"/);\n  assert.match(value, /qellyReviewHoldOpening/);')
          replace_exact(test,'  assert.match(value, /RENDERER_FAILURES\\.json/);','  assert.match(value, /RENDERER_FAILURES\\.json/);\n  assert.match(value, /applyReviewFlags/);\n  assert.match(value, /location\\.hash = `#\\/\\$\\{expectedRoute\\}`/);\n  assert.match(value, /overflowElements/);\n  assert.match(value, /holdOpening: !repeat/);')
          PY

      - name: Verify exact corrected files
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/public/assets/qelly-brand.mjs
          node --check scripts/logo-brand-review.mjs
          node --check tests/logo-brand-system.test.mjs
          test "$(sha256sum apps/web/public/assets/qelly-brand.mjs | cut -d' ' -f1)" = cd9df25356f287c45f74c3bee35eae1b2a864ed3c84633bfbdb9aacf6116c317
          test "$(sha256sum apps/web/public/assets/qelly-brand.css | cut -d' ' -f1)" = d7bb676cfc20109f0e971c0c54794a739804dbcffdec721e077bd85183517ac1
          test "$(sha256sum scripts/logo-brand-review.mjs | cut -d' ' -f1)" = 484b558546f766d5e80f2d591fee9899b57fe4ce83947271cec318480b3ec659
          test "$(sha256sum tests/logo-brand-system.test.mjs | cut -d' ' -f1)" = 9f2860b013dc7a47a513e47840dcf7077db24ef73ae27d8487a99cde8d883a7e
          test "$(git hash-object apps/web/public/assets/qelly-brand.mjs)" = 2a5ede3a3420df5eef7f4b41d3b50f1b113db922
          test "$(git hash-object apps/web/public/assets/qelly-brand.css)" = 30d3ee0597092ec3bb1cdeb54a4b56e0dcd5ef13
          test "$(git hash-object scripts/logo-brand-review.mjs)" = 87f9d2c4189e89d3a378fdcbfa9912794e73a0e9
          test "$(git hash-object tests/logo-brand-system.test.mjs)" = 0232e151e9eac4787d807b93d09b363db11b2c19
          ! grep -q "waitUntil: 'networkidle'" scripts/logo-brand-review.mjs
          grep -q 'width="304" height="84"' apps/web/public/assets/qelly-brand.mjs
          grep -q 'qellyReviewHoldOpening' apps/web/public/assets/qelly-brand.mjs
          node --test tests/logo-brand-system.test.mjs
          git diff --check

      - name: Commit verified compatibility correction
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/public/assets/qelly-brand.mjs apps/web/public/assets/qelly-brand.css scripts/logo-brand-review.mjs tests/logo-brand-system.test.mjs
          git diff --cached --check
          git config user.name 'Qelly Brand Automation'
          git config user.email 'hemangsah@users.noreply.github.com'
          git commit -m 'fix(brand-review): eliminate logo layout shifts and cross-browser races'
          git push origin HEAD:feature/logo-first-brand-system
