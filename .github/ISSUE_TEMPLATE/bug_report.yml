name: Bug report
description: Report a reproducible defect in Qelly Intelligence.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start the server\n2. Open route...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release or commit
      placeholder: "21.0.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend API, Data, Security, Accessibility, Build or deployment]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
