name: Qelly Typography Candidate Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/font-comparison-board.mjs'
      - 'scripts/font-comparison-board-local.mjs'
      - '.github/workflows/font-comparison.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/public/**'
      - 'packages/ui-primitives/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qelly-font-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-font-comparison:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ui-rescue-asset-rankings'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Inventory locked variable-font packages
        run: |
          mkdir -p /tmp/qelly-font-evidence
          find node_modules/@fontsource-variable -maxdepth 3 -type f \( -name '*.woff2' -o -name 'LICENSE' -o -name 'package.json' \) -print | sort | tee /tmp/qelly-font-evidence/package-files.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build current rejected static preview
        env:
          QELLY_STATIC_VISUAL_PREVIEW: 'true'
          QELLY_PUBLIC_BASE_PATH: /qelly-intelligence/
          QELLY_DEPLOYMENT_ENVIRONMENT: typography-candidate-review
        run: npm run build:frontend
      - name: Render typography comparison and baseline audit
        shell: bash
        run: |
          set +e
          node scripts/font-comparison-board-local.mjs 2>&1 | tee /tmp/qelly-font-evidence/render.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"
      - name: Collect comparison diagnostics
        if: always()
        run: |
          mkdir -p .font-review/diagnostics
          cp -f /tmp/qelly-font-evidence/* .font-review/diagnostics/ 2>/dev/null || true
      - name: Upload typography evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-font-comparison
          path: .font-review
          if-no-files-found: error
          retention-days: 14
