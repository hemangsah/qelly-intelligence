name: Qelly Prompt 2B Reconcile Contracts Governance

on:
  push:
    branches: [feature/calculator-and-indicator-foundation]
    paths: [.github/workflows/prompt2b-reconcile-contracts-governance.yml]

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-reconcile-contracts-governance
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "18f7efeff36e27361c06ff2fea524aa63b7ce707"
          test "$(git ls-remote origin refs/heads/feature/calculator-and-indicator-foundation | cut -f1)" = "$GITHUB_SHA"
      - name: Patch counts manifests and governance generator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,old,new,count=1):
              p=Path(path);s=p.read_text()
              if s.count(old)<count: raise SystemExit(f'guard missing in {path}: {old[:120]}')
              p.write_text(s.replace(old,new,count))

          p=Path('scripts/build-prompt2b-final-governance.mjs');s=p.read_text()
          start=s.index('const parity=`')
          end=s.index("await writeFile(path.join(state,'QELLY_PROMPT2B_FIGMA_PARITY_REPORT.md'),parity);",start)
          block="""const parity=[
          '# Qelly Prompt 2B Figma and Design Parity Reconciliation','',
          `Updated: ${new Date().toISOString()}`,'','## Count reconciliation','',
          '- historical canonical handoff: 61 routes / 411 frame records;',
          '- pre-fresh repository inventory: 66 routes / 421 frame records;',
          `- final Prompt 2B repository inventory: ${routeDefinitions.length} routes / ${screenRows.length} frame records;`,
          '- reconciled additions beyond the historical handoff: 9 routes / 18 default desktop-mobile frames;',
          `- current unmatched executable routes: ${unmatchedRoutes.length};`,
          `- current unmatched default route frames: ${routeDefinitions.length*2-mapRows.length}.`,'',
          `The nine reconciled routes are: ${historicalMissing.join(', ')}. The first five were the Prompt 2B centers absent from the older handoff; the final four are the completed detail experiences. The 18-frame difference is exactly one desktop and one mobile default frame per added route.`,'',
          '## Canonical decision','',
          `The executable branch and generated QELLY_SCREEN_MATRIX.csv are now canonical for Prompt 2B: ${routeDefinitions.length} routes and ${screenRows.length} governed frame records through ${screenRows.at(-1)?.frame_id}. The former 61/411 values remain historical evidence and are not silently reused.`,'',
          '## Generator and native-run truth','',
          '- deterministic repository Figma/design generation: supported and validated;',
          '- route-to-frame map: complete;',
          '- Prompt 2B center/detail representative editable masters: required in the plugin;',
          '- native authenticated Figma execution: unavailable in this environment and not claimed;',
          '- manual browser screenshot review: recorded separately after final exact-head capture.','',
          '## Design preservation','',
          'IBM Plex Sans Variable, the burgundy identity, green/red semantics, approved themes, continuous corners, source/freshness/confidence truth, keyboard operation and reduced-motion behavior remain mandatory. No broad redesign was performed.'
          ].join('\\n')+'\\n';
          """
          p.write_text(s[:start]+block+s[end:])

          plugin=Path('figma-plugin/code.js');s=plugin.read_text();marker='\n];\nconst rgb='
          additions=""",
          ['26 Quant Workbench','Calculator Center','desktop',1440,1000,'Research'],['29 Mobile','Calculator Center','mobile',390,844,'Research'],
          ['26 Quant Workbench','India Finance','desktop',1440,1000,'Research'],['29 Mobile','India Finance','mobile',390,844,'Research'],
          ['26 Quant Workbench','Formula Library','desktop',1440,1000,'Research'],['29 Mobile','Formula Library','mobile',390,844,'Research'],
          ['26 Quant Workbench','Formula Detail','desktop',1440,1000,'Research'],['29 Mobile','Formula Detail','mobile',390,844,'Research'],
          ['26 Quant Workbench','Indicator Library','desktop',1440,1000,'Research'],['29 Mobile','Indicator Library','mobile',390,844,'Research'],
          ['26 Quant Workbench','Indicator Detail','desktop',1440,1000,'Research'],['29 Mobile','Indicator Detail','mobile',390,844,'Research'],
          ['26 Quant Workbench','Calculator Detail','desktop',1440,1000,'Research'],['29 Mobile','Calculator Detail','mobile',390,844,'Research'],
          ['26 Quant Workbench','Saved Calculations','desktop',1440,1000,'Research'],['29 Mobile','Saved Calculations','mobile',390,844,'Research'],
          ['26 Quant Workbench','Saved Calculation Detail','desktop',1440,1000,'Research'],['29 Mobile','Saved Calculation Detail','mobile',390,844,'Research']"""
          if marker not in s: raise SystemExit('Figma array marker missing')
          plugin.write_text(s.replace(marker,additions+marker,1))

          replace('scripts/validate-design-foundations.mjs',"assert.equal(routeDefinitions.length,66);assert.equal(routeMatrix.trim().split('\\n').length-1,66);assert.ok(screenMatrix.trim().split('\\n').length-1>=421);","assert.equal(routeDefinitions.length,70);assert.equal(routeMatrix.trim().split('\\n').length-1,70);assert.equal(screenMatrix.trim().split('\\n').length-1,429);")
          replace('scripts/validate-design-foundations.mjs',"assert.ok(masterScreens.length>=24,'Figma generator must preserve editable desktop/mobile master frames');","assert.ok(masterScreens.length>=42,'Figma generator must preserve editable desktop/mobile master frames including Prompt 2B centers and details');")
          replace('apps/web/public/assets/calculation/persistence.mjs',"export const getSavedCalculation=savedId=>safe(read().items[indexOf(read(),savedId)]);","export const getSavedCalculation=savedId=>{const store=read();return safe(store.items[indexOf(store,savedId)]);};")

          replace('src/server/route-manifest.mjs',"'calculator-center','india-finance','indicator-library','formula-library','saved-calculations'];","'calculator-center','india-finance','indicator-library','formula-library','saved-calculations','formula-detail','indicator-detail','calculator-detail','saved-calculation-detail'];")
          replace('src/server/route-manifest.mjs',"'/api/v1/calculations/run','/api/v1/calculations/batch','/api/v1/calculations/saved','/api/v1/calculations/saved/:id','/api/v1/indicators'","'/api/v1/calculations/run','/api/v1/calculations/batch','/api/v1/calculations/saved','/api/v1/calculations/saved/:id','/api/v1/calculations/saved/:id/revisions','/api/v1/calculations/saved/:id/duplicate','/api/v1/calculations/saved/:id/restore','/api/v1/indicators'")

          replace('scripts/product-validate.mjs',"    'packages/migrations/107_calculator_indicator_foundation.sql',","    'packages/migrations/107_calculator_indicator_foundation.sql',\n    'packages/migrations/108_saved_calculation_lifecycle.sql',")
          replace('scripts/product-validate.mjs',"    'apps/web/public/assets/calculation/formula-engine.mjs',\n    'apps/web/public/assets/calculation/indicator-engine.mjs',","    'apps/web/public/assets/calculation/formula-engine.mjs',\n    'apps/web/public/assets/calculation/formula-engine-extended.mjs',\n    'apps/web/public/assets/calculation/fresh-formula-catalog.mjs',\n    'apps/web/public/assets/calculation/indicator-engine.mjs',\n    'apps/web/public/assets/calculation/indicator-engine-extended.mjs',\n    'apps/web/public/assets/calculation/fresh-indicator-catalog.mjs',")
          replace('scripts/product-validate.mjs',"    'apps/web/public/assets/routes/indicator-library.mjs',","    'apps/web/public/assets/routes/indicator-library.mjs',\n    'apps/web/public/assets/routes/formula-detail.mjs',\n    'apps/web/public/assets/routes/indicator-detail.mjs',\n    'apps/web/public/assets/routes/calculator-detail.mjs',\n    'apps/web/public/assets/routes/saved-calculation-detail.mjs',")
          replace('scripts/product-validate.mjs','routes: routes.length === 66','routes: routes.length === 70')
          replace('scripts/product-validate.mjs','apiContracts: apiRoutes.length === 199','apiContracts: apiRoutes.length === 202')
          replace('scripts/product-validate.mjs','schemas: schemas.length === 70','schemas: schemas.length === 72')

          replace('scripts/release-check.mjs','&& smoke.requests === 279','&& smoke.requests === 289')
          replace('scripts/release-check.mjs','|| routes.length !== 66','|| routes.length !== 70')
          replace('scripts/release-check.mjs','|| apiRoutes.length !== 199','|| apiRoutes.length !== 202')
          replace('scripts/release-check.mjs','|| schemas.length !== 70','|| schemas.length !== 72')

          replace('scripts/smoke.mjs','config.routes.length === 66 && config.apiRoutes.length === 199','config.routes.length === 70 && config.apiRoutes.length === 202')
          replace('scripts/smoke.mjs','config.waveStatus.part22 && config.schemaValidation.schemasLoaded === 70','config.waveStatus.part22 && config.schemaValidation.schemasLoaded === 72')
          replace('scripts/smoke.mjs','coverage.schemasLoaded === 70','coverage.schemasLoaded === 72')
          anchor="  const indicator=(await request('/api/v1/indicators/run',{method:'POST',body:{indicatorId:'sma',inputs:{close:[1,2,3,4,5],period:3}}})).json();\n  expect(indicator.status==='success'&&indicator.outputs.value.at(-1)===4,'deterministic indicator API invalid');"
          addition=anchor+"\n  const freshCalculation=(await request('/api/v1/calculations/run',{method:'POST',body:{formulaId:'fresh-present-value',inputs:{futureValue:110,rate:.1,periods:1}}})).json();\n  expect(freshCalculation.status==='success'&&Math.abs(freshCalculation.outputs.value-100)<1e-8&&freshCalculation.truthState==='FRESH_REIMPLEMENTATION_2026','fresh formula API invalid');\n  const freshIndicator=(await request('/api/v1/indicators/run',{method:'POST',body:{indicatorId:'fresh-price-momentum',inputs:{close:Array.from({length:30},(_,i)=>100+i),period:14}}})).json();\n  expect(freshIndicator.status==='success'&&freshIndicator.outputs.value.at(-1)===14&&freshIndicator.truthState==='FRESH_REIMPLEMENTATION_2026','fresh indicator API invalid');\n  const saved=(await request('/api/v1/calculations/saved',{method:'POST',status:201,body:{name:'Fresh PV smoke',result:freshCalculation,notes:'Lifecycle smoke',tags:['fresh','smoke'],favorite:true},headers:{'Idempotency-Key':'prompt2b-saved-create'}})).json();\n  const savedRead=(await request(`/api/v1/calculations/saved/${saved.id}`)).json();\n  expect(savedRead.version===1&&savedRead.formulaVersion==='2.0.0','saved calculation read invalid');\n  const savedUpdated=(await request(`/api/v1/calculations/saved/${saved.id}`,{method:'PATCH',body:{name:'Fresh PV updated',notes:'Updated smoke'},headers:{'Idempotency-Key':'prompt2b-saved-update'}})).json();\n  expect(savedUpdated.version===2&&savedUpdated.revisions.length===2,'saved calculation update invalid');\n  const duplicate=(await request(`/api/v1/calculations/saved/${saved.id}/duplicate`,{method:'POST',status:201,body:{name:'Fresh PV duplicate'},headers:{'Idempotency-Key':'prompt2b-saved-duplicate'}})).json();\n  const savedRevisions=(await request(`/api/v1/calculations/saved/${saved.id}/revisions`)).json();\n  const firstRevision=savedRevisions.items.find(item=>item.version===1);\n  const savedRestored=(await request(`/api/v1/calculations/saved/${saved.id}/restore`,{method:'POST',body:{revisionId:firstRevision.revisionId},headers:{'Idempotency-Key':'prompt2b-saved-restore'}})).json();\n  expect(savedRestored.version===3&&savedRestored.name==='Fresh PV smoke','saved revision restore invalid');\n  await request(`/api/v1/calculations/saved/${duplicate.id}`,{method:'DELETE',headers:{'Idempotency-Key':'prompt2b-saved-delete-duplicate'}});\n  await request(`/api/v1/calculations/saved/${saved.id}`,{method:'DELETE',headers:{'Idempotency-Key':'prompt2b-saved-delete-original'}});"
          if anchor not in Path('scripts/smoke.mjs').read_text(): raise SystemExit('smoke insertion anchor missing')
          replace('scripts/smoke.mjs',anchor,addition)
          replace('scripts/smoke.mjs','deterministicCalculations:true,deterministicIndicators:true,indiaCustomCharges:true','deterministicCalculations:true,deterministicIndicators:true,freshCatalog:true,savedCalculationLifecycle:true,indiaCustomCharges:true')
          PY
          node --check scripts/build-prompt2b-final-governance.mjs
          node --check scripts/product-validate.mjs
          node --check scripts/release-check.mjs
          node --check scripts/smoke.mjs
          node --check src/server/route-manifest.mjs
      - name: Run reconciled contract governance gates
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run inventory:design
          node scripts/build-prompt2b-final-governance.mjs
          npm run validate:design
          node --test tests/fresh-formula-catalog.test.mjs tests/fresh-indicator-catalog.test.mjs tests/calculation-service-parity.test.mjs tests/browser-saved-calculation-lifecycle.test.mjs tests/saved-calculation-lifecycle.test.mjs tests/saved-calculation-store.test.mjs
          npm run validate:product
          npm run inventory:product
          npm run smoke
          npm run release:check
          test "$(node -e "import('./src/server/route-manifest.mjs').then(m=>console.log(m.routes.length))")" = 70
          test "$(node -e "import('./src/server/route-manifest.mjs').then(m=>console.log(m.apiRoutes.length))")" = 202
      - name: Commit exact reconciliation and remove one-use workflow
        run: |
          set -euo pipefail
          rm .github/workflows/prompt2b-reconcile-contracts-governance.yml
          rm -f project-state/QELLY_PROMPT2B_FINAL_GOVERNANCE_GATE_FAILURE.md
          git config user.name hemangsah
          git config user.email hemangsah.dn@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix(prompt2b): reconcile final catalogs routes and governance"
          git push origin HEAD:feature/calculator-and-indicator-foundation
