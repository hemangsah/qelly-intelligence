name: Browser E2E
on:
  pull_request:
    branches: [main, release/qelly-global-public-beta]
    types: [opened, synchronize, reopened]
    # Required by branch protection: every PR head must produce this check,
    # including workflow-only and documentation-only maintenance.
  push:
    branches: [main, release/qelly-global-public-beta]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: qelly-all-screens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QELLY_CSS_EXPERIMENT_BASELINE: preview/css-import-baseline
      QELLY_SCREEN_BATCH_SIZE: '10'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Guard exact evidence head
        run: test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated visual evidence runtime
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          timeout 5m python -m playwright install chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Validate exact production artifact before browser capture
        run: |
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run security:scan
          npm test
          npm run build:frontend
          test -s dist/frontend/index.html
          test -s dist/frontend/qelly-config.js
          grep -F '"emailDelivery":true' dist/frontend/qelly-config.js
          grep -F "renderGovernedUnavailable" dist/frontend/assets/app.js
          grep -F "renderConverterWorkspace" dist/frontend/assets/app.js
          test -s dist/frontend/assets/routes/converter.mjs
          test -s dist/frontend/assets/routes/converter-v3.css
          test -s dist/frontend/assets/routes/asset-intelligence-v2.css
          test -s dist/frontend/assets/routes/advanced-chart-v2.css
          test -s dist/frontend/assets/routes/fundamentals-estimates-v2.css
          test -s dist/frontend/assets/routes/filing-workspace-v2.css
          test -s dist/frontend/assets/routes/event-calendar-v2.css
          test -s dist/frontend/assets/routes/comparison-lab-v2.css
          test -s dist/frontend/assets/routes/alert-rules-v2.css
          test -s dist/frontend/assets/routes/notification-triage-v2.css
          test -s dist/frontend/assets/routes/screener-lab-v2.css
          grep -F "renderGovernedTrustCenterV2" dist/frontend/assets/app.js
      - name: Verify source-owned DEX controls and governed research interactions
        run: node scripts/qelly-dex-workstation-e2e.mjs
        env:
          QELLY_DEX_CONTROL_MATRIX: true
      - name: Upload focused DEX control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/dex-control-e2e
          if-no-files-found: warn
      - name: Verify Decision selected-range interaction
        run: node scripts/qelly-decision-range-selection-e2e.mjs
      - name: Verify open About presentation and existing capability truth
        run: node scripts/qelly-about-editorial-e2e.mjs
      - name: Upload focused About editorial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-about-editorial-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/about-editorial-e2e
          if-no-files-found: warn
      - name: Verify Market borderless surfaces and control continuity
        run: node scripts/qelly-market-boxless-e2e.mjs
      - name: Upload focused Market borderless evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-market-boxless-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/market-boxless-e2e
          if-no-files-found: warn
      - name: Verify chart plot clearance and keyboard Chat access
        run: node scripts/qelly-chart-dock-clearance-e2e.mjs
      - name: Upload chart clearance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-chart-clearance-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/chart-dock-clearance-e2e
          if-no-files-found: warn
      - name: Verify Market embedded chart clearance and keyboard access
        run: node scripts/qelly-market-chart-clearance-e2e.mjs
      - name: Upload Market chart clearance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-market-chart-clearance-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/market-chart-clearance-e2e
          if-no-files-found: warn
      - name: Verify global chat keyboard focus and mobile containment
        run: node scripts/qelly-chat-keyboard-e2e.mjs
      - name: Upload focused Chat editorial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-chat-editorial-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/chat-keyboard-e2e
          if-no-files-found: warn
      - name: Verify canonical brand tokens and engine ownership
        run: node scripts/qelly-brand-foundation-e2e.mjs
      - name: Upload focused canonical brand evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-brand-foundation-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/brand-foundation-e2e
          if-no-files-found: warn
      - name: Measure pinned baseline and corrected tooltip observer work
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qelly-tooltip-performance-e2e.mjs
      - name: Upload focused tooltip performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-tooltip-performance-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/tooltip-performance-e2e
          if-no-files-found: warn
      - name: Verify boxless Asset Dossier geometry and existing volume evidence
        run: node scripts/qelly-asset-dossier-boxless-e2e.mjs
      - name: Upload focused Asset Dossier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-asset-dossier-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/asset-dossier-boxless-e2e
          if-no-files-found: warn
      - name: Measure shell annotation feedback and external-update behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qelly-shell-observer-e2e.mjs
      - name: Upload focused shell observer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-shell-observer-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/shell-observer-e2e
          if-no-files-found: warn
      - name: Verify open Feature Universe directory and local search
        run: node scripts/qelly-feature-index-e2e.mjs
      - name: Upload focused Feature Universe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-feature-index-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/feature-index-e2e
          if-no-files-found: warn
      - name: Verify MT5 open report presentation and stylesheet readiness
        run: node scripts/qelly-mt5-editorial-e2e.mjs
      - name: Upload focused MT5 editorial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-mt5-editorial-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/mt5-editorial-e2e
          if-no-files-found: warn
      - name: Verify converter open presentation and preserved cost scenarios
        run: node scripts/qelly-converter-editorial-e2e.mjs
      - name: Upload focused converter editorial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-converter-editorial-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/converter-editorial-e2e
          if-no-files-found: warn
      - name: Compare original CSS imports and consolidated cascade
        run: node scripts/qelly-css-import-e2e.mjs
      - name: Upload focused CSS import evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-css-import-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/css-import-e2e
          if-no-files-found: warn
      - name: Verify closed feature drawer paint, focus and responsive state
        run: node scripts/qelly-feature-drawer-state-e2e.mjs
      - name: Upload focused feature drawer state evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-feature-drawer-state-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/feature-drawer-state-e2e
          if-no-files-found: warn
      - name: Verify open Verification surfaces and governed interactions
        run: node scripts/qelly-verify-editorial-e2e.mjs
      - name: Upload focused Verification editorial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-verify-editorial-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/verify-editorial-e2e
      - name: Verify governed crypto reference model
        run: node --test tests/crypto-converter-model.test.mjs
      - name: Verify crypto converter coverage, failure and responsive states
        run: node scripts/qelly-crypto-converter-e2e.mjs
      - name: Upload focused crypto converter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-crypto-converter-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/crypto-converter-e2e
          if-no-files-found: warn
      - name: Verify compact desktop Decision actions and preserved expert depth
        run: node scripts/qelly-decision-compact-hero-e2e.mjs

      - name: Upload focused compact Decision hero evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-decision-compact-hero-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/decision-compact-hero-e2e
          if-no-files-found: error

      - name: Verify chart-first Decision presentation and expert depth
        run: node scripts/qelly-decision-editorial-e2e.mjs
      - name: Upload focused Decision editorial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-decision-editorial-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/decision-editorial-e2e
          if-no-files-found: warn
      - name: Verify static evidence table clearance and keyboard Chat access
        run: node scripts/qelly-static-evidence-clearance-e2e.mjs
      - name: Upload focused static evidence clearance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-static-evidence-clearance-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: preview/static-evidence-clearance-e2e
          if-no-files-found: warn
      - name: Verify header pointer travel, keyboard, touch and search geometry
        run: node scripts/qelly-header-pointer-e2e.mjs
      - name: Verify exact deployed header with actual governed responses
        env:
          QELLY_HEADER_LIVE: 'true'
          QELLY_HEADER_PREVIEW: ${{ github.event_name == 'pull_request' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qelly-header-pointer-e2e.mjs
      - name: Verify exact deployed header at actual browser zoom
        env:
          QELLY_HEADER_LIVE: 'true'
          QELLY_HEADER_ACTUAL_ZOOM: 'true'
          QELLY_HEADER_PREVIEW: ${{ github.event_name == 'pull_request' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qelly-header-pointer-e2e.mjs
      - name: Verify DEX research interactions and unavailable data boundaries
        run: node scripts/qelly-dex-workstation-e2e.mjs
      - name: Verify exact deployed DEX with actual governed responses
        env:
          QELLY_DEX_LIVE: 'true'
          QELLY_DEX_PREVIEW: ${{ github.event_name == 'pull_request' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qelly-dex-workstation-e2e.mjs
      - name: Upload DEX research interaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-workstation-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: |
            preview/dex-workstation-e2e
            preview/dex-workstation-live-e2e
      - name: Verify signed calculator scenarios and input boundaries
        run: node scripts/qelly-calculator-input-e2e.mjs
      - name: Verify identity linking consent and fail-closed profile controls
        run: node scripts/qelly-identity-linking-e2e.mjs
      - name: Verify Market Pulse daily ECB reference provenance
        run: node scripts/qelly-market-ecb-date-e2e.mjs
      - name: Validate cold and warm first-paint stability
        run: node scripts/qelly-first-paint-stability.mjs
      - name: Capture every registered route in both themes at desktop and mobile widths
        run: npm run browser:all
      - name: Verify local MT5 HTML and XLSX upload interactions
        run: node scripts/qelly-mt5-upload-e2e.mjs
      - name: Validate accessibility and responsive interaction contracts
        run: |
          npm run a11y
          cp validation/RELEASE_A5_ACCESSIBILITY_REGRESSION.json preview/release-a5-all-screens/accessibility-regression.json
          python -X utf8 scripts/release-a5-screen-package.py
      - name: Verify screenshot and archive contract
        run: |
          node scripts/qelly-screen-package-integrity.mjs
          node --input-type=module <<'NODE'
          import {readFile,readdir,stat} from 'node:fs/promises';
          import {routeDefinitions} from './apps/web/public/assets/route-registry.mjs';
          const manifest=JSON.parse(await readFile('preview/release-a5-all-screens/manifest.json','utf8'));
          const {validateScreenThemeMatrix}=await import('./scripts/qelly-screen-theme-contract.mjs');
          const matrix=validateScreenThemeMatrix(manifest,routeDefinitions);
          const accessibility=JSON.parse(await readFile('preview/release-a5-all-screens/accessibility-regression.json','utf8'));
          const files=await readdir('preview/release-a5-all-screens');
          const pngs=files.filter(name=>name.endsWith('.png'));
          const archives=(await readdir('preview')).filter(name=>/^QELLY_ALL_SCREENS_[0-9a-f]{12}\.zip$/.test(name));
          const archiveSize=archives.length===1?(await stat(`preview/${archives[0]}`)).size:0;
          const expectedRoutes=routeDefinitions.length;
          const expectedRenders=expectedRoutes*4;
          const registered=new Set(routeDefinitions.map(route=>route.route));
          const exactArchive='QELLY_ALL_SCREENS_'+process.env.QELLY_SCREEN_EVIDENCE_SHA.slice(0,12)+'.zip';
          const ok=matrix.passed&&expectedRoutes>=72&&registered.size===expectedRoutes
            &&manifest.status==='passed'&&manifest.routeCount===expectedRoutes
            &&manifest.themeCount===2&&manifest.viewportCount===2&&manifest.duplicateCount===0
            &&manifest.renders.every(item=>['dark','light'].includes(item.appearance)&&item.resolvedAppearance===item.appearance)
            &&new Set(manifest.renders.map(item=>`${item.route}/${item.viewport}/${item.appearance}`)).size===expectedRenders
            &&manifest.renderCount===expectedRenders&&manifest.expectedRenderCount===expectedRenders
            &&pngs.length===expectedRenders&&manifest.failed===0&&manifest.missing.length===0
            &&accessibility.status==='passed'&&accessibility.checks>0
            &&validateScreenThemeMatrix({...accessibility,renders:accessibility.results,renderCount:accessibility.checks,expectedRenderCount:accessibility.expectedChecks},routeDefinitions).passed
            &&archives.length===1&&archives[0]===exactArchive&&archiveSize>0;
          console.log(JSON.stringify({expectedRoutes,expectedRenders,routeCount:manifest.routeCount,renderCount:manifest.renderCount,pngs:pngs.length,accessibilityChecks:accessibility.checks,accessibilityStatus:accessibility.status,archives,archiveSize,status:manifest.status},null,2));
          if(!ok)process.exit(1);
          NODE
      - name: Upload focused header interaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-header-pointer-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: |
            preview/header-pointer-e2e
            preview/header-live-e2e
            preview/header-zoom-e2e
      - name: Upload complete or diagnostic screen evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qelly-complete-all-screens-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: |
            preview/QELLY_ALL_SCREENS_*.zip
            preview/release-a5-all-screens
            preview/RELEASE_A5_ALL_SCREENS_LOG.json
            preview/first-paint-stability
            preview/decision-range-e2e
            preview/mt5-upload-e2e
            preview/chat-keyboard-e2e
            preview/calculator-input-e2e
            preview/identity-linking-e2e
            preview/market-ecb-date-e2e
            validation/RELEASE_A5_ACCESSIBILITY_REGRESSION.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  verify-published-evidence:
    name: Verify published browser evidence in cloud
    needs: capture-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Guard exact validator head
        run: test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Download published complete evidence to hosted runner only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qelly-complete-all-screens-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: ${{ runner.temp }}/qelly-published-browser-evidence
          digest-mismatch: error
      - name: Verify all checksums and inherited acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-published-browser-evidence.mjs "$QELLY_SCREEN_EVIDENCE_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/qelly-published-browser-evidence" "$RUNNER_TEMP/qelly-cloud-evidence-receipt.json"
      - name: Retain compact cloud verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qelly-cloud-evidence-receipt-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: ${{ runner.temp }}/qelly-cloud-evidence-receipt.json
          if-no-files-found: error
          retention-days: 30
