<!doctype html>
<html lang="en" data-theme="burgundy-command" data-density="comfortable" data-motion="full" data-font-scale="100" data-app-ready="false" data-theme-ready="false" data-brand-ready="false" data-appearance="dark" data-theme-family="sovereign-obsidian">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6F1838">
  <meta name="description" content="Qelly Intelligence: evidence-backed market discovery, quantitative research and decision tools with transparent provider truth.">
  <title>Qelly Intelligence · Verifiable Market Intelligence</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#6F1838">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./assets/fonts/ibm-plex-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <script>
  (()=>{
    const root=document.documentElement;
    let saved={};
    try{saved=JSON.parse(localStorage.getItem('qelly.theme-intelligence.v2')||'{}')}catch{}
    const requested=saved.appearance||'dark';
    const dark=matchMedia('(prefers-color-scheme: dark)').matches;
    const contrast=matchMedia('(prefers-contrast: more)').matches;
    const appearance=requested==='system'?(contrast?'high-contrast':dark?'dark':'light'):(requested==='scheduled'?'dark':requested);
    root.dataset.appearance=appearance;
    root.dataset.themeFamily=saved.themeFamily||'sovereign-obsidian';
    root.dataset.themePersona=saved.persona||'quant-operator';
    root.style.colorScheme=appearance==='light'?'light':'dark';
    root.dataset.themeReady='true';
  })();
  </script>
  <style>html[data-app-ready="false"] .q-app{visibility:hidden}</style>
  <link rel="stylesheet" href="./assets/tokens.css">
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="stylesheet" href="./assets/qelly-sovereign-v2.css">
  <link rel="stylesheet" href="./assets/qelly-sovereign-v3.css">
  <link rel="stylesheet" href="./assets/qelly-foundations.css">
  <link rel="stylesheet" href="./assets/ui-rescue.css">
  <link rel="stylesheet" href="./assets/qelly-premium-reset.css">
  <link rel="stylesheet" href="./assets/theme-intelligence.css">
  <link rel="stylesheet" href="./assets/qelly-brand.css">
  <link rel="stylesheet" href="./assets/qelly-brand-visual-correction.css">
  <link rel="stylesheet" href="./assets/qelly-worldclass-uiux.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app" class="q-app">
    <header class="q-global-strip" aria-label="Market context">
      <div class="q-brand-mark" aria-label="Qelly Intelligence home"><span>Q</span><strong>QELLY INTELLIGENCE</strong></div>
      <div id="macro-strip" class="q-macro-strip" aria-live="polite"></div>
      <div class="q-truth-chip"><span class="q-status q-status--cached">READ ONLY</span><span>Source evidence · safe degraded mode</span></div>
    </header>
    <header class="q-command-bar" aria-label="Qelly navigation">
      <button id="rail-toggle" hidden type="button" aria-expanded="false">Open navigation</button>
      <div id="workspace-switcher" class="q-workspace-switcher"><span>Qelly Intelligence</span><strong>Market intelligence</strong><small>Evidence-backed research and calculation</small></div>
      <button id="command-button" class="q-command-trigger" aria-label="Search Qelly" aria-keyshortcuts="Control+K Meta+K"><span><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></span><span>Search assets, formulas and indicators</span><kbd>Ctrl K</kbd></button>
      <div class="q-command-actions">
        <select id="state-selector" hidden aria-hidden="true" tabindex="-1"><option value="default">Default</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="partial">Partial</option><option value="error">Error</option><option value="offline">Offline</option><option value="stale">Stale</option><option value="delayed">Delayed</option><option value="simulated">Simulated</option></select>
        <select id="global-theme-selector" hidden aria-hidden="true" tabindex="-1"><option value="burgundy-command">Burgundy</option><option value="porcelain-burgundy">Porcelain</option><option value="burgundy-night">Night</option><option value="graphite-terminal">Graphite</option><option value="midnight-research">Midnight</option><option value="high-contrast">High contrast</option></select>
        <button id="notification-button" hidden type="button">Notifications</button>
        <button id="theme-shortcut" class="q-icon-button" aria-label="Toggle appearance" title="Toggle appearance"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.25"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <a class="q-avatar" href="#/auth-login" aria-label="Open Qelly account">QI</a>
      </div>
    </header>
    <nav id="persona-ribbon" class="q-persona-ribbon" aria-label="Qelly operating modes"></nav>
    <div id="context-shelf" class="q-context-shelf"></div>
    <div class="q-shell">
      <aside id="edge-dock" class="q-edge-dock" aria-label="Product domains"></aside>
      <aside id="rail" class="q-rail" aria-label="Primary navigation">
        <nav id="primary-nav"></nav>
        <div class="q-rail-footer">
          <div class="q-provider-mini"><span class="q-provider-pulse"></span><div><strong>Data status</strong><small>Source · freshness · confidence</small></div></div>
          <button id="collapse-rail" class="q-rail-collapse" aria-label="Close navigation"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m14.5 5-7 7 7 7"/></svg></button>
        </div>
      </aside>
      <main id="main" tabindex="-1"></main>
      <aside id="context-drawer" class="q-context-drawer" aria-label="Context and source inspector" aria-hidden="true">
        <div class="q-context-head"><div><p class="q-eyebrow">Inspector</p><h2>Source context</h2></div><button id="close-context" class="q-icon-button" aria-label="Close source inspector"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div id="context-content" class="q-context-content"></div>
      </aside>
    </div>
    <div id="compare-tray" class="q-compare-tray" aria-label="Persistent intelligence actions"><span><strong>Compare tray</strong><small>No assets selected</small></span><div><button type="button" data-watchlist-open>Watchlist</button><button type="button" data-compare-open>Compare</button><button type="button" data-explain-open>Explain This Move</button></div></div>
    <nav id="mobile-navigation" class="q-mobile-navigation" aria-label="Mobile navigation"></nav>
  </div>
  <script src="./qelly-config.js"></script>
  <script type="module" src="./assets/theme-intelligence-bootstrap.mjs"></script>
  <script type="module" src="./assets/qelly-brand.mjs"></script>
  <script type="module" src="./assets/qelly-brand-visual-correction.mjs"></script>
  <script type="module" src="./assets/qelly-shell-compat.js"></script>
  <script type="module" src="./assets/app.js"></script>
  <script type="module" src="./assets/qelly-product-route-guard.mjs"></script>
  <script type="module" src="./assets/qelly-worldclass-uiux.mjs"></script>
  <script type="module">
    const root=document.documentElement;
    const main=document.getElementById('main');
    const routeReady=new Promise((resolve)=>{
      const complete=()=>main.childElementCount>0&&main.getAttribute('aria-busy')!=='true';
      if(complete()){resolve();return;}
      const observer=new MutationObserver(()=>{if(complete()){observer.disconnect();resolve();}});
      observer.observe(main,{attributes:true,childList:true,subtree:true,attributeFilter:['aria-busy']});
    });
    const reveal=()=>{root.dataset.appReady='true';};
    window.addEventListener('error',reveal,{once:true});
    window.addEventListener('unhandledrejection',reveal,{once:true});
    try{
      await Promise.all([document.fonts?.load('400 1em "Qelly IBM Plex Sans"')??Promise.resolve(),routeReady]);
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    }finally{reveal();}
  </script>
  <script type="module" src="./assets/qelly-sovereign-motion.js"></script>
</body>
</html>
