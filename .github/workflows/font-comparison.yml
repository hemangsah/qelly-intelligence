name: Qelly IBM Plex Governance Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/public/**'
      - 'figma-plugin/**'
      - 'figma-theme-plugin/**'
      - 'design/figma/**'
      - '.github/workflows/font-comparison.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qelly-typography-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-canonical-font:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ui-rescue-asset-rankings' || github.head_ref == 'feature/logo-first-brand-system' || github.head_ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify permanent IBM Plex lock
        run: |
          grep -q 'IBM Plex Sans Variable permanent canonical font' apps/web/public/assets/theme-intelligence.mjs
          grep -q 'GT Eesti inactive licence gate' apps/web/public/assets/theme-intelligence.mjs
          grep -q 'ibm-plex-sans-variable.woff2' apps/web/public/index.html
          ! grep -RInE '@font-face[^}]+GT Eesti|font-family:[^;]*(Geist|Manrope|Plus Jakarta)' apps/web/public/assets/theme-intelligence.css apps/web/public/assets/routes/theme-intelligence-studio.mjs
      - name: Build governed static frontend
        env:
          QELLY_STATIC_VISUAL_PREVIEW: 'true'
          QELLY_PUBLIC_BASE_PATH: /qelly-intelligence/
          QELLY_DEPLOYMENT_ENVIRONMENT: typography-governance
        run: npm run build:frontend
      - name: Verify shipped font resources
        run: |
          test -f dist/frontend/assets/fonts/ibm-plex-sans-variable.woff2
          test -f dist/frontend/assets/fonts/ibm-plex-sans-variable.woff2.LICENSE.txt
          count=$(find dist/frontend/assets/fonts -name '*.woff2' | wc -l)
          test "$count" -eq 1
          test -z "$(find dist/frontend \( -iname '*geist*.woff2' -o -iname '*manrope*.woff2' -o -iname '*jakarta*.woff2' \) -print -quit)"
