name: Chat Composer Focused Diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate source to test without production writes
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate exact source identifier
        run: '[[ "$QELLY_SCREEN_EVIDENCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies only in cloud
        run: npm ci --ignore-scripts
      - name: Install official cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify 18 composer and workspace interaction cases without Chat messages
        run: >-
          node --input-type=module -e 'import {chromium} from "playwright"; process.env.QELLY_BROWSER_EXECUTABLE=chromium.executablePath(); await import("./scripts/qelly-chat-keyboard-e2e.mjs");'
      - name: Retain source-bound diagnostic evidence in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-chat-editorial-focused-${{ inputs.candidate_sha }}
          path: preview/chat-keyboard-e2e
          retention-days: 7
