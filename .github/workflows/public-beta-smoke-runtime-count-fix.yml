name: Qelly Public Beta Runtime Schema Count Fix

on:
  push:
    branches: [release/qelly-public-beta-v1]
    paths:
      - '.github/workflows/public-beta-smoke-runtime-count-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/qelly-public-beta-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Patch runtime schema assertions and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'schemasLoaded === 65' scripts/smoke.mjs | wc -l)" -eq 2
          sed -i 's/schemasLoaded === 65/schemasLoaded === 67/g' scripts/smoke.mjs
          test "$(grep -o 'schemasLoaded === 67' scripts/smoke.mjs | wc -l)" -eq 2
          git rm .github/workflows/public-beta-smoke-runtime-count-fix.yml
          git diff --check
          git config user.name 'Qelly Foundation Automation'
          git config user.email 'hemangsah@users.noreply.github.com'
          git add scripts/smoke.mjs
          git commit -m 'fix(beta): align runtime schema smoke evidence'
          git push origin HEAD:release/qelly-public-beta-v1
