name: Qelly Corrective Branch Validation

on:
  push:
    branches:
      - 'agent/qelly-*'
  pull_request:
    branches:
      - 'release/qelly-global-public-beta'
      - 'agent/qelly-*'

permissions:
  contents: read

concurrency:
  group: qelly-corrective-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete Node test suite
        run: npm test

      - name: Build Cloudflare frontend bundle
        run: npm run build:frontend
