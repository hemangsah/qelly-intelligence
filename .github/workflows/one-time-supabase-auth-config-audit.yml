name: One-time Supabase Auth config audit

on:
  push:
    branches:
      - release/qelly-global-public-beta
    paths:
      - .github/workflows/one-time-supabase-auth-config-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ssdgfgqnjlwzkgukzeef
    steps:
      - name: Read and redact Auth SMTP configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            printf '%s\n' '{"managementTokenAvailable":false,"reason":"SUPABASE_ACCESS_TOKEN repository secret is not configured"}' > auth-smtp-audit.json
            exit 0
          fi

          status="$(curl --silent --show-error --max-time 30 \
            -o auth-config-raw.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")"

          export STATUS="${status}"
          python3 - <<'PY'
          import json, os
          status = os.environ['STATUS']
          result = {'managementTokenAvailable': True, 'httpStatus': int(status)}
          try:
              with open('auth-config-raw.json', 'r', encoding='utf-8') as fh:
                  payload = json.load(fh)
          except Exception:
              payload = {}

          if status == '200' and isinstance(payload, dict):
              password = payload.get('smtp_pass')
              result.update({
                  'smtp_admin_email': payload.get('smtp_admin_email'),
                  'smtp_host': payload.get('smtp_host'),
                  'smtp_port': payload.get('smtp_port'),
                  'smtp_user': payload.get('smtp_user'),
                  'smtp_sender_name': payload.get('smtp_sender_name'),
                  'smtp_max_frequency': payload.get('smtp_max_frequency'),
                  'external_email_enabled': payload.get('external_email_enabled'),
                  'mailer_autoconfirm': payload.get('mailer_autoconfirm'),
                  'smtp_password_configured': bool(password),
              })
          else:
              result['retrievalSucceeded'] = False

          with open('auth-smtp-audit.json', 'w', encoding='utf-8') as fh:
              json.dump(result, fh, indent=2, sort_keys=True)
          PY
          rm -f auth-config-raw.json

      - name: Upload redacted audit
        uses: actions/upload-artifact@v4
        with:
          name: supabase-auth-smtp-audit-${{ github.run_id }}
          path: auth-smtp-audit.json
          if-no-files-found: error
          retention-days: 1
