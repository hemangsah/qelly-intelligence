name: Qelly V5.3 Canonical Shell A-B Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/qelly-v53-force-legacy-build.mjs'
      - 'scripts/qelly-v53-force-canonical-shell-build.mjs'
      - '.github/workflows/qelly-v53-forced-legacy-visual-evidence.yml'
      - 'scripts/qelly-v53-activation-audit.mjs'
      - 'tests/qelly-v53-activation-contract.test.mjs'

permissions:
  contents: read

concurrency:
  group: qelly-v53-canonical-shell-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-shell-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QELLY_SCREEN_BATCH_SIZE: '10'
      QELLY_V53_FORCE_LEGACY_EVIDENCE: 'true'
      QELLY_V53_CANONICAL_SHELL_EVIDENCE: 'true'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact evidence head
        run: test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install isolated visual evidence runtime
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium

      - name: Validate source and build normal frontend
        run: |
          npm run env:check
          npm run typecheck
          npm run lint
          npm run security:scan
          node --test tests/qelly-v53-activation-contract.test.mjs
          npm run build:frontend

      - name: Force canonical shell in disposable build only
        run: |
          node scripts/qelly-v53-force-canonical-shell-build.mjs | tee qelly-v53-canonical-shell-build.json
          grep -F 'staticVisualPreview:false/* qelly-v53-canonical-shell-evidence */' dist/frontend/qelly-config.js
          grep -F 'staticVisualPreview:true' apps/web/public/qelly-config.js
          ! grep -F 'qelly-v53-canonical-shell-evidence' apps/web/public/qelly-config.js
          git diff --exit-code -- apps/web/public/qelly-config.js apps/web/public/index.html apps/web/public/assets/qelly-ui-lock-v5-3.css apps/web/public/assets/qelly-ui-lock-v5-3.mjs apps/web/public/assets/qelly-v53-visible-refinement.css

      - name: Capture canonical shell under current activation contract
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$PWD"
          OUT="$ROOT/preview/release-a5-all-screens"
          DEST="$ROOT/preview/v53-canonical-current"
          rm -rf "$OUT" "$DEST"
          mkdir -p "$OUT"
          ROUTE_COUNT="$(node --input-type=module -e "import {routeDefinitions} from './apps/web/public/assets/route-registry.mjs'; process.stdout.write(String(routeDefinitions.length));")"
          BATCH_SIZE="$QELLY_SCREEN_BATCH_SIZE"
          batch_failures=0
          for ((start=0; start<ROUTE_COUNT; start+=BATCH_SIZE)); do
            end=$((start+BATCH_SIZE))
            if [ "$end" -gt "$ROUTE_COUNT" ]; then end="$ROUTE_COUNT"; fi
            python3 "$ROOT/scripts/release-a5-screen-batch.py" "$start" "$end" || batch_failures=$((batch_failures+1))
          done
          python3 "$ROOT/scripts/release-a5-screen-aggregate.py" || true
          cp -a "$OUT" "$DEST"
          echo "current_batch_failures=$batch_failures" >> "$GITHUB_ENV"

      - name: Force legacy contract in canonical-shell disposable build
        run: |
          node scripts/qelly-v53-force-legacy-build.mjs | tee qelly-v53-forced-legacy-build.json
          grep -F 'data-qelly-v53-forced-legacy-evidence="true"' dist/frontend/index.html
          ! grep -F 'data-qelly-v53-forced-legacy-evidence="true"' apps/web/public/index.html
          git diff --exit-code -- apps/web/public/qelly-config.js apps/web/public/index.html apps/web/public/assets/qelly-ui-lock-v5-3.css apps/web/public/assets/qelly-ui-lock-v5-3.mjs apps/web/public/assets/qelly-v53-visible-refinement.css

      - name: Capture canonical shell under forced legacy activation
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$PWD"
          OUT="$ROOT/preview/release-a5-all-screens"
          DEST="$ROOT/preview/v53-canonical-legacy"
          rm -rf "$OUT" "$DEST"
          mkdir -p "$OUT"
          ROUTE_COUNT="$(node --input-type=module -e "import {routeDefinitions} from './apps/web/public/assets/route-registry.mjs'; process.stdout.write(String(routeDefinitions.length));")"
          BATCH_SIZE="$QELLY_SCREEN_BATCH_SIZE"
          batch_failures=0
          for ((start=0; start<ROUTE_COUNT; start+=BATCH_SIZE)); do
            end=$((start+BATCH_SIZE))
            if [ "$end" -gt "$ROUTE_COUNT" ]; then end="$ROUTE_COUNT"; fi
            python3 "$ROOT/scripts/release-a5-screen-batch.py" "$start" "$end" || batch_failures=$((batch_failures+1))
          done
          python3 "$ROOT/scripts/release-a5-screen-aggregate.py" || true
          cp -a "$OUT" "$DEST"
          echo "legacy_batch_failures=$batch_failures" >> "$GITHUB_ENV"

      - name: Compare canonical-shell A-B manifests
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const current=JSON.parse(await readFile('preview/v53-canonical-current/manifest.json','utf8'));
          const legacy=JSON.parse(await readFile('preview/v53-canonical-legacy/manifest.json','utf8'));
          const index=(manifest)=>new Map(manifest.renders.map(item=>[`${item.route}::${item.viewport}`,item]));
          const a=index(current),b=index(legacy);
          const deltas=[];
          for(const [key,left] of a){
            const right=b.get(key);
            if(!right)continue;
            deltas.push({route:left.route,viewport:left.viewport,currentPageHeightPx:left.pageHeightPx,legacyPageHeightPx:right.pageHeightPx,pageHeightDeltaPx:(right.pageHeightPx??0)-(left.pageHeightPx??0),currentOverflowPx:left.overflowPx,legacyOverflowPx:right.overflowPx,currentStatus:left.status,legacyStatus:right.status});
          }
          deltas.sort((x,y)=>x.pageHeightDeltaPx-y.pageHeightDeltaPx);
          const representativeRoutes=new Set(['market','advanced-chart','research-workspace','qelly-verify','screener-lab','portfolio-analytics','theme-lab','identity-access','data-mesh','observability','decision-provenance','formula-library','feature-universe','timeseries-lab','asset-intelligence','discovery-hub']);
          const report={
            schemaVersion:1,
            exactSourceSha:process.env.QELLY_SCREEN_EVIDENCE_SHA,
            evidenceMode:'canonical-shell-current-vs-forced-legacy',
            productSourceChanged:false,
            canonicalShellOverride:'staticVisualPreview=false in dist/frontend/qelly-config.js only',
            forcedLegacyAttribute:'data-ui-lock-v5-3="active" in dist/frontend/index.html only',
            current:{routeCount:current.routeCount,renderCount:current.renderCount,passed:current.passed,failed:current.failed,missing:current.missing,consoleErrorCount:current.consoleErrorCount,batchFailures:Number(process.env.current_batch_failures||0)},
            legacy:{routeCount:legacy.routeCount,renderCount:legacy.renderCount,passed:legacy.passed,failed:legacy.failed,missing:legacy.missing,consoleErrorCount:legacy.consoleErrorCount,batchFailures:Number(process.env.legacy_batch_failures||0)},
            changedByAtLeast50Px:deltas.filter(item=>Math.abs(item.pageHeightDeltaPx)>=50).length,
            representative:deltas.filter(item=>representativeRoutes.has(item.route)),
            largestCompactions:deltas.slice(0,20),
            largestExpansions:deltas.slice(-20).reverse(),
            evidenceBoundary:'governed local test runtime; canonical-shell and legacy activation are injected into dist/frontend only; no production user data or provider activation'
          };
          await writeFile('qelly-v53-canonical-shell-ab-report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          const complete=(m)=>m.routeCount===71&&m.renderCount===142&&m.expectedRenderCount===142&&m.missing.length===0;
          if(!complete(current)||!complete(legacy))process.exit(1);
          NODE

      - name: Publish evidence summary
        shell: bash
        run: |
          echo '## Qelly V5.3 canonical-shell A/B evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Product source activation changed: **no**' >> "$GITHUB_STEP_SUMMARY"
          echo '- A: canonical shell with current runtime contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- B: same canonical shell with legacy `data-ui-lock-v5-3="active"` forced only in disposable build' >> "$GITHUB_STEP_SUMMARY"
          echo '- Coverage: **71 routes × 2 viewports in each mode**' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFile} from 'node:fs/promises';
          const r=JSON.parse(await readFile('qelly-v53-canonical-shell-ab-report.json','utf8'));
          console.log(`- Current mechanical result: **${r.current.passed}/${r.current.renderCount} passed; ${r.current.failed} failed; ${r.current.missing.length} missing**`);
          console.log(`- Forced-legacy mechanical result: **${r.legacy.passed}/${r.legacy.renderCount} passed; ${r.legacy.failed} failed; ${r.legacy.missing.length} missing**`);
          console.log(`- Renders changing page height by >=50px: **${r.changedByAtLeast50Px}**`);
          console.log('- Interpretation: diagnostic only; manual comparison against the locked V5.3 target is required before any source migration.');
          NODE

      - name: Upload canonical-shell A-B diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-v53-canonical-shell-ab-${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          path: |
            qelly-v53-canonical-shell-build.json
            qelly-v53-forced-legacy-build.json
            qelly-v53-canonical-shell-ab-report.json
            preview/v53-canonical-current
            preview/v53-canonical-legacy
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
