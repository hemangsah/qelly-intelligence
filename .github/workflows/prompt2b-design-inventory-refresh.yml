name: Qelly Prompt 2B Design Inventory Refresh

on:
  push:
    branches: [feature/calculator-and-indicator-foundation]
    paths:
      - '.github/qelly-prompt2b-design-refresh/READY'

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-design-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Wave 1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/calculator-and-indicator-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Correct governed route and screen inventory expectations
        shell: python
        run: |
          from pathlib import Path

          validator=Path('scripts/validate-design-foundations.mjs')
          text=validator.read_text()
          old="assert.equal(routeDefinitions.length,61);assert.equal(routeMatrix.trim().split('\\n').length-1,61);assert.ok(screenMatrix.trim().split('\\n').length-1>=61);"
          new="assert.equal(routeDefinitions.length,66);assert.equal(routeMatrix.trim().split('\\n').length-1,66);assert.ok(screenMatrix.trim().split('\\n').length-1>=421);"
          if old not in text: raise SystemExit('design validator route-count anchor not found')
          validator.write_text(text.replace(old,new))

          builder=Path('scripts/build-qelly-design-inventory.mjs')
          text=builder.read_text()
          old_domain="home:'Public content; optional read-only market service.'"
          new_domain="home:'Public content; optional read-only market service.',\n    tools:'Deterministic local calculation, indicator, evidence, and optional authenticated persistence services.'"
          if old_domain not in text: raise SystemExit('design inventory domain anchor not found')
          text=text.replace(old_domain,new_domain)
          old_count="if(screenRows.length!==411)throw new Error(`Expected 411 screen-matrix rows, received ${screenRows.length}`);"
          new_count="const expectedScreenRows=pageNames.length+routeDefinitions.length*2+PERSONA_PROFILES.length*priorityRoutes.length*2+priorityRoutes.length*states.length+overlays.length;\nif(screenRows.length!==expectedScreenRows)throw new Error(`Expected ${expectedScreenRows} screen-matrix rows, received ${screenRows.length}`);"
          if old_count not in text: raise SystemExit('design inventory screen-count anchor not found')
          builder.write_text(text.replace(old_count,new_count))

      - name: Rebuild and validate governed design inventories
        run: |
          set -euo pipefail
          node --check scripts/validate-design-foundations.mjs
          node --check scripts/build-qelly-design-inventory.mjs
          node scripts/build-qelly-design-inventory.mjs
          node scripts/validate-design-foundations.mjs
          test "$(($(wc -l < QELLY_ROUTE_INVENTORY.csv)-1))" = 66
          test "$(($(wc -l < QELLY_SCREEN_MATRIX.csv)-1))" = 421

      - name: Remove temporary refresh transport and commit
        run: |
          set -euo pipefail
          rm -rf .github/qelly-prompt2b-design-refresh
          rm -f .github/workflows/prompt2b-design-inventory-refresh.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(prompt2b): refresh governed route and screen inventories'
          git push origin HEAD:feature/calculator-and-indicator-foundation
