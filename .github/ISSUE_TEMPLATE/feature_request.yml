name: Feature request
description: Propose an evidence-backed capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, licensing, or truth boundaries
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Discovery, Asset intelligence, Workspace, Portfolio, Alerts, Platform, Infrastructure]
    validations:
      required: true
