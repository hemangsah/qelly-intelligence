name: Qelly Prompt 2B Closure Smoke Integration

on:
  push:
    branches: [feature/calculator-and-indicator-foundation]
    paths: [.github/workflows/prompt2b-closure-smoke-integration.yml]

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-closure-smoke-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact parent and live branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b417378b776b8a4602d6b8d518a1e023e5e45f03"
          test "$(git ls-remote origin refs/heads/feature/calculator-and-indicator-foundation | cut -f1)" = "$GITHUB_SHA"
      - name: Reconcile smoke counts and complete Prompt 2B API lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke.mjs')
          s=p.read_text()
          def one(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'expected one smoke anchor, found {s.count(old)}: {old[:100]}')
              s=s.replace(old,new,1)
          one("config.routes.length === 66 && config.apiRoutes.length === 199","config.routes.length === 70 && config.apiRoutes.length === 202")
          one("config.waveStatus.part22 && config.schemaValidation.schemasLoaded === 70","config.waveStatus.part22 && config.schemaValidation.schemasLoaded === 72")
          one("coverage.schemasLoaded === 70","coverage.schemasLoaded === 72")
          anchor="""  const indicator=(await request('/api/v1/indicators/run',{method:'POST',body:{indicatorId:'sma',inputs:{close:[1,2,3,4,5],period:3}}})).json();
  expect(indicator.status==='success'&&indicator.outputs.value.at(-1)===4,'deterministic indicator API invalid');"""
          addition=anchor+"""
  const freshCalculation=(await request('/api/v1/calculations/run',{method:'POST',body:{formulaId:'fresh-present-value',inputs:{futureValue:110,rate:0.1,periods:1}}})).json();
  expect(freshCalculation.status==='success'&&Math.abs(freshCalculation.outputs.value-100)<1e-8&&freshCalculation.truthState==='FRESH_REIMPLEMENTATION_2026','fresh formula API invalid');
  const freshIndicator=(await request('/api/v1/indicators/run',{method:'POST',body:{indicatorId:'fresh-price-momentum',inputs:{close:Array.from({length:30},(_,index)=>100+index),period:14}}})).json();
  expect(freshIndicator.status==='success'&&freshIndicator.outputs.value.at(-1)===14&&freshIndicator.truthState==='FRESH_REIMPLEMENTATION_2026','fresh indicator API invalid');
  const saved=(await request('/api/v1/calculations/saved',{method:'POST',status:201,body:{name:'Fresh PV smoke',result:freshCalculation,notes:'Prompt 2B lifecycle smoke',tags:['fresh','smoke'],favorite:true},headers:{'Idempotency-Key':'prompt2b-saved-create'}})).json();
  const savedList=(await request('/api/v1/calculations/saved?q=Fresh%20PV&favorite=true&sort=name-asc')).json();
  expect(savedList.items.some(item=>item.id===saved.id)&&savedList.persistence.schemaVersion===2,'saved calculation list invalid');
  const savedRead=(await request(`/api/v1/calculations/saved/${saved.id}`)).json();
  expect(savedRead.version===1&&savedRead.formulaVersion==='2.0.0'&&savedRead.revisions.length===1,'saved calculation read invalid');
  const savedUpdated=(await request(`/api/v1/calculations/saved/${saved.id}`,{method:'PATCH',body:{name:'Fresh PV updated',notes:'Updated smoke',tags:['fresh','updated'],favorite:false},headers:{'Idempotency-Key':'prompt2b-saved-update'}})).json();
  expect(savedUpdated.version===2&&savedUpdated.revisions.length===2&&savedUpdated.name==='Fresh PV updated','saved calculation update invalid');
  const duplicate=(await request(`/api/v1/calculations/saved/${saved.id}/duplicate`,{method:'POST',status:201,body:{name:'Fresh PV duplicate'},headers:{'Idempotency-Key':'prompt2b-saved-duplicate'}})).json();
  expect(duplicate.id!==saved.id&&duplicate.version===1&&duplicate.name==='Fresh PV duplicate','saved calculation duplicate invalid');
  const savedRevisions=(await request(`/api/v1/calculations/saved/${saved.id}/revisions`)).json();
  expect(savedRevisions.currentVersion===2&&savedRevisions.items.length===2,'saved calculation revisions invalid');
  const firstRevision=savedRevisions.items.find(item=>item.version===1);
  const savedRestored=(await request(`/api/v1/calculations/saved/${saved.id}/restore`,{method:'POST',body:{revisionId:firstRevision.revisionId},headers:{'Idempotency-Key':'prompt2b-saved-restore'}})).json();
  expect(savedRestored.version===3&&savedRestored.name==='Fresh PV smoke'&&savedRestored.revisions.length===3,'saved revision restore invalid');
  const duplicateDeleted=(await request(`/api/v1/calculations/saved/${duplicate.id}`,{method:'DELETE',headers:{'Idempotency-Key':'prompt2b-saved-delete-duplicate'}})).json();
  const originalDeleted=(await request(`/api/v1/calculations/saved/${saved.id}`,{method:'DELETE',headers:{'Idempotency-Key':'prompt2b-saved-delete-original'}})).json();
  expect(duplicateDeleted.deleted&&originalDeleted.deleted,'saved calculation delete invalid');"""
          one(anchor,addition)
          one("  const result={\n    status:'smoke-passed'", "  const expectedRequests=290;\n  expect(log.length===expectedRequests,`request denominator mismatch: ${log.length} !== ${expectedRequests}`);\n  const result={\n    status:'smoke-passed'")
          one("requests:log.length,", "requests:log.length,requestDenominator:expectedRequests,")
          one("deterministicCalculations:true,deterministicIndicators:true,indiaCustomCharges:true", "deterministicCalculations:true,deterministicIndicators:true,freshCatalog:true,savedCalculationLifecycle:true,indiaCustomCharges:true")
          p.write_text(s)
          p=Path('scripts/release-check.mjs');s=p.read_text()
          if s.count('&& smoke.requests === 279')!=1: raise SystemExit('release smoke denominator anchor missing')
          p.write_text(s.replace('&& smoke.requests === 279','&& smoke.requests === 290',1))
          PY
          node --check scripts/smoke.mjs
          node --check scripts/release-check.mjs
      - name: Run closure gates and retain exact decision
        run: |
          set +e
          {
            npm ci --ignore-scripts &&
            node --test tests/calculation-security.test.mjs tests/calculation-service-parity.test.mjs tests/browser-saved-calculation-lifecycle.test.mjs tests/saved-calculation-lifecycle.test.mjs tests/saved-calculation-store.test.mjs &&
            npm run validate:product &&
            npm run inventory:product &&
            npm run smoke &&
            npm run release:check
          } 2>&1 | tee /tmp/qelly-prompt2b-smoke-gate.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/qelly-prompt2b-smoke-gate.status
          exit 0
      - name: Commit success or exact failure and remove one-use workflow
        run: |
          set -euo pipefail
          status="$(cat /tmp/qelly-prompt2b-smoke-gate.status)"
          rm .github/workflows/prompt2b-closure-smoke-integration.yml
          git config user.name hemangsah
          git config user.email hemangsah.dn@gmail.com
          if [ "$status" = "0" ]; then
            rm -f project-state/QELLY_PROMPT2B_SMOKE_GATE_FAILURE.md
            git add -A
            git diff --cached --check
            git commit -m "test(prompt2b): close fresh catalog and saved lifecycle smoke"
          else
            git restore scripts/smoke.mjs scripts/release-check.mjs validation artifacts || true
            mkdir -p project-state
            {
              echo '# Qelly Prompt 2B Smoke Closure Failure'
              echo
              echo "- workflow head: $GITHUB_SHA"
              echo "- exact parent: b417378b776b8a4602d6b8d518a1e023e5e45f03"
              echo "- exit status: $status"
              echo
              echo '```text'
              tail -n 240 /tmp/qelly-prompt2b-smoke-gate.log
              echo '```'
            } > project-state/QELLY_PROMPT2B_SMOKE_GATE_FAILURE.md
            git add -A
            git diff --cached --check
            git commit -m "test(prompt2b): record smoke closure gate failure"
          fi
          git push origin HEAD:feature/calculator-and-indicator-foundation
