name: Qelly Prompt 2B Browser Forensics Checkpoint

on:
  push:
    branches:
      - feature/calculator-and-indicator-foundation
    paths:
      - .github/workflows/prompt2b-browser-forensics-checkpoint.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: qelly-prompt2b-browser-forensics-checkpoint
  cancel-in-progress: false

jobs:
  persist-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact frozen ancestry
        env:
          EXPECTED_PARENT: ff6a8ab2180527e3dc62e2cf4890338eef18aa96
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"

      - name: Download and verify failed review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8736360914"
          EXPECTED_SHA256: "15b6cdf2c9e500470f30629b40a41adc45bb2ef648e651c9bf51412c5e0ae8f7"
          EXPECTED_BYTES: "6034854"
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/prompt2b-review.zip
          test "$(stat -c%s /tmp/prompt2b-review.zip)" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  /tmp/prompt2b-review.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          p='/tmp/prompt2b-review.zip'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'CRC failure: {bad}')
              if len(z.infolist()) != 23: raise SystemExit(f'Expected 23 entries, got {len(z.infolist())}')
              z.extractall('/tmp/prompt2b-review')
          PY

      - name: Generate complete 420-record forensic checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, pathlib, collections, hashlib
          root=pathlib.Path('/tmp/prompt2b-review/.prompt2b-review')
          browser=json.loads((root/'BROWSER_MATRIX.json').read_text())
          theme=json.loads((root/'THEME_DIFFERENTIATION.json').read_text())
          shots=json.loads((root/'SCREENSHOT_MANIFEST.json').read_text())
          if browser.get('head')!='ff6a8ab2180527e3dc62e2cf4890338eef18aa96':
              raise SystemExit(f"Artifact head mismatch: {browser.get('head')}")
          records=browser['records']; failures=browser['failures']
          if len(records)!=420 or len(failures)!=379:
              raise SystemExit(f'Unexpected browser counts: {len(records)} / {len(failures)}')
          failure_keys={(x['browser'],x['width'],x['height'],x['appearance'],x['route']):x for x in failures}
          shot_map={(x['browser'],x['route'],x['width'],x['height'],x['appearance']):x['name'] for x in shots['files']}
          destination=pathlib.Path('project-state')
          destination.mkdir(exist_ok=True)
          fields=[
            'record_id','outcome','failure_id','run_id','exact_head','route','browser','viewport',
            'theme_requested','theme_observed','motion_mode','authentication_state','persistence_state',
            'action_state','first_failing_assertion','console_error','page_error','resource_failure',
            'screenshot_path','likely_category','confirmed_root_cause','affected_source_path','severity',
            'fix_commit','retest_result','waiver_status','waiver_rationale','fixed_nav_overlap_count',
            'horizontal_overflow_px','unlabeled_controls','cls','truth_boundary_passed','font_status','load_ms'
          ]
          output=[]
          for index,record in enumerate(records,1):
              key=(record['browser'],record['width'],record['height'],record['appearance'],record['route'])
              failure=failure_keys.get(key)
              if record['route']=='calculator-center': action='valid calculation after route render'
              elif record['route']=='indicator-library': action='valid indicator calculation after route render'
              elif record['route']=='saved-calculations': action='initial/empty local-persistence state'
              elif record['route']=='india-finance': action='initial India finance truth/unavailable-rule state'
              else: action='initial formula catalogue state'
              screenshot=shot_map.get(key,'')
              output.append({
                'record_id':f'P2B-R30482255458-{index:03d}',
                'outcome':'FAIL' if failure else 'PASS',
                'failure_id':f'BF-{index:03d}' if failure else '',
                'run_id':'30482255458',
                'exact_head':browser['head'],
                'route':record['route'],'browser':record['browser'],
                'viewport':f"{record['width']}x{record['height']}",
                'theme_requested':record['appearance'],'theme_observed':record.get('theme',''),
                'motion_mode':'reduced','authentication_state':'anonymous static visual preview',
                'persistence_state':'local storage reset before context; route-specific browser-local only',
                'action_state':action,
                'first_failing_assertion':failure['reasons'][0] if failure else '',
                'console_error':' | '.join(record.get('consoleErrors',[])),
                'page_error':' | '.join(record.get('pageErrors',[])),
                'resource_failure':' | '.join(f"{x.get('url')}::{x.get('error')}" for x in record.get('failedResources',[])),
                'screenshot_path':f".prompt2b-review/screenshots/{screenshot}" if screenshot else '',
                'likely_category':'test harness defect' if failure else 'none',
                'confirmed_root_cause':('The harness counted any visible interactive rectangle intersecting the fixed bottom-navigation rectangle, including controls inside the navigation and content temporarily behind it after Playwright auto-scroll. It did not test whether final focusable content can scroll fully above the fixed navigation.' if failure else ''),
                'affected_source_path':'scripts/prompt2b-final-review.mjs' if failure else '',
                'severity':'MEDIUM' if failure else 'NONE','fix_commit':'PENDING',
                'retest_result':'PENDING' if failure else 'PASS_ON_RECORDED_RUN',
                'waiver_status':'NO','waiver_rationale':'',
                'fixed_nav_overlap_count':record.get('fixedNavOverlap',0),
                'horizontal_overflow_px':record.get('overflowX',0),
                'unlabeled_controls':record.get('unlabeledControls',0),'cls':record.get('cls',0),
                'truth_boundary_passed':record.get('truth',False),'font_status':record.get('fontStatus',''),
                'load_ms':record.get('loadMs','')
              })
          classification=destination/'QELLY_PROMPT2B_BROWSER_FAILURE_CLASSIFICATION.csv'
          with classification.open('w',newline='',encoding='utf8') as handle:
              writer=csv.DictWriter(handle,fieldnames=fields);writer.writeheader();writer.writerows(output)

          browser_counts=collections.Counter(x['browser'] for x in failures)
          route_counts=collections.Counter(x['route'] for x in failures)
          viewport_counts=collections.Counter(f"{x['width']}x{x['height']}" for x in failures)
          appearance_counts=collections.Counter(x['appearance'] for x in failures)
          overlap=[x['fixedNavOverlap'] for x in failures]
          summary_lines=[
            '# Qelly Prompt 2B Browser Failure Forensics — Run 30482255458','',
            '## Evidence identity','',
            f"- Exact workflow head: `{browser['head']}`",'- GitHub artifact ID: `8736360914`','- Artifact bytes: `6034854`','- Artifact SHA-256: `15b6cdf2c9e500470f30629b40a41adc45bb2ef648e651c9bf51412c5e0ae8f7`','- ZIP entries: `23`','- ZIP CRC: passed',
            f'- Browser records: `{len(records)}`',f'- Failed records: `{len(failures)}`',f'- Passed records: `{len(records)-len(failures)}`',f"- Theme-comparison failures: `{len(theme['failures'])}`",'- Performance failures: `0`',f"- Screenshots: `{len(shots['files'])}`",'',
            '## Complete classification','',
            'All 379 failures are individually represented in `QELLY_PROMPT2B_BROWSER_FAILURE_CLASSIFICATION.csv`. Every failed record had only the first assertion `fixed-nav-overlap:<count>`. No failed record contained a console error, page error, required-local-resource failure, horizontal overflow, font-loading failure, truth-boundary failure or CLS failure.','',
            '| Confirmed category | Count |','|---|---:|','| Test harness defect — fixed-navigation overlap measurement | 379 |','| Real product defect proven by this artifact | 0 |','| Unknown requiring reproduction | 0 |','',
            f'- Browsers: `{dict(browser_counts)}`',f'- Routes: `{dict(route_counts)}`',f'- Viewports: `{dict(viewport_counts)}`',f'- Requested themes: `{dict(appearance_counts)}`',f'- Overlap-count range: `{min(overlap)}–{max(overlap)}`','',
            '## Confirmed harness defect','',
            'The old harness counted all visible interactive rectangles intersecting a fixed bottom element. It counted bottom-navigation descendants and controls temporarily behind the bar after Playwright auto-scroll, evaluated an arbitrary post-action scroll position, and never tested the actual product contract: whether final actionable content can scroll above the fixed navigation and receive focus without clipping.','',
            'The corrected harness must preserve a strict navigation-clearance assertion, exclude navigation descendants, scroll and focus final actionable content deterministically, and retain screenshots and first-error evidence.','',
            '## Theme failures','',
            'All 15 recorded theme failures are harness setup defects. The old review wrote unsupported generic appearance names to an unused local-storage key. Qelly themes are governed persona IDs applied through the application preference path. The corrected matrix must apply real IDs, assert the resolved ID, wait for fonts, and compare semantic tokens.','',
            '## Waivers','','None. Every recorded failure remains open until exact-head retest passes.'
          ]
          (destination/'QELLY_PROMPT2B_BROWSER_FAILURE_SUMMARY.md').write_text('\n'.join(summary_lines)+'\n')

          theme_lines=[
            '# Qelly Prompt 2B Theme Differentiation Forensics','',
            'Run: `30482255458`  ',f"Exact head: `{browser['head']}`",'',
            '## Recorded result','',f"- Browser × route dark/light pairs: `{len(theme['pairs'])}`",f"- Failed pairs: `{len(theme['failures'])}`",'- Dark and requested-light body background in every failed pair: `rgb(8, 9, 10)`','',
            '## Confirmed root cause','',
            "The harness did not activate Qelly themes. It wrote `dark`, `light`, `oled` and `high-contrast` to `localStorage['qelly-appearance']`, but the application uses governed persona preferences and `document.documentElement.dataset.theme`. Every requested appearance therefore retained the default `burgundy-command` theme.",'',
            'Correct mapping to verify in the replacement harness:','','- dark → `burgundy-command`','- porcelain light → `porcelain-burgundy`','- OLED → verified governed low-luminance persona','- high contrast → `high-contrast`','',
            'Semantic canvas, surface, border, text, focus, chart-grid, positive and negative tokens must be compared. Raw body-background equality alone is insufficient.','',
            '## Disposition','','- Product theme defect proven by run: 0','- Harness theme setup defects: 15','- Waivers: 0','- Retest: pending'
          ]
          (destination/'QELLY_PROMPT2B_THEME_DIFFERENTIATION_REPORT.md').write_text('\n'.join(theme_lines)+'\n')

          matrix_fields=['matrix_id','source_run','exact_head','route','action_state','browser','viewport','theme_request','motion','authentication','expected_truth','result','first_failure','console_errors','page_errors','failed_resources','horizontal_overflow_px','notes']
          matrix=[]
          for index,record in enumerate(records,1):
              key=(record['browser'],record['width'],record['height'],record['appearance'],record['route'])
              failure=failure_keys.get(key)
              action=('valid calculation' if record['route']=='calculator-center' else 'valid indicator calculation' if record['route']=='indicator-library' else 'empty/local saved state' if record['route']=='saved-calculations' else 'initial/unavailable rule state' if record['route']=='india-finance' else 'initial catalog state')
              matrix.append({'matrix_id':f'OLD-{index:04d}','source_run':'30482255458','exact_head':browser['head'],'route':record['route'],'action_state':action,'browser':record['browser'],'viewport':f"{record['width']}x{record['height']}",'theme_request':record['appearance'],'motion':'reduced','authentication':'anonymous static preview','expected_truth':'deterministic/local or unavailable; never live','result':'BLOCKED_BY_HARNESS_DEFECT' if failure else 'PASS_RECORDED_LIMITED_SCOPE','first_failure':failure['reasons'][0] if failure else '','console_errors':len(record['consoleErrors']),'page_errors':len(record['pageErrors']),'failed_resources':len(record['failedResources']),'horizontal_overflow_px':record['overflowX'],'notes':'Old five-route matrix only; final complete route/action/state matrix still required.'})
          with (destination/'QELLY_PROMPT2B_ROUTE_ACTION_STATE_MATRIX.csv').open('w',newline='',encoding='utf8') as handle:
              writer=csv.DictWriter(handle,fieldnames=matrix_fields);writer.writeheader();writer.writerows(matrix)

          memory_lines=[
            '# Qelly Prompt 2B Running Memory Summary','',
            'Updated: 2026-07-30  ','Repository: `hemangsah/qelly-intelligence`','',
            '## Authenticated authority','',
            '- Authenticated GitHub user: `hemangsah` (`274469799`)','- Repository permission: admin, maintain, push, pull and triage','- Repository auto-merge setting: disabled','',
            '## Exact live state before mutation','',
            '- Main SHA: `9cb98780893924ad26fbf4baaa9048e80a162b2c`','- Main versus recorded Program A closeout: identical','- PR #23 base SHA: `9cb98780893924ad26fbf4baaa9048e80a162b2c`','- PR #23 head SHA: `ff6a8ab2180527e3dc62e2cf4890338eef18aa96`','- PR state: open, draft, mergeable, unmerged','- Branch: `feature/calculator-and-indicator-foundation`','- Changed files: 43','- Commits: 35','- PR comments/reviews/review threads: 0/0/0','- Feature-branch deployment: none','',
            '## Exact-head workflow state','',
            'Successful: Continuous Integration, Container Build, Production Foundation Services, CodeQL, Typography Governance Review, IBM Plex Governance Audit, UI Rescue Review and Theme Intelligence Visual Correction Review.','',
            'Failing: Qelly Prompt 2B Wave 1 Review run `30482255458`, browser-matrix step only.','',
            '## Artifact and product counts','',
            '- Artifact ID: `8736360914`','- Bytes/SHA-256/entries/CRC: `6034854` / `15b6cdf2c9e500470f30629b40a41adc45bb2ef648e651c9bf51412c5e0ae8f7` / `23` / passed','- Browser records/failures/theme failures/performance failures/screenshots: `420/379/15/0/17`','- Executable deterministic formulas: 50','- Governed deterministic indicators: 20','- Runtime/governed routes: 66','- Prompt 2B routes: 5','- Production-connected external financial providers: 0','',
            '## Current blockers and next action','',
            'Correct the proven fixed-navigation and theme-activation harness defects without weakening assertions; rerun the original matrix; independently validate the uninstalled catalog expansion; reconcile source lineage and registries; run the complete matrix; generate the 18-section artifact; update PR #23 truthfully.','',
            '## Prohibited actions','',
            'Do not modify main, merge or mark PR #23 ready, enable auto-merge, deploy the branch, start Prompt 2C, activate providers, enable trading/custody/deposits/withdrawals/private-key/seed/autonomous execution, weaken assertions, or fabricate completion.'
          ]
          (destination/'QELLY_PROMPT2B_RUNNING_MEMORY.md').write_text('\n'.join(memory_lines)+'\n')

          for path in [destination/'QELLY_PROMPT2B_BROWSER_FAILURE_CLASSIFICATION.csv',destination/'QELLY_PROMPT2B_BROWSER_FAILURE_SUMMARY.md',destination/'QELLY_PROMPT2B_THEME_DIFFERENTIATION_REPORT.md',destination/'QELLY_PROMPT2B_ROUTE_ACTION_STATE_MATRIX.csv',destination/'QELLY_PROMPT2B_RUNNING_MEMORY.md']:
              print(path, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Commit state-only forensic checkpoint and remove this workflow
        env:
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/prompt2b-browser-forensics-checkpoint.yml
          git config user.name "Hemang Sah"
          git config user.email "274469799+hemangsah@users.noreply.github.com"
          git add project-state/QELLY_PROMPT2B_BROWSER_FAILURE_CLASSIFICATION.csv \
                  project-state/QELLY_PROMPT2B_BROWSER_FAILURE_SUMMARY.md \
                  project-state/QELLY_PROMPT2B_THEME_DIFFERENTIATION_REPORT.md \
                  project-state/QELLY_PROMPT2B_ROUTE_ACTION_STATE_MATRIX.csv \
                  project-state/QELLY_PROMPT2B_RUNNING_MEMORY.md \
                  .github/workflows/prompt2b-browser-forensics-checkpoint.yml
          git commit -m "docs(prompt2b): persist complete browser failure forensics"
          git push origin "HEAD:$BRANCH"
