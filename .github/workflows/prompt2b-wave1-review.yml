name: Qelly Prompt 2B Wave 1 Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: qelly-prompt2b-wave1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-recovery-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact parent and live branch
        env:
          EXPECTED_PARENT: 775709f25c5a411edb91e3fb357fbab5139f3f57
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD_SHA"

      - name: Download exact corrected retest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8749246424/zip" > /tmp/prompt2b-retest.zip

      - name: Persist classification and correct browser readiness
        run: |
          set -euo pipefail
          python3 scripts/prompt2b-browser-recovery.py /tmp/prompt2b-retest.zip | tee /tmp/prompt2b-browser-recovery-result.json
          python3 -m py_compile scripts/prompt2b-browser-recovery.py
          node --check scripts/prompt2b-final-review.mjs
          grep -q "sessionStorage.setItem('qelly.brand.opening.v1','seen')" scripts/prompt2b-final-review.mjs
          grep -q "scrollOwner.style.scrollBehavior='auto'" scripts/prompt2b-final-review.mjs
          test "$(wc -l < project-state/QELLY_PROMPT2B_BROWSER_RETEST_CLASSIFICATION.csv)" = "1081"

      - name: Commit durable recovery without workflow mutation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD_SHA"
          rm scripts/prompt2b-browser-recovery.py
          git config user.name "Hemang Sah"
          git config user.email "274469799+hemangsah@users.noreply.github.com"
          git add project-state/QELLY_PROMPT2B_BROWSER_RETEST_CLASSIFICATION.csv \
                  project-state/QELLY_PROMPT2B_BROWSER_RETEST_SUMMARY.md \
                  scripts/prompt2b-final-review.mjs \
                  scripts/prompt2b-browser-recovery.py
          git commit -m "fix(prompt2b): persist retest and correct browser readiness"
          git push origin "HEAD:$BRANCH"
