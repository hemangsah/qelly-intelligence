name: Qelly Self-Contained Auth E2E Canary

on:
  push:
    branches:
      - canary/qelly-auth-e2e-mailtm-20260815

permissions:
  contents: read

concurrency:
  group: qelly-self-contained-auth-e2e-canary
  cancel-in-progress: true

jobs:
  auth-e2e:
    name: Register, confirm, sign in and self-delete disposable identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_URL: https://qelly-intelligence.pages.dev
      EXPECTED_RELEASE_SHA: df5475a591e99ff932729e9b027317c3deaf10e8
      MAIL_API: https://api.mail.tm
    steps:
      - name: Checkout isolated canary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Exercise canonical production Auth end to end
        run: node scripts/qelly-auth-e2e-mailtm-canary.mjs
      - name: Upload redacted Auth E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-auth-e2e-mailtm-${{ github.sha }}
          path: auth-canary-evidence
          if-no-files-found: warn
          retention-days: 3
