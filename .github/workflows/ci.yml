name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Scan repository for committed secrets
        run: npm run security:scan
      - name: Validate development environment and safety locks
        run: npm run env:check
      - name: Type and syntax check
        run: npm run typecheck
      - name: Lint and repository policy
        run: npm run lint
      - name: Validate governed design foundations
        run: npm run validate:design
      - name: Test with retained TAP log
        shell: bash
        run: |
          mkdir -p validation
          set -o pipefail
          npm test 2>&1 | tee validation/QELLY_TEST.log
      - name: Production build
        run: npm run build
      - name: Standalone frontend build
        run: QELLY_PUBLIC_API_BASE_URL=https://api.preview.invalid npm run build:frontend
      - name: Validate current product contract
        run: npm run validate:product
      - name: Rebuild current product inventory
        run: npm run inventory:product
      - name: Full-stack smoke
        run: npm run smoke
      - name: Verify database identity isolation
        run: NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
      - name: Release safety check
        run: npm run release:check
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qelly-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/BUILD_INFO.json
            dist/frontend/BUILD_INFO.json
            validation/QELLY_TEST.log
            validation/PRODUCT_VALIDATION.json
            validation/SMOKE_LOG.json
            artifacts/QELLY_ROUTE_INVENTORY.json
            artifacts/QELLY_API_INVENTORY.json
            artifacts/QELLY_SOURCE_TREE.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit locked dependency graph
        run: npm audit --audit-level=high

  # BEGIN PROMPT2B_HASH_ROUTE_INTEGRATOR
  prompt2b-hash-route-integrate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact closure head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact parent
        env:
          EXPECTED_PARENT: 694ab30aa9db76ee0aa47338cd2942607513eccf
          LIVE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$LIVE_HEAD"
          test "$(git ls-remote origin refs/heads/feature/calculator-and-indicator-foundation | cut -f1)" = "$LIVE_HEAD"
      - name: Patch query-safe routing into application shell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/public/assets/app.js');s=p.read_text()
          def one(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'expected one app anchor, found {s.count(old)}: {old[:100]}')
              s=s.replace(old,new,1)
          one("import { productDomains, routeDefinitions } from './route-registry.mjs';","import { productDomains, routeDefinitions } from './route-registry.mjs';\nimport { parseHashRoute } from './hash-route-state.mjs';")
          one("  activeDomain: 'markets'\n};","  activeDomain: 'markets',\n  routeQuery: new URLSearchParams()\n};")
          old="""function resolveHash() {
  const value = location.hash.replace(/^#\/?/, '') || state.prefs?.route || 'market';
  const [route, asset] = value.split('/');
  const definition=routeDefinitions.find((item)=>item.route===route);
  const allowed=staticVisualPreview
    ? definition&&staticPreviewRoutes.has(route)
    : definition&&((state.authenticated&&!definition.anonymousOnly)||(!state.authenticated&&definition.public===true));
  state.route=allowed?route:(staticVisualPreview?'market':state.authenticated?'discovery-hub':'auth-login');
  state.activeDomain=(allowed?definition:routeDefinitions.find((item)=>item.route===state.route))?.domain??'markets';
  if (asset) state.asset = asset;
  renderNavigation();
  renderRoute();
}"""
          new="""function resolveHash() {
  const parsed=parseHashRoute(location.hash,{fallback:state.prefs?.route||'market'});
  const {route,asset,query}=parsed;
  const definition=routeDefinitions.find((item)=>item.route===route);
  const allowed=staticVisualPreview
    ? definition&&staticPreviewRoutes.has(route)
    : definition&&((state.authenticated&&!definition.anonymousOnly)||(!state.authenticated&&definition.public===true));
  state.route=allowed?route:(staticVisualPreview?'market':state.authenticated?'discovery-hub':'auth-login');
  state.activeDomain=(allowed?definition:routeDefinitions.find((item)=>item.route===state.route))?.domain??'markets';
  state.routeQuery=query;
  if (asset) state.asset = asset;
  renderNavigation();
  renderRoute();
}"""
          one(old,new)
          one("  state.route = route;\n  toggleSecondaryNavigation(false);","  state.route = route;\n  state.routeQuery = new URLSearchParams();\n  toggleSecondaryNavigation(false);")
          one("case 'calculator-detail': await renderCalculatorDetail(main,{api,pageHead,stateBanner,escapeHtml,toast,navigate,state,renderRoute,id:state.asset}); break;","case 'calculator-detail': await renderCalculatorDetail(main,{api,pageHead,stateBanner,escapeHtml,toast,navigate,state,renderRoute,id:state.asset,query:state.routeQuery}); break;")
          one("case 'saved-calculation-detail': await renderSavedCalculationDetail(main,{api,pageHead,stateBanner,escapeHtml,toast,navigate,state,renderRoute,id:state.asset}); break;","case 'saved-calculation-detail': await renderSavedCalculationDetail(main,{api,pageHead,stateBanner,escapeHtml,toast,navigate,state,renderRoute,id:state.asset,query:state.routeQuery}); break;")
          p.write_text(s)
          PY
          node --check apps/web/public/assets/app.js
          node --test tests/hash-route-state.test.mjs tests/browser-saved-calculation-lifecycle.test.mjs
      - name: Build and validate static route assets
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:pages-preview
          npm run smoke:pages-preview
      - name: Commit tested application patch only
        run: |
          set -euo pipefail
          git config user.name hemangsah
          git config user.email hemangsah.dn@gmail.com
          git add apps/web/public/assets/app.js
          git diff --cached --check
          git commit -m "fix(prompt2b): preserve detail IDs across shared-state URLs"
          git push origin HEAD:feature/calculator-and-indicator-foundation
