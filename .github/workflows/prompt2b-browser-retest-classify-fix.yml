name: Qelly Prompt 2B Browser Retest Classify and Fix

on:
  push:
    branches:
      - feature/calculator-and-indicator-foundation
    paths:
      - .github/workflows/prompt2b-browser-retest-classify-fix.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: qelly-prompt2b-browser-retest-classify-fix
  cancel-in-progress: false

jobs:
  classify-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact frozen head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact ancestry
        env:
          EXPECTED_PARENT: 9b5d87e42e5ba2f9b1f49b53da392fcae2ea6f3b
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"

      - name: Download and verify exact retest artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BYTES: "63140064"
          EXPECTED_SHA256: "e880c3402bbd29276d7465f59582b7cd4346ca4904c6fde9aae8302cb97ff10e"
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8749246424/zip" > /tmp/prompt2b-retest.zip
          test "$(stat -c%s /tmp/prompt2b-retest.zip)" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  /tmp/prompt2b-retest.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/prompt2b-retest.zip') as archive:
              bad=archive.testzip()
              if bad: raise SystemExit(f'CRC failure: {bad}')
              if len(archive.infolist())!=371: raise SystemExit(f'Expected 371 entries, got {len(archive.infolist())}')
              archive.extractall('/tmp/prompt2b-retest')
          PY

      - name: Classify every retest record before harness mutation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib,collections,hashlib
          root=pathlib.Path('/tmp/prompt2b-retest/.prompt2b-review')
          browser=json.loads((root/'BROWSER_MATRIX.json').read_text())
          theme=json.loads((root/'THEME_DIFFERENTIATION.json').read_text())
          performance=json.loads((root/'PERFORMANCE.json').read_text())
          shots=json.loads((root/'SCREENSHOT_MANIFEST.json').read_text())
          if browser['head']!='9b5d87e42e5ba2f9b1f49b53da392fcae2ea6f3b': raise SystemExit('Head mismatch')
          records=browser['records'];failures=browser['failures']
          if len(records)!=1080 or len(failures)!=343: raise SystemExit(f'Unexpected counts {len(records)}/{len(failures)}')
          families=collections.Counter(reason.split(':',1)[0] for item in failures for reason in item['reasons'])
          if families!={'fixed-nav-clearance':343}: raise SystemExit(f'Unexpected failure families: {families}')
          if theme['failures'] or performance['failures']: raise SystemExit('Unexpected theme or performance failure')
          failure_keys={(x['browser'],x['width'],x['height'],x['appearance'],x['motion'],x['route']):x for x in failures}
          shot_map={(x['browser'],x['width'],x['height'],x['appearance'],x['motion'],x['route']):x['name'] for x in shots['files']}
          out=pathlib.Path('project-state');out.mkdir(exist_ok=True)
          fields=['record_id','outcome','failure_id','run_id','artifact_id','exact_head','route','browser','viewport','theme','persona','motion','first_failing_assertion','all_failure_reasons','console_error','page_error','resource_failure','horizontal_overflow_px','font_status','truth_boundary_passed','cls','screenshot_path','likely_category','confirmed_root_cause','affected_source_path','severity','fix_commit','retest_result','waiver_status','waiver_rationale']
          rows=[]
          for index,record in enumerate(records,1):
              key=(record['browser'],record['width'],record['height'],record['appearance'],record['motion'],record['route'])
              failure=failure_keys.get(key);reasons=failure['reasons'] if failure else []
              rows.append({
                'record_id':f'P2B-R30515801762-{index:04d}','outcome':'FAIL' if failure else 'PASS','failure_id':f'R2-{index:04d}' if failure else '',
                'run_id':'30515801762','artifact_id':'8749246424','exact_head':browser['head'],'route':record['route'],'browser':record['browser'],'viewport':f"{record['width']}x{record['height']}",'theme':record['appearance'],'persona':record.get('persona',''),'motion':record['motion'],
                'first_failing_assertion':reasons[0] if reasons else '','all_failure_reasons':' | '.join(reasons),'console_error':' | '.join(record.get('consoleErrors',[])),'page_error':' | '.join(record.get('pageErrors',[])),'resource_failure':' | '.join(f"{x.get('url')}::{x.get('error')}" for x in record.get('failedResources',[])),'horizontal_overflow_px':record.get('overflowX',0),'font_status':record.get('fontStatus',''),'truth_boundary_passed':record.get('truth',False),'cls':record.get('cls',0),'screenshot_path':f".prompt2b-review/screenshots/{shot_map.get(key,'')}" if shot_map.get(key) else '',
                'likely_category':'test harness defect' if failure else 'none','confirmed_root_cause':('Opening-brand readiness and smooth-scroll measurement defect: the harness wrote an unrelated local-storage key instead of the product session-storage opening key, then used smooth scrollIntoView and measured after only two animation frames without resolving the actual scroll owner.' if failure else ''),'affected_source_path':'scripts/prompt2b-final-review.mjs' if failure else '','severity':'MEDIUM' if failure else 'NONE','fix_commit':'PENDING','retest_result':'PENDING' if failure else 'PASS','waiver_status':'NO','waiver_rationale':''
              })
          target=out/'QELLY_PROMPT2B_BROWSER_RETEST_CLASSIFICATION.csv'
          with target.open('w',newline='',encoding='utf8') as handle:
              writer=csv.DictWriter(handle,fieldnames=fields);writer.writeheader();writer.writerows(rows)
          route=collections.Counter(x['route'] for x in failures);browser_c=collections.Counter(x['browser'] for x in failures);viewport=collections.Counter(f"{x['width']}x{x['height']}" for x in failures);motion=collections.Counter(x['motion'] for x in failures)
          summary=f'''# Qelly Prompt 2B Corrected Browser Retest Forensics\n\n## Evidence identity\n\n- Run: `30515801762`\n- Exact head: `{browser['head']}`\n- Artifact ID: `8749246424`\n- Artifact bytes: `63140064`\n- Artifact SHA-256: `e880c3402bbd29276d7465f59582b7cd4346ca4904c6fde9aae8302cb97ff10e`\n- ZIP entries: `371`\n- ZIP CRC: passed\n\n## Results\n\n- Records: `{len(records)}`\n- Failures: `{len(failures)}`\n- Theme failures: `0`\n- Performance failures: `0`\n- Screenshots: `{len(shots['files'])}`\n- Failure families: `{dict(families)}`\n- Route distribution: `{dict(route)}`\n- Browser distribution: `{dict(browser_c)}`\n- Viewport distribution: `{dict(viewport)}`\n- Motion distribution: `{dict(motion)}`\n\n## Confirmed root causes\n\n1. Qelly's opening brand sequence is gated by `sessionStorage['qelly.brand.opening.v1']`. The harness wrote `localStorage['qelly-opening-seen']`, so captures and measurements could occur while the full-screen opening overlay was active.\n2. The document declares smooth scrolling. The harness called `scrollIntoView` and measured after only two animation frames, producing large negative clearances before the real scroll completed and without resolving the actual scrollable ancestor.\n\nAll 343 failures are individually recorded in `QELLY_PROMPT2B_BROWSER_RETEST_CLASSIFICATION.csv`. There were no console, page, required-resource, horizontal-overflow, font, truth-boundary, CLS, theme or performance failures. No waiver is issued.\n'''
          (out/'QELLY_PROMPT2B_BROWSER_RETEST_SUMMARY.md').write_text(summary)
          print(json.dumps({'records':len(records),'failures':len(failures),'families':families,'classificationBytes':target.stat().st_size,'classificationSha256':hashlib.sha256(target.read_bytes()).hexdigest()},default=dict,indent=2))
          PY

      - name: Correct opening readiness and actual scroll-root measurement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/prompt2b-final-review.mjs')
          source=path.read_text()
          old="""          await context.addInitScript(()=>{\n            localStorage.setItem('qelly-opening-seen','true');\n            localStorage.removeItem('qelly.calculations.v1');"""
          new="""          await context.addInitScript(()=>{\n            sessionStorage.setItem('qelly.brand.opening.v1','seen');\n            localStorage.removeItem('qelly.calculations.v1');"""
          if old not in source: raise SystemExit('Opening init block not found')
          source=source.replace(old,new,1)
          old_wait="""  await page.evaluate(async()=>{await document.fonts?.ready;});\n  await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));\n};"""
          new_wait="""  await page.evaluate(async()=>{await document.fonts?.ready;});\n  await page.waitForFunction(()=>!document.querySelector('.qelly-opening'),null,{timeout:5000});\n  await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));\n};"""
          if old_wait not in source: raise SystemExit('Route readiness block not found')
          source=source.replace(old_wait,new_wait,1)
          start=source.index("const measureNavigationClearance=async(page)=>page.evaluate(async()=>{")
          end=source.index("\n\ntry{",start)
          replacement=r'''const measureNavigationClearance=async(page)=>page.evaluate(async()=>{
  const main=document.querySelector('#main');
  const navigation=document.querySelector('#mobile-navigation');
  if(!main||!navigation||getComputedStyle(navigation).position!=='fixed'||getComputedStyle(navigation).display==='none'){
    return {supported:false,obscured:0,navHeight:0,clearance:null,focusClearance:null,scrollOwner:'none'};
  }
  const sentinel=document.createElement('div');
  sentinel.tabIndex=-1;
  sentinel.dataset.reviewEnd='true';
  sentinel.setAttribute('aria-hidden','true');
  sentinel.style.cssText='display:block;inline-size:1px;block-size:1px;padding:0;margin:0;border:0;opacity:.001;';
  main.append(sentinel);
  const scrollingElement=document.scrollingElement||document.documentElement;
  const scrollOwner=(()=>{
    let node=sentinel.parentElement;
    while(node&&node!==document.body&&node!==document.documentElement){
      const style=getComputedStyle(node);
      if(/auto|scroll|overlay/.test(style.overflowY)&&node.scrollHeight>node.clientHeight+1)return node;
      node=node.parentElement;
    }
    return scrollingElement;
  })();
  const ownerName=scrollOwner===scrollingElement?'document':`${scrollOwner.tagName.toLowerCase()}${scrollOwner.id?`#${scrollOwner.id}`:''}${scrollOwner.classList.length?`.${[...scrollOwner.classList].join('.')}`:''}`;
  const previousRootBehavior=document.documentElement.style.scrollBehavior;
  const previousOwnerBehavior=scrollOwner.style.scrollBehavior;
  document.documentElement.style.scrollBehavior='auto';
  scrollOwner.style.scrollBehavior='auto';
  const maxScroll=()=>Math.max(0,scrollOwner.scrollHeight-(scrollOwner===scrollingElement?innerHeight:scrollOwner.clientHeight));
  const settle=async(target)=>{
    for(let attempt=0;attempt<60;attempt++){
      scrollOwner.scrollTop=target;
      await new Promise(resolve=>requestAnimationFrame(resolve));
      if(Math.abs(scrollOwner.scrollTop-target)<=1)return true;
    }
    return false;
  };
  const target=maxScroll();
  const settled=await settle(target);
  sentinel.focus({preventScroll:true});
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const navRect=navigation.getBoundingClientRect();
  const sentinelRect=sentinel.getBoundingClientRect();
  const candidates=[...main.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')]
    .filter(element=>!navigation.contains(element)&&getComputedStyle(element).visibility!=='hidden'&&getComputedStyle(element).display!=='none');
  const lastAction=candidates.at(-1)??null;
  if(lastAction){
    lastAction.focus({preventScroll:true});
    await new Promise(resolve=>requestAnimationFrame(resolve));
  }
  const finalNavRect=navigation.getBoundingClientRect();
  const lastRect=lastAction?.getBoundingClientRect?.()??null;
  const obscured=candidates.filter(element=>{
    const rect=element.getBoundingClientRect();
    return rect.width>0&&rect.height>0&&rect.top<innerHeight&&rect.bottom>finalNavRect.top+1;
  }).length;
  const clearance=navRect.top-sentinelRect.bottom;
  const focusClearance=lastRect?finalNavRect.top-lastRect.bottom:null;
  sentinel.remove();
  document.documentElement.style.scrollBehavior=previousRootBehavior;
  scrollOwner.style.scrollBehavior=previousOwnerBehavior;
  return {supported:true,obscured,navHeight:finalNavRect.height,clearance,focusClearance,scrollOwner:ownerName,targetScroll:target,actualScroll:scrollOwner.scrollTop,settled,lastAction:lastAction?.outerHTML?.slice(0,180)??null};
});'''
          source=source[:start]+replacement+source[end:]
          path.write_text(source)
          PY
          node --check scripts/prompt2b-final-review.mjs
          grep -q "sessionStorage.setItem('qelly.brand.opening.v1','seen')" scripts/prompt2b-final-review.mjs
          grep -q "scrollOwner.style.scrollBehavior='auto'" scripts/prompt2b-final-review.mjs

      - name: Commit classification and corrected harness, then remove this workflow
        env:
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/prompt2b-browser-retest-classify-fix.yml
          git config user.name "Hemang Sah"
          git config user.email "274469799+hemangsah@users.noreply.github.com"
          git add project-state/QELLY_PROMPT2B_BROWSER_RETEST_CLASSIFICATION.csv \
                  project-state/QELLY_PROMPT2B_BROWSER_RETEST_SUMMARY.md \
                  scripts/prompt2b-final-review.mjs \
                  .github/workflows/prompt2b-browser-retest-classify-fix.yml
          git commit -m "fix(prompt2b): classify retest and correct opening scroll readiness"
          git push origin "HEAD:$BRANCH"
