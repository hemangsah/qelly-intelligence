name: Qelly Self-Contained Auth E2E Canary

on:
  push:
    branches:
      - canary/qelly-auth-e2e-mailtm-20260815

permissions:
  contents: read

concurrency:
  group: qelly-self-contained-auth-e2e-canary
  cancel-in-progress: true

jobs:
  auth-e2e:
    name: Register, confirm, sign in and self-delete disposable identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_URL: https://qelly-intelligence.pages.dev
      EXPECTED_RELEASE_SHA: df5475a591e99ff932729e9b027317c3deaf10e8
      MAIL_API: https://api.mail.tm
    steps:
      - name: Exercise canonical production Auth end to end
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p auth-canary-evidence
          qelly_cookie_jar="$(mktemp)"
          mail_account_id=''
          mail_token=''
          cleanup() {
            rm -f "$qelly_cookie_jar" /tmp/mail-*.json /tmp/qelly-*.json /tmp/confirm.html || true
            if [[ -n "${mail_account_id:-}" && -n "${mail_token:-}" ]]; then
              curl --silent --show-error --max-time 20 \
                -H "Authorization: Bearer ${mail_token}" \
                -X DELETE "${MAIL_API}/accounts/${mail_account_id}" \
                -o /dev/null || true
            fi
          }
          trap cleanup EXIT

          # Mail.tm provides the short-lived QA mailbox used only by this isolated runner.
          # API documentation / attribution: https://mail.tm and https://docs.mail.tm/
          echo 'Temporary QA mailbox provider: Mail.tm — https://mail.tm'
          curl --silent --show-error --fail --max-time 30 "${MAIL_API}/domains?page=1" -o /tmp/mail-domains.json
          mail_domain="$(node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/mail-domains.json','utf8'));
          const list=payload['hydra:member']||payload.member||[];
          const item=list.find(domain=>domain?.isActive===true&&domain?.isPrivate!==true)||list.find(domain=>domain?.isActive===true)||list[0];
          if(!item?.domain)throw new Error('mailtm_active_domain_missing');
          process.stdout.write(item.domain);
          NODE
          )"
          mail_local="qelly-${GITHUB_SHA:0:8}-$(openssl rand -hex 5)"
          MAIL_EMAIL="${mail_local}@${mail_domain}"
          MAIL_PASSWORD="Mt!$(openssl rand -hex 24)"
          QELLY_PASSWORD="Qe2!$(openssl rand -hex 28)"
          export MAIL_EMAIL MAIL_PASSWORD QELLY_PASSWORD
          echo "::add-mask::$MAIL_EMAIL"
          echo "::add-mask::$MAIL_PASSWORD"
          echo "::add-mask::$QELLY_PASSWORD"

          node -e 'process.stdout.write(JSON.stringify({address:process.env.MAIL_EMAIL,password:process.env.MAIL_PASSWORD}))' > /tmp/mail-account-body.json
          mail_create_status="$(curl --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -o /tmp/mail-account.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/mail-account-body.json \
            "${MAIL_API}/accounts")"
          [[ "$mail_create_status" == "201" ]] || { echo "Mail.tm account creation failed HTTP ${mail_create_status}"; cat /tmp/mail-account.json; exit 1; }
          mail_account_id="$(node -e 'const p=require("/tmp/mail-account.json");if(!p.id)process.exit(1);process.stdout.write(p.id)')"
          echo "::add-mask::$mail_account_id"

          mail_token_status="$(curl --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -o /tmp/mail-token.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/mail-account-body.json \
            "${MAIL_API}/token")"
          [[ "$mail_token_status" == "200" ]] || { echo "Mail.tm token request failed HTTP ${mail_token_status}"; exit 1; }
          mail_token="$(node -e 'const p=require("/tmp/mail-token.json");if(!p.token)process.exit(1);process.stdout.write(p.token)')"
          echo "::add-mask::$mail_token"

          node -e 'process.stdout.write(JSON.stringify({email:process.env.MAIL_EMAIL,password:process.env.QELLY_PASSWORD,displayName:"Qelly E2E Canary",organizationName:"Qelly E2E Canary",workspaceName:"Qelly E2E Canary",baseCurrency:"USD",timezone:"UTC"}))' > /tmp/qelly-register-body.json
          register_status="$(curl --silent --show-error --location --max-time 30 \
            -c "$qelly_cookie_jar" -b "$qelly_cookie_jar" \
            -H "Origin: ${PUBLIC_URL}" \
            -H 'Content-Type: application/json' \
            -o /tmp/qelly-register.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/qelly-register-body.json \
            "${PUBLIC_URL}/api/v1/auth/register")"
          [[ "$register_status" == "202" || "$register_status" == "201" ]] || { echo "Canonical registration failed HTTP ${register_status}"; cat /tmp/qelly-register.json; exit 1; }
          node -e 'const p=require("/tmp/qelly-register.json");if(p.accepted!==true)throw new Error("registration_not_accepted")'

          message_id=''
          for attempt in $(seq 1 60); do
            sleep 5
            status="$(curl --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${mail_token}" \
              -o /tmp/mail-messages.json -w '%{http_code}' \
              "${MAIL_API}/messages?page=1")"
            if [[ "$status" == "200" ]]; then
              message_id="$(node - <<'NODE'
              const fs=require('fs');
              const p=JSON.parse(fs.readFileSync('/tmp/mail-messages.json','utf8'));
              const list=p['hydra:member']||p.member||[];
              const item=list.find(m=>/confirm your email address|confirm.*email|qelly/i.test(`${m.subject||''} ${m.from?.name||''} ${m.from?.address||''}`));
              if(item?.id)process.stdout.write(item.id);
              NODE
              )"
            fi
            if [[ -n "$message_id" ]]; then break; fi
          done
          [[ -n "$message_id" ]] || { echo 'Qelly confirmation email did not arrive in disposable mailbox'; exit 1; }
          echo "::add-mask::$message_id"

          message_status="$(curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${mail_token}" \
            -o /tmp/mail-message.json -w '%{http_code}' \
            "${MAIL_API}/messages/${message_id}")"
          [[ "$message_status" == "200" ]] || { echo "Mail.tm message read failed HTTP ${message_status}"; exit 1; }
          CONFIRM_URL="$(node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/mail-message.json','utf8'));
          const html=Array.isArray(p.html)?p.html.join('\n'):String(p.html||'');
          const text=String(p.text||'');
          const decode=value=>String(value||'').replace(/&amp;/g,'&').replace(/&#x3D;/gi,'=').replace(/&#61;/g,'=').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
          const strip=value=>decode(String(value||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());
          const anchors=[];
          const re=/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
          for(const match of html.matchAll(re))anchors.push({href:decode(match[1]),label:strip(match[2])});
          let url=anchors.find(item=>/confirm.*email|verify.*email/i.test(item.label))?.href||'';
          if(!url){
            const candidates=decode(`${html}\n${text}`).match(/https?:\/\/[^\s<>"']+/g)||[];
            url=candidates.find(value=>/click\.|brevo|auth\/v1\/verify|supabase\.co/i.test(value))||'';
          }
          if(!/^https:\/\//.test(url))throw new Error('confirmation_url_missing');
          process.stdout.write(url);
          NODE
          )"
          export CONFIRM_URL
          echo "::add-mask::$CONFIRM_URL"

          confirm_status="$(curl --silent --show-error --location --max-time 45 \
            -c "$qelly_cookie_jar" -b "$qelly_cookie_jar" \
            -o /tmp/confirm.html -w '%{http_code}' \
            "$CONFIRM_URL")"
          [[ "$confirm_status" =~ ^(200|204)$ ]] || { echo "Confirmation link failed HTTP ${confirm_status}"; exit 1; }
          sleep 3

          node -e 'process.stdout.write(JSON.stringify({email:process.env.MAIL_EMAIL,password:process.env.QELLY_PASSWORD}))' > /tmp/qelly-login-body.json
          login_status="$(curl --silent --show-error --location --max-time 30 \
            -c "$qelly_cookie_jar" -b "$qelly_cookie_jar" \
            -H "Origin: ${PUBLIC_URL}" \
            -H 'Content-Type: application/json' \
            -o /tmp/qelly-login.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/qelly-login-body.json \
            "${PUBLIC_URL}/api/v1/auth/login")"
          [[ "$login_status" == "200" ]] || { echo "Canonical sign-in failed HTTP ${login_status}"; cat /tmp/qelly-login.json; exit 1; }
          node -e 'const p=require("/tmp/qelly-login.json");if(p.authenticated!==true||!p.context)throw new Error("canonical_login_context_invalid")'

          config_status="$(curl --silent --show-error --location --max-time 30 \
            -c "$qelly_cookie_jar" -b "$qelly_cookie_jar" \
            -H 'Cache-Control: no-cache' \
            -o /tmp/qelly-config.json -w '%{http_code}' \
            "${PUBLIC_URL}/api/v1/config")"
          [[ "$config_status" == "200" ]] || { echo "Authenticated config failed HTTP ${config_status}"; exit 1; }
          CSRF="$(node -e 'const p=require("/tmp/qelly-config.json");if(p.release?.sha!==process.env.EXPECTED_RELEASE_SHA||p.auth?.authenticated!==true||!p.csrf?.token)throw new Error("authenticated_config_invalid");process.stdout.write(p.csrf.token)')"
          export CSRF
          echo "::add-mask::$CSRF"

          printf '%s' '{"reason":"Disposable canonical Auth E2E canary cleanup","privacyVersion":"2026-08-01","termsVersion":"2026-08-01"}' > /tmp/qelly-delete-body.json
          delete_status="$(curl --silent --show-error --location --max-time 30 \
            -c "$qelly_cookie_jar" -b "$qelly_cookie_jar" \
            -H "Origin: ${PUBLIC_URL}" \
            -H "X-Qelly-CSRF: ${CSRF}" \
            -H 'Content-Type: application/json' \
            -o /tmp/qelly-delete.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/qelly-delete-body.json \
            "${PUBLIC_URL}/api/v1/account/delete")"
          [[ "$delete_status" == "202" ]] || { echo "Governed self-delete failed HTTP ${delete_status}"; cat /tmp/qelly-delete.json; exit 1; }

          node <<'NODE'
          const fs=require('fs');
          const registration=JSON.parse(fs.readFileSync('/tmp/qelly-register.json','utf8'));
          const login=JSON.parse(fs.readFileSync('/tmp/qelly-login.json','utf8'));
          const config=JSON.parse(fs.readFileSync('/tmp/qelly-config.json','utf8'));
          const deletion=JSON.parse(fs.readFileSync('/tmp/qelly-delete.json','utf8'));
          const evidence={
            target:'canonical-production',
            releaseSha:config.release?.sha||null,
            mailboxProvider:'Mail.tm',
            registration:{accepted:registration.accepted===true,verificationRequired:registration.verificationRequired===true,callbackMode:registration.callbackMode||null},
            confirmation:{messageReceived:true,confirmationLinkConsumed:true},
            signIn:{authenticated:login.authenticated===true,authenticationMethod:login.context?.session?.authenticationMethod||null,assurance:login.context?.session?.assurance||null},
            authenticatedConfig:{authenticated:config.auth?.authenticated===true,csrfMode:config.csrf?.mode||null},
            cleanup:{requested:deletion.requested===true,identityDeleted:deletion.identityDeleted===true,evidenceCompleted:deletion.evidenceCompleted===true,status:deletion.status||null,identityDeletionStatus:deletion.identityDeletionStatus??null}
          };
          fs.writeFileSync('auth-canary-evidence/result.json',JSON.stringify(evidence,null,2));
          if(evidence.releaseSha!==process.env.EXPECTED_RELEASE_SHA)throw new Error('release_identity_mismatch');
          if(!evidence.registration.accepted||!evidence.signIn.authenticated||!evidence.authenticatedConfig.authenticated)throw new Error('canonical_auth_e2e_not_proven');
          if(!evidence.cleanup.requested||!evidence.cleanup.identityDeleted||!evidence.cleanup.evidenceCompleted)throw new Error(`canonical_cleanup_incomplete_${JSON.stringify(evidence.cleanup)}`);
          NODE

          post_delete_status="$(curl --silent --show-error --location --max-time 30 \
            -H "Origin: ${PUBLIC_URL}" \
            -H 'Content-Type: application/json' \
            -o /tmp/qelly-post-delete-login.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/qelly-login-body.json \
            "${PUBLIC_URL}/api/v1/auth/login")"
          [[ "$post_delete_status" != "200" ]] || { echo 'Deleted canary could still sign in'; exit 1; }
          node -e 'const fs=require("fs");const p=require("./auth-canary-evidence/result.json");p.cleanup.postDeletionLoginRejected=true;fs.writeFileSync("auth-canary-evidence/result.json",JSON.stringify(p,null,2))'
          echo 'Canonical production Auth E2E canary passed and disposable identity cleanup completed.'

      - name: Upload redacted Auth E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-auth-e2e-mailtm-${{ github.sha }}
          path: auth-canary-evidence
          if-no-files-found: warn
          retention-days: 3
