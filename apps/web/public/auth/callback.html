<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Qelly Authentication Callback</title>
  <script src="../assets/qelly-auth-appearance-bootstrap.js"></script>
  <link rel="stylesheet" href="../assets/qelly-auth-appearance.css">
</head>
<body>
  <main class="card" id="qelly-auth-callback" data-state="working">
    <div class="mark">QELLY</div>
    <h1>Completing authentication</h1>
    <p role="status" aria-live="polite">Verifying the provider session without storing tokens in browser storage.</p>
    <form id="recovery-form" hidden>
      <label>New password<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></label>
      <button type="submit">Update password</button>
    </form>
    <nav aria-label="Authentication options"><a href="/#/auth-login">Return to sign in</a><button type="button" data-auth-appearance>Appearance</button></nav>
  </main>
  <script type="module" src="../assets/qelly-auth-callback.mjs"></script>
  <script type="module" src="../assets/qelly-auth-appearance.mjs"></script>
</body>
</html>
