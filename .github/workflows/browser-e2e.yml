              'portfolio-attribution': ['.q-boundary-page', 'Performance Attribution'],
              'research-history': ['.q-boundary-page', 'Research Version History'],
              'formula-detail': ['.q-formula-detail-page.q-boundary-page', 'Formula Detail'],
              'indicator-detail': ['.q-indicator-detail-page.q-boundary-page', 'Indicator Detail'],
              'calculator-detail': ['.q-calculator-detail-page.q-boundary-page', 'Calculator Detail'],
