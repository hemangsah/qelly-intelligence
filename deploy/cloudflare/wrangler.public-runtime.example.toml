name = "qelly-global-public-beta"
main = "../../apps/edge/qelly-public-api-worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
QELLY_RELEASE_SHA = "SET_BY_RELEASE_AUTOMATION"
QELLY_ALLOWED_ORIGINS = "https://terminal.qellyintelligence.com,https://qelly-intelligence.pages.dev"
QELLY_PUBLIC_HOSTNAME = "terminal.qellyintelligence.com"
QELLY_PUBLIC_SUPABASE_URL = ""
QELLY_FEEDBACK_REST_URL = ""

# Add these only through the official Cloudflare dashboard or Wrangler secret store:
# QELLY_TURNSTILE_SECRET_KEY
# QELLY_SUPABASE_SERVICE_ROLE_KEY
#
# Do not place passwords, database URLs, raw tokens, private keys or recovery codes here.
# The custom terminal domain is the production authority; pages.dev is retained only as a controlled rollback/preview origin.
