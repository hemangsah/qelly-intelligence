name: Qelly Prompt 2B Saved Lifecycle Focused Review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: read-all
concurrency:
  group: qelly-prompt2b-saved-action-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  QELLY_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
  QELLY_REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
jobs:
  saved-action-focused:
    if: github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - name: Guard exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with: {path: ~/.cache/ms-playwright, key: 'qelly-prompt2b-node-playwright-${{ runner.os }}-${{ hashFiles(''package-lock.json'') }}-chromium'}
      - name: Build exact compiled application
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:pages-preview
          npm run smoke:pages-preview
      - name: Run saved lifecycle action acceptance
        run: |
          set -euo pipefail
          node --check scripts/prompt2b-saved-action-review.mjs
          node scripts/prompt2b-saved-action-review.mjs
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile('.prompt2b-review/SAVED_CALCULATION_ACTION_REVIEW.json','utf8'));
          if(report.head!==process.env.QELLY_REVIEW_HEAD) throw new Error(`head:${report.head}`);
          if(report.status!=='passed'||report.failures.length) throw new Error(`saved-action:${report.status}`);
          if(report.actionMatrix.retries!==0||report.actionMatrix.forcedClicks!==0) throw new Error('retry-or-force');
          console.log(JSON.stringify({head:report.head,status:report.status,evidence:report.evidence.length,retries:0,forcedClicks:0},null,2));
          NODE
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-saved-action-focused-${{ env.QELLY_REVIEW_HEAD }}
          path: .prompt2b-review/SAVED_CALCULATION_ACTION_REVIEW.json
          if-no-files-found: error
          retention-days: 30
