name: Qelly Disposable Auth Canary (Superseded)

on:
  push:
    branches:
      - canary/qelly-auth-e2e-20260815

permissions:
  contents: read

concurrency:
  group: qelly-disposable-auth-canary-superseded
  cancel-in-progress: true

jobs:
  canonical-auth-capability:
    name: Verify canonical Auth capability; full E2E moved to self-contained canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_URL: https://qelly-intelligence.pages.dev
      EXPECTED_RELEASE_SHA: df5475a591e99ff932729e9b027317c3deaf10e8
    steps:
      - name: Verify canonical Auth capability without creating an unconfirmable Gmail identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p auth-canary-evidence
          status="$(curl --silent --show-error --location --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -o /tmp/qelly-config.json -w '%{http_code}' \
            "${PUBLIC_URL}/api/v1/config")"
          [[ "$status" == "200" ]] || { echo "Canonical config failed HTTP ${status}"; exit 1; }
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('/tmp/qelly-config.json','utf8'));
          const expected=process.env.EXPECTED_RELEASE_SHA;
          const evidence={
            status:'passed',
            target:'canonical-production',
            publicUrl:process.env.PUBLIC_URL,
            supersededReason:'The former Gmail-alias workflow could not consume mandatory confirmation mail. Full register-confirm-login-delete coverage is owned by Qelly Self-Contained Auth E2E Canary.',
            releaseSha:config?.release?.sha||null,
            auth:{
              authenticated:config?.auth?.authenticated===true,
              emailDeliveryAvailable:config?.auth?.emailDeliveryAvailable===true
            }
          };
          fs.writeFileSync('auth-canary-evidence/result.json',JSON.stringify(evidence,null,2));
          if(evidence.releaseSha!==expected)throw new Error(`release_identity_mismatch_${evidence.releaseSha}`);
          if(evidence.auth.emailDeliveryAvailable!==true)throw new Error('auth_email_delivery_not_available');
          NODE
          echo 'Canonical Auth capability is live. Gmail-alias pseudo-E2E is retired; confirmation-consuming E2E is tested by the self-contained canary.'
      - name: Upload redacted Auth capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-disposable-auth-capability-${{ github.sha }}
          path: auth-canary-evidence
          if-no-files-found: error
          retention-days: 3
