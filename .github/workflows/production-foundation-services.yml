name: Production Foundation Services

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: production-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qelly
          POSTGRES_USER: qelly
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qelly -d qelly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://qelly:${{ github.run_id }}@127.0.0.1:5432/qelly
      QELLY_MIGRATION_DATABASE_URL: postgres://qelly:${{ github.run_id }}@127.0.0.1:5432/qelly
      QELLY_MIGRATION_PROFILE: platform
      REDIS_URL: redis://127.0.0.1:6379/0
      QELLY_SESSION_SECRET: qelly-ci-session-${{ github.sha }}
      QELLY_PASSWORD_PEPPER: qelly-ci-pepper-${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply platform migrations
        run: npm run migrate
      - name: Verify migration idempotency and checksum stability
        run: npm run migrate
      - name: Verify migration status
        run: npm run migrate -- --status
      - name: Verify concurrent migration locking
        shell: bash
        run: |
          npm run migrate &
          first=$!
          npm run migrate &
          second=$!
          wait "$first"
          wait "$second"
      - name: Verify PostgreSQL platform, migration 108, persisted domains, and Redis jobs
        run: node scripts/production-dependency-integration.mjs
