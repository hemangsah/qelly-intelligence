name: DEX Typography Owner Pair V2
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact baseline source for the isolated comparison
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        expected: [red, green]
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ matrix.expected == 'red' && inputs.production_sha || github.sha }}
      QELLY_DEX_TYPE_EXPECT: ${{ matrix.expected }}
      QELLY_DEX_CONTROL_MATRIX: 'true'
      QELLY_CSS_EXPERIMENT_BASELINE: preview/css-import-baseline
      QELLY_SCREEN_BATCH_SIZE: '10'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.expected == 'red' && inputs.production_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .dex-type-runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies in cloud
        run: npm ci --ignore-scripts
      - name: Install official cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Bind existing visual runner executable path
        run: >-
          test -e /usr/bin/chromium || sudo ln -s "$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" /usr/bin/chromium
      - name: Build exact source in production-mode fixture configuration
        run: |
          test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
          npm run build:frontend
      - name: Verify every inherited DEX interaction and expanded typography evidence
        run: |
          cp .dex-type-runner/scripts/qelly-dex-typography-owner-pair.mjs scripts/qelly-dex-typography-owner-pair.mjs
          cp .dex-type-runner/scripts/qelly-dex-typography-owner-report.mjs scripts/qelly-dex-typography-owner-report.mjs
          cp .dex-type-runner/scripts/qelly-dex-typography-owner-published.mjs scripts/qelly-dex-typography-owner-published.mjs
          cp .dex-type-runner/scripts/qelly-dex-typography-png.mjs scripts/qelly-dex-typography-png.mjs
          node scripts/qelly-dex-typography-owner-pair.mjs
          node scripts/qelly-dex-typography-owner-published.mjs preview/dex-typography-owner-pair "$QELLY_DEX_TYPE_EXPECT" "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Preserve paired source-bound evidence in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-typography-${{ matrix.expected }}-${{ github.sha }}
          path: preview/dex-typography-owner-pair
          if-no-files-found: error
          retention-days: 7

  verify-published:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-dex-controls-typography-red-${{ github.sha }}
          path: ${{ runner.temp }}/dex-type-red
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-dex-controls-typography-green-${{ github.sha }}
          path: ${{ runner.temp }}/dex-type-green
          digest-mismatch: error
      - name: Independently verify every source-bound report, image and preserved text
        env:
          BASE_SHA: ${{ inputs.production_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node scripts/qelly-dex-typography-owner-published.mjs "$RUNNER_TEMP/dex-type-red" red "$BASE_SHA" --verify
          node scripts/qelly-dex-typography-owner-published.mjs "$RUNNER_TEMP/dex-type-green" green "$HEAD_SHA" --verify
          node --input-type=module <<'NODE'
          import{readFile,writeFile}from'node:fs/promises';
          import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const hash=value=>createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const get=async arm=>JSON.parse(await readFile(process.env.RUNNER_TEMP+'/dex-type-'+arm+'/report.json','utf8'));
          const red=await get('red'),green=await get('green');assert.equal(red.sourceSha,process.env.BASE_SHA);assert.equal(green.sourceSha,process.env.HEAD_SHA);
          assert.equal(red.schema,'qelly.dex.typography-owner/2.0');assert.equal(green.schema,red.schema);
          assert.equal(red.contentResults.length,8);assert.equal(green.contentResults.length,8);
          const context=(rows,appearance,width)=>{const found=rows.filter(row=>row.appearance===appearance&&row.width===width);assert.equal(found.length,1);return found[0];};
          const contentHashes=[];
          for(const appearance of['dark','light'])for(const width of[1440,768,390,320]){
           const r=context(red.typographyResults,appearance,width),g=context(green.typographyResults,appearance,width);
           assert.deepEqual(g.labels.map(({key,role,text,sourceId})=>({key,role,text,sourceId})),r.labels.map(({key,role,text,sourceId})=>({key,role,text,sourceId})));
           assert.deepEqual(g.controls.map(({key,role,text,tag})=>({key,role,text,tag})),r.controls.map(({key,role,text,tag})=>({key,role,text,tag})));
           const rd=context(red.sourceDisclosureTypographyResults,appearance,width),gd=context(green.sourceDisclosureTypographyResults,appearance,width);
           assert.deepEqual(gd.sources.map(({sourceId,sourceIndex,labels})=>({sourceId,sourceIndex,labels:labels.map(({key,role,text})=>({key,role,text}))})),rd.sources.map(({sourceId,sourceIndex,labels})=>({sourceId,sourceIndex,labels:labels.map(({key,role,text})=>({key,role,text}))})));
           assert.deepEqual(gd.statesBefore,rd.statesBefore);assert.deepEqual(gd.statesAfter,rd.statesAfter);
           const a=context(red.results,appearance,width),b=context(green.results,appearance,width);assert.equal(a.governedDirectoryHash,b.governedDirectoryHash);
           const rc=context(red.contentResults,appearance,width),gc=context(green.contentResults,appearance,width);
           assert.equal(rc.height,width===390?844:900);assert.equal(gc.height,rc.height);
           for(const c of[rc,gc]){assert.equal(c.sources.length,13);assert.ok(c.allText.length>0);assert.ok(c.captions.length>0);assert.ok(c.controls.length>=11);assert.ok(c.sources.every(s=>s.sourceId&&s.text));}
           assert.deepEqual(gc,rc,'All initial source/caption/control text, link destinations, names, values and full DEX page text are preserved');
           contentHashes.push({appearance,width,governedDirectoryHash:a.governedDirectoryHash,contentSha256:hash(rc),disclosureContentSha256:hash(rd.sources.map(({sourceId,sourceIndex,labels})=>({sourceId,sourceIndex,labels:labels.map(({key,role,text})=>({key,role,text}))})))});
          }
          await writeFile(process.env.RUNNER_TEMP+'/dex-type-pair-receipt.json',JSON.stringify({schema:'qelly.dex.typography-pair/2.0',baseline:red.sourceSha,head:green.sourceSha,contextsPerArm:8,measuredLabelsPerArm:288,controlMeasurementsPerArm:88,sourceDisclosureCasesPerArm:104,disclosureTextMeasurementsPerArm:832,imagesPerArm:64,sourceAndCompiledCssOwners:4,originalInteractionContextsPerArm:8,invalidReportsPerArm:62,invalidImagesOrImageSetsPerArm:7,contentHashes,allSourceCaptionControlTextAndGovernedDirectoryHashesEqual:true,newRules:0,newPriorityOverrides:0,newProvidersEnabled:false,numericalEnginesChanged:false,authConfigurationChanged:false,walletExecutionEnabled:false,causalPerformanceImprovementClaimed:false,productionAccepted:false,fullDexWaveAccepted:false})+String.fromCharCode(10));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-typography-pair-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/dex-type-pair-receipt.json
          if-no-files-found: error
          retention-days: 7
