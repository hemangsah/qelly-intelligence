name: Qelly V5.4 Verify Route Evidence
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/public/index.html'
      - 'apps/web/public/assets/route-registry.mjs'
      - 'apps/web/public/assets/qelly-verify-*.mjs'
      - 'apps/web/public/assets/qelly-verify*.css'
      - 'scripts/release-a5-screen-batch-v2.py'
      - 'scripts/release-v53-verify-subview-evidence.py'
      - 'tests/qelly-v53-verify-subview-evidence.test.mjs'
      - '.github/workflows/qelly-v53-verify-subview-evidence.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qelly-v54-verify-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-route-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QELLY_V53_VERIFY_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact Verify evidence head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QELLY_V53_VERIFY_EVIDENCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Guard exact Verify evidence head
        run: test "$(git rev-parse HEAD)" = "$QELLY_V53_VERIFY_EVIDENCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated browser evidence runtime
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Validate source before Verify capture
        run: |
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run security:scan
          npm test
          npm run build:frontend
      - name: Capture canonical Verify and methodology evidence at all nine widths
        run: python -X utf8 scripts/release-v53-verify-subview-evidence.py
      - name: Verify route evidence manifest
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          const root='preview/v53-verify-subview-evidence';
          const manifest=JSON.parse(await readFile(`${root}/manifest.json`,'utf8'));
          const verifyFiles=await readdir(`${root}/qelly-verify`);
          const methodologyFiles=await readdir(`${root}/evidence-methodology`);
          const rootFiles=await readdir(root);
          const pngs=[...verifyFiles,...methodologyFiles].filter(name=>name.endsWith('.png'));
          const sheets=rootFiles.filter(name=>name.startsWith('contact-sheet-')&&name.endsWith('.jpg'));
          const required=['360','390','430','768','1024','1280','1440','1728','1920'];
          const dimensions=manifest.viewports.map(item=>String(item.width));
          const surfaces=new Set(manifest.surfaces.map(item=>item.id));
          const ok=manifest.status==='passed'&&manifest.canonicalRouteCount===71&&manifest.canonicalRoute==='qelly-verify'&&manifest.methodologyHostRoute==='market'&&manifest.surfaceCount===2&&manifest.viewportCount===9&&manifest.renderCount===18&&manifest.expectedRenderCount===18&&manifest.failureCount===0&&manifest.missing.length===0&&manifest.aliasNormalized===true&&pngs.length===18&&sheets.length===9&&surfaces.has('qelly-verify')&&surfaces.has('evidence-methodology')&&required.every(width=>dimensions.includes(width));
          console.log(JSON.stringify({status:manifest.status,canonicalRouteCount:manifest.canonicalRouteCount,canonicalRoute:manifest.canonicalRoute,methodologyHostRoute:manifest.methodologyHostRoute,surfaceCount:manifest.surfaceCount,viewportCount:manifest.viewportCount,renderCount:manifest.renderCount,pngs:pngs.length,contactSheets:sheets.length,aliasNormalized:manifest.aliasNormalized,dimensions},null,2));
          if(!ok)process.exit(1);
          NODE
      - name: Upload Verify route evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-v54-verify-route-${{ env.QELLY_V53_VERIFY_EVIDENCE_SHA }}
          path: preview/v53-verify-subview-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
