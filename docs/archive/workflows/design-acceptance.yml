name: Design Acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions: read-all
concurrency:
  group: qelly-prompt2b-fast-track-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  QELLY_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  QELLY_REVIEW_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  QELLY_FAST_TRACK_MODE_FILE: project-state/QELLY_PROMPT2B_FAST_TRACK_MODE.json
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      a11y_matrix: ${{ steps.plan.outputs.a11y_matrix }}
      browser_cases: ${{ steps.plan.outputs.browser_cases }}
      a11y_checks: ${{ steps.plan.outputs.a11y_checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - id: plan
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
          node --check scripts/prompt2b-fasttrack-plan.mjs
          node scripts/prompt2b-fasttrack-plan.mjs
  prepare:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - id: frontend-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with: {path: dist/frontend, key: 'qelly-prompt2b-frontend-${{ runner.os }}-${{ env.QELLY_REVIEW_HEAD }}'}
      - run: npm ci --ignore-scripts
      - name: Validate fast-track contracts
        run: |
          set -euo pipefail
          for file in scripts/prompt2b-fasttrack-plan.mjs scripts/prompt2b-prepared-build.mjs scripts/prompt2b-browser-shard.mjs scripts/prompt2b-browser-aggregate.mjs scripts/prompt2b-fasttrack/browser-contract.mjs scripts/prompt2b-fasttrack/browser-helpers.mjs scripts/prompt2b-saved-action-review.mjs scripts/prompt2b-acceptance-verify.mjs scripts/build-prompt2b-18-section-review.mjs; do node --check "$file"; done
          python3 -m py_compile scripts/prompt2b_fasttrack_a11y_contract.py scripts/prompt2b-a11y-shard.py scripts/prompt2b-a11y-aggregate.py scripts/prompt2b-final-package.py
          python3 -m json.tool project-state/QELLY_PROMPT2B_FAST_TRACK_MODE.json >/dev/null
          python3 -m json.tool project-state/QELLY_PROMPT2B_HISTORICAL_EVIDENCE_CLASSIFICATION.json >/dev/null
          node scripts/prompt2b-fasttrack-plan.mjs
      - name: Focused non-browser gates
        if: needs.plan.outputs.mode == 'focused'
        run: |
          set -euo pipefail
          node --test tests/hash-route-state.test.mjs tests/browser-saved-calculation-lifecycle.test.mjs tests/calculation-service-parity.test.mjs tests/saved-calculation-lifecycle.test.mjs tests/saved-calculation-store.test.mjs tests/calculation-engine.test.mjs tests/calculation-security.test.mjs tests/fresh-formula-catalog.test.mjs tests/fresh-indicator-catalog.test.mjs tests/indicator-engine.test.mjs
          npm run validate:design && npm run validate:brand && npm run security:scan
      - name: Complete acceptance non-browser gates
        if: needs.plan.outputs.mode == 'acceptance'
        run: |
          set -euo pipefail
          npm run env:check && npm run typecheck && npm run lint && npm run validate:design && npm run validate:brand && npm run security:scan
          npm test
          node --test tests/calculation-engine.test.mjs tests/calculation-security.test.mjs tests/fresh-formula-catalog.test.mjs tests/fresh-indicator-catalog.test.mjs tests/calculation-service-parity.test.mjs tests/indicator-engine.test.mjs tests/hash-route-state.test.mjs tests/browser-saved-calculation-lifecycle.test.mjs tests/saved-calculation-lifecycle.test.mjs tests/saved-calculation-store.test.mjs
          npm run build && npm run validate:product && npm run inventory:product && npm run smoke
          NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
          npm run release:check && npm audit --audit-level=high
      - if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
      - run: |
          set -euo pipefail
          npm run validate:pages-preview && npm run smoke:pages-preview
          node scripts/prompt2b-prepared-build.mjs create
          node scripts/prompt2b-prepared-build.mjs verify
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-prepared-${{ env.QELLY_REVIEW_HEAD }}
          path: |
            dist/frontend
            prompt2b-prepared/PREPARED_BUILD.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  browser_shard:
    needs: [plan, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    env:
      QELLY_BROWSER: ${{ matrix.browser }}
      QELLY_ROUTE: ${{ matrix.route }}
      QELLY_SHARD_OUTPUT: .prompt2b-shard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - run: mkdir -p ".prompt2b-shard/$QELLY_BROWSER--$QELLY_ROUTE" && printf '{"head":"%s","status":"initialized"}\n' "$QELLY_REVIEW_HEAD" > ".prompt2b-shard/$QELLY_BROWSER--$QELLY_ROUTE/BOOTSTRAP.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with: {path: ~/.cache/ms-playwright, key: 'qelly-prompt2b-node-playwright-${{ runner.os }}-${{ hashFiles(''package-lock.json'') }}-${{ matrix.browser }}'}
      - run: npm ci --ignore-scripts && npx playwright install --with-deps "$QELLY_BROWSER"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'qelly-prompt2b-prepared-${{ env.QELLY_REVIEW_HEAD }}', path: .}
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
          node scripts/prompt2b-prepared-build.mjs verify
          node scripts/prompt2b-browser-shard.mjs
      - if: always()
        run: test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD" && test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'qelly-prompt2b-browser-${{ matrix.browser }}-${{ matrix.route }}-${{ env.QELLY_REVIEW_HEAD }}', path: .prompt2b-shard, include-hidden-files: true, if-no-files-found: error, retention-days: 30}
  a11y_shard:
    needs: [plan, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix: ${{ fromJSON(needs.plan.outputs.a11y_matrix) }}
    env:
      QELLY_A11Y_ROUTE: ${{ matrix.route }}
      QELLY_A11Y_OUTPUT: .prompt2b-a11y-shard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - run: mkdir -p ".prompt2b-a11y-shard/$QELLY_A11Y_ROUTE" && printf '{"head":"%s","status":"initialized"}\n' "$QELLY_REVIEW_HEAD" > ".prompt2b-a11y-shard/$QELLY_A11Y_ROUTE/BOOTSTRAP.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with: {path: ~/.cache/ms-playwright, key: 'qelly-prompt2b-python-playwright-${{ runner.os }}-1.61.0-chromium'}
      - run: |
          npm ci --ignore-scripts
          python3 -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: playwright==1.61.0 pyee==13.0.1 greenlet==3.5.3 typing-extensions==4.16.0
          python3 -m pip check
          python3 -m playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'qelly-prompt2b-prepared-${{ env.QELLY_REVIEW_HEAD }}', path: .}
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
          node scripts/prompt2b-prepared-build.mjs verify
          python3 scripts/prompt2b-a11y-shard.py
      - if: always()
        run: test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD" && test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'qelly-prompt2b-a11y-${{ matrix.route }}-${{ env.QELLY_REVIEW_HEAD }}', path: .prompt2b-a11y-shard, include-hidden-files: true, if-no-files-found: error, retention-days: 30}
  browser_aggregate:
    needs: [plan, prepare, browser_shard]
    if: always() && needs.plan.result == 'success' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'qelly-prompt2b-browser-*-${{ env.QELLY_REVIEW_HEAD }}', path: .prompt2b-shards, merge-multiple: true}
      - run: node scripts/prompt2b-browser-aggregate.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'qelly-prompt2b-browser-aggregate-${{ env.QELLY_REVIEW_HEAD }}', path: .prompt2b-review, include-hidden-files: true, if-no-files-found: error, retention-days: 30}
  a11y_aggregate:
    needs: [plan, prepare, a11y_shard]
    if: always() && needs.plan.result == 'success' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'qelly-prompt2b-a11y-*-${{ env.QELLY_REVIEW_HEAD }}', path: .prompt2b-a11y-shards, merge-multiple: true}
      - run: python3 scripts/prompt2b-a11y-aggregate.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-a11y-aggregate-${{ env.QELLY_REVIEW_HEAD }}
          path: |
            .prompt2b-a11y-review
            validation/RELEASE_A5_ACCESSIBILITY_REGRESSION.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  focused_gate:
    needs: [plan, prepare, browser_aggregate, a11y_aggregate]
    if: always() && needs.plan.outputs.mode == 'focused'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          printf '{"head":"%s","mode":"focused","browserCases":%s,"accessibilityChecks":%s,"prepare":"%s","browserAggregate":"%s","a11yAggregate":"%s","acceptanceClaim":false}\n' "$QELLY_REVIEW_HEAD" '${{ needs.plan.outputs.browser_cases }}' '${{ needs.plan.outputs.a11y_checks }}' '${{ needs.prepare.result }}' '${{ needs.browser_aggregate.result }}' '${{ needs.a11y_aggregate.result }}' > QELLY_PROMPT2B_FOCUSED_GATE.json
          test '${{ needs.prepare.result }}' = success
          test '${{ needs.browser_aggregate.result }}' = success
          test '${{ needs.a11y_aggregate.result }}' = success
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'qelly-prompt2b-focused-gate-${{ env.QELLY_REVIEW_HEAD }}', path: QELLY_PROMPT2B_FOCUSED_GATE.json, if-no-files-found: error, retention-days: 30}
  acceptance:
    needs: [plan, prepare, browser_aggregate, a11y_aggregate]
    if: always() && needs.plan.outputs.mode == 'acceptance' && needs.prepare.result == 'success' && needs.browser_aggregate.result == 'success' && needs.a11y_aggregate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ env.QELLY_REVIEW_HEAD }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with: {path: ~/.cache/ms-playwright, key: 'qelly-prompt2b-node-playwright-${{ runner.os }}-${{ hashFiles(''package-lock.json'') }}-chromium'}
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'qelly-prompt2b-prepared-${{ env.QELLY_REVIEW_HEAD }}', path: .}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'qelly-prompt2b-browser-aggregate-${{ env.QELLY_REVIEW_HEAD }}', path: .prompt2b-review}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'qelly-prompt2b-a11y-aggregate-${{ env.QELLY_REVIEW_HEAD }}', path: .}
      - run: |
          set -euo pipefail
          node scripts/prompt2b-prepared-build.mjs verify
          node scripts/prompt2b-acceptance-verify.mjs matrix
          node scripts/prompt2b-saved-action-review.mjs
          node scripts/build-prompt2b-18-section-review.mjs
          node scripts/prompt2b-acceptance-verify.mjs final
          python3 scripts/prompt2b-final-package.py
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          test "$(git ls-remote origin refs/heads/$QELLY_REVIEW_BRANCH | cut -f1)" = "$QELLY_REVIEW_HEAD"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-final-18-section-review-${{ env.QELLY_REVIEW_HEAD }}
          path: |
            qelly-prompt2b-final-18-section-review.zip
            qelly-prompt2b-final-18-section-review.zip.sha256
            qelly-prompt2b-final-18-section-review.metadata.json
            .prompt2b-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
