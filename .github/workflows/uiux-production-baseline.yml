name: Nov10 Public Sitemap Separator Pair
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact accepted production baseline for controlled comparison
        required: true
        type: string
        default: 172eb87d5cd229a11eb751578fb26dfbe344b0db
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QELLY_SITEMAP_DIAGNOSTIC_HEAD: ${{ github.sha }}
      QELLY_SITEMAP_RED_ROOT: ${{ github.workspace }}/red
      QELLY_SITEMAP_GREEN_ROOT: ${{ github.workspace }}/green
      QELLY_SITEMAP_OUTPUT: ${{ runner.temp }}/qelly-sitemap-pair
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - name: Require exact accepted baseline
        run: test '${{ inputs.production_sha }}' = 172eb87d5cd229a11eb751578fb26dfbe344b0db
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          path: red
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          path: green
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Require existing native schema-validation runtime
        run: command -v pwsh
      - name: Compare pinned builds, real pre-build tests and official schema
        run: node runner/work/nov10-sitemap-pair-runner.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qelly-public-sitemap-pair-${{ github.sha }}
          path: ${{ runner.temp }}/qelly-sitemap-pair
          if-no-files-found: error
          retention-days: 7
  verify-published:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QELLY_SITEMAP_DIAGNOSTIC_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-public-sitemap-pair-${{ github.sha }}
          path: ${{ runner.temp }}/published-sitemap-pair
          digest-mismatch: error
      - name: Independently validate published bytes, every hash and official schema
        run: node work/nov10-sitemap-pair-runner.mjs --verify "$RUNNER_TEMP/published-sitemap-pair"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-public-sitemap-pair-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/published-sitemap-pair/independent-published-receipt.json
          if-no-files-found: error
          retention-days: 7
