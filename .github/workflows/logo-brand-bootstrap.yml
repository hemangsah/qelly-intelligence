name: Qelly Logo Brand Source Bootstrap

on:
  push:
    branches: [feature/logo-first-brand-system]
    paths:
      - '.qelly-brand-bootstrap/**'
      - '.github/workflows/logo-brand-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.qelly-brand-bootstrap/**'
      - '.github/workflows/logo-brand-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qelly-logo-brand-source-bootstrap
  cancel-in-progress: true

jobs:
  diagnose-prepared-bundle:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/logo-first-brand-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact logo branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Build closed diagnostic record
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qelly-brand-diagnostic
          archive=/tmp/qelly-brand-bundle.tar.gz
          cat .qelly-brand-bootstrap/chunk-* | tr -d '\r\n' | base64 --decode > "$archive"
          actual_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected_sha='840d9910e193daa3d001436c0c44b556b010742d5e779fd072f6db7bce313558'
          bytes="$(stat -c%s "$archive")"
          gzip_valid=false
          tar_valid=false
          required_files=false
          if gzip -t "$archive"; then gzip_valid=true; fi
          if tar -tzf "$archive" > .qelly-brand-diagnostic/BUNDLE_CONTENTS.txt; then tar_valid=true; fi
          if [ "$tar_valid" = true ]; then
            if grep -qx 'apps/web/public/assets/qelly-brand.mjs' .qelly-brand-diagnostic/BUNDLE_CONTENTS.txt \
              && grep -qx 'scripts/generate-logo-assets.mjs' .qelly-brand-diagnostic/BUNDLE_CONTENTS.txt \
              && grep -qx 'scripts/logo-brand-governance.mjs' .qelly-brand-diagnostic/BUNDLE_CONTENTS.txt \
              && grep -qx 'scripts/logo-brand-review.mjs' .qelly-brand-diagnostic/BUNDLE_CONTENTS.txt \
              && grep -qx 'tests/logo-brand-system.test.mjs' .qelly-brand-diagnostic/BUNDLE_CONTENTS.txt; then
              required_files=true
            fi
          fi
          python - "$actual_sha" "$expected_sha" "$bytes" "$gzip_valid" "$tar_valid" "$required_files" <<'PY'
          import json,sys
          actual,expected,size,gzip_valid,tar_valid,required=sys.argv[1:]
          record={
            'branch':'feature/logo-first-brand-system',
            'source':'bounded Base64 chunk-00 through chunk-06',
            'decodedBytes':int(size),
            'actualSha256':actual,
            'recordedExpectedSha256':expected,
            'hashMatches':actual==expected,
            'gzipValid':gzip_valid=='true',
            'tarValid':tar_valid=='true',
            'requiredFilesPresent':required=='true'
          }
          open('.qelly-brand-diagnostic/INTEGRITY.json','w').write(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
          if [ "$actual_sha" = "$expected_sha" ] && [ "$gzip_valid" = true ] && [ "$tar_valid" = true ] && [ "$required_files" = true ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload exact integrity diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-logo-prepared-bundle-diagnostic
          path: .qelly-brand-diagnostic
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on any mismatch
        if: steps.diagnose.outputs.passed != 'true'
        run: |
          echo 'Prepared logo source bundle did not satisfy the recorded integrity contract.' >&2
          exit 1
