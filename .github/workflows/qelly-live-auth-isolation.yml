name: Qelly Live Auth Isolation 150025b

on:
  push:
    branches: [forensics/qelly-live-auth-150025b]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run temporary-mail Auth, cloud lifecycle and tenant isolation
        run: node forensics/qelly-live-auth-isolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qelly-live-auth-isolation-150025b
          path: dist/live-auth-isolation
          if-no-files-found: error
          retention-days: 3
