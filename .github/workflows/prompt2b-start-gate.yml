name: Qelly Prompt 2B Start Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prompt2b-start-gate.yml'
      - 'project-state/QELLY_PROMPT2B_EXECUTION_LEDGER.md'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: qelly-prompt2b-start-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-start:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_MAIN: 9cb98780893924ad26fbf4baaa9048e80a162b2c
      EXPECTED_PRODUCT_MAIN: ea16ac3ff71aae9c000772189e472e68cf876b44
      PUBLIC_URL: https://hemangsah.github.io/qelly-intelligence/
    steps:
      - name: Check out exact Wave 1 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ancestry, scope and immutable tags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          test "$(git rev-parse qelly-design-foundation-v1^{})" = "239f6f0c7c663801662f4e5f940ca76fb6941bf1"
          test "$(git rev-parse qelly-brand-foundation-v1^{})" = "94fbd4ff91c0d61f87e42724038f03fa5c36f97a"
          changed=$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sort)
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/prompt2b-start-gate.yml\nproject-state/QELLY_PROMPT2B_EXECUTION_LEDGER.md'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository gates on exact closeout main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN"
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run validate:brand
          npm run security:scan
          npm test
          npm run build
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:product
          npm run inventory:product
          npm run smoke
          NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
          npm run release:check
          npm audit --audit-level=high
          git diff --check
          git checkout -

      - name: Verify exact-main push workflows, Pages and public resources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .prompt2b-start
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const repo=process.env.GH_REPO,sha=process.env.EXPECTED_MAIN,token=process.env.GH_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Qelly-Prompt2B-Start'};
          const get=async url=>{const r=await fetch(url,{headers});if(!r.ok)throw new Error(`${r.status} ${url} ${await r.text()}`);return r.json()};
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const required=['Continuous Integration','Container Build','Production Foundation Services','CodeQL'];
          let runs=[];
          for(let attempt=0;attempt<30;attempt++){
            const data=await get(`https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&event=push&per_page=100`);
            runs=required.map(name=>data.workflow_runs.find(run=>run.name===name)).filter(Boolean);
            if(runs.length===required.length&&runs.every(run=>run.status==='completed'))break;
            await sleep(10000);
          }
          if(runs.length!==required.length||runs.some(run=>run.conclusion!=='success'))throw new Error(`main workflows not green: ${JSON.stringify(runs.map(run=>({name:run.name,id:run.id,status:run.status,conclusion:run.conclusion})))}`);
          let deployment=null,status=null;
          for(let attempt=0;attempt<30;attempt++){
            const deployments=await get(`https://api.github.com/repos/${repo}/deployments?sha=${sha}&environment=github-pages&per_page=20`);
            deployment=deployments[0]||null;
            if(deployment){const statuses=await get(deployment.statuses_url);status=statuses[0]||null;if(status?.state==='success')break;}
            await sleep(10000);
          }
          if(!deployment||status?.state!=='success')throw new Error(`Pages deployment missing: ${JSON.stringify({deployment,status})}`);
          const resources=[process.env.PUBLIC_URL,`${process.env.PUBLIC_URL}manifest.webmanifest`];
          const publicChecks=[];
          for(const url of resources){const response=await fetch(url,{redirect:'follow'});publicChecks.push({url,status:response.status,ok:response.ok,contentType:response.headers.get('content-type')});if(!response.ok)throw new Error(`public resource failed ${url} ${response.status}`);}
          const report={schemaVersion:1,verifiedAt:new Date().toISOString(),repository:repo,exactCloseoutMain:sha,exactProductMain:process.env.EXPECTED_PRODUCT_MAIN,pushWorkflows:runs.map(run=>({name:run.name,id:run.id,status:run.status,conclusion:run.conclusion,headSha:run.head_sha,event:run.event})),pages:{deploymentId:deployment.id,statusId:status.id,state:status.state,environmentUrl:status.environment_url||deployment.environment_url},publicChecks,truth:'static/read-only preview; no connected financial provider'};
          await writeFile('.prompt2b-start/START_GATE.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Upload start-gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-start-gate
          path: .prompt2b-start
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
