name: UIUX Production Baseline
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact production revision to profile
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: qelly-uiux-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile-live-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        appearance: [dark, light]
        width: [1440, 390]
    env:
      QELLY_UIUX_BASE_SHA: ${{ inputs.production_sha }}
      QELLY_UIUX_APPEARANCE: ${{ matrix.appearance }}
      QELLY_UIUX_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked cloud-only profiling dependencies
        run: npm ci --ignore-scripts
      - name: Install cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Measure actual production without protected writes
        run: node scripts/qelly-uiux-production-profile.mjs
      - name: Keep raw CPU profiles in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-uiux-profile-${{ env.QELLY_UIUX_BASE_SHA }}-${{ matrix.appearance }}-${{ matrix.width }}
          path: uiux-profile
          retention-days: 14
      - name: Publish compact profiling receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-uiux-profile-receipt-${{ matrix.appearance }}-${{ matrix.width }}
          path: uiux-profile/receipt.json
          retention-days: 14
