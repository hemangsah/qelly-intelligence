name: PR13 Visual Review Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/pr13-visual-review-finalizer.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/logo-first-brand-system'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact reviewer timing correction and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/logo-brand-visual-correction-review.mjs')
          text=path.read_text()
          pairs=[
            ("page=await context.newPage();stop=attachTelemetry(page,meta);const started=Date.now();await page.goto(appUrl('market'),{waitUntil:'domcontentloaded',timeout:30000});","page=await context.newPage();stop=attachTelemetry(page,meta);const navigationStarted=Date.now();await page.goto(appUrl('market'),{waitUntil:'domcontentloaded',timeout:30000});"),
            ("opening.push({...meta,overlayFrames:count,durationMs:Date.now()-started,result:count===0?'passed':'failed'});","opening.push({...meta,overlayFrames:count,durationMs:Date.now()-navigationStarted,result:count===0?'passed':'failed'});"),
            ("const overlay=page.locator('.qelly-opening');await overlay.waitFor({state:'visible',timeout:3000});","const overlay=page.locator('.qelly-opening');await overlay.waitFor({state:'visible',timeout:3000});const started=Date.now();")
          ]
          for old,new in pairs:
              count=text.count(old)
              if count!=1: raise SystemExit(f'expected one occurrence, found {count}: {old[:120]!r}')
              text=text.replace(old,new)
          path.write_text(text)
          PY
          node --check scripts/logo-brand-visual-correction-review.mjs
          git diff --check
          git rm .github/workflows/pr13-visual-review-finalizer.yml
          git config user.name qelly-review-bot
          git config user.email qelly-review-bot@users.noreply.github.com
          git add scripts/logo-brand-visual-correction-review.mjs
          git commit -m "fix(review): measure opening animation from visible state"
          git push origin HEAD:feature/logo-first-brand-system
