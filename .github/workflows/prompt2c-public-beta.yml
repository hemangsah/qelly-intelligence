name: Qelly Prompt 2C Global Public Beta

on:
  pull_request:
    branches: [feature/calculator-and-indicator-foundation]
  push:
    branches: [feature/prompt2c-global-public-beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt2c-public-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact Prompt 2C head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source with ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify Prompt 2B immutable parent
        shell: bash
        run: |
          git cat-file -e 17eeadac4c510cc3c312185e86b0ac5907f3789b^{commit}
          git merge-base --is-ancestor 17eeadac4c510cc3c312185e86b0ac5907f3789b HEAD
          test "$(git merge-base 17eeadac4c510cc3c312185e86b0ac5907f3789b HEAD)" = "17eeadac4c510cc3c312185e86b0ac5907f3789b"
      - name: Scan repository for committed secrets
        run: npm run security:scan
      - name: Type and syntax check
        run: npm run typecheck
      - name: Lint and repository policy
        run: npm run lint
      - name: Validate governed design foundations
        run: npm run validate:design
      - name: Prompt 2C foundation tests
        run: node --test tests/prompt2c-foundation.test.mjs
      - name: Prompt 2C migration tests
        run: node --test tests/prompt2c-migration.test.mjs
      - name: Prompt 2C public-surface tests
        run: node --test tests/prompt2c-public-surface.test.mjs
      - name: Prompt 2C Supabase adapter tests
        run: node --test tests/prompt2c-supabase-adapter.test.mjs
      - name: Prompt 2C official-provider tests
        run: node --test tests/prompt2c-official-providers.test.mjs
      - name: Prompt 2C telemetry tests
        run: node --test tests/prompt2c-telemetry.test.mjs
      - name: Prompt 2C edge cloud API tests
        run: node --test tests/prompt2c-edge-cloud-api.test.mjs
      - name: Run complete test suite
        run: npm test
      - name: Build backend and frontend
        env:
          QELLY_STATIC_VISUAL_PREVIEW: 'true'
          QELLY_PROMPT2C_PUBLIC_BETA: 'true'
          QELLY_PUBLIC_BASE_PATH: /qelly-intelligence/
          QELLY_DEPLOYMENT_ENVIRONMENT: preview
          QELLY_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          QELLY_CLOUD_MODE: local-only
          QELLY_ENABLE_AUTH: 'false'
          QELLY_ENABLE_CLOUD_SYNC: 'false'
          QELLY_ENABLE_LIVE_PROVIDERS: 'false'
          QELLY_ENABLE_FEEDBACK_WRITES: 'false'
        shell: bash
        run: |
          npm run build
          npm run build:frontend
          printf '{"releaseSha":"%s","workflowRun":"%s","deployedAt":null,"mode":"validated-github-pages-public-beta-fallback","cloudMode":"local-only","authentication":false,"cloudSync":false,"liveProviders":false,"protectedWrites":false,"fallbackUrl":"https://hemangsah.github.io/qelly-intelligence/"}\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > dist/frontend/qelly-release.json
      - name: Validate compiled public beta
        shell: bash
        run: |
          npm run validate:pages-preview
          npm run smoke:pages-preview
          node scripts/validate-prompt2c-public-beta.mjs
          test -f dist/frontend/robots.txt
          test -f dist/frontend/sitemap.xml
          test -f dist/frontend/prompt2c-sw.js
          test -f dist/frontend/legal/privacy.html
          test -f dist/frontend/support.html
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/frontend/qelly-release.json','utf8')).releaseSha")" = "${GITHUB_SHA}"
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/frontend/qelly-release.json','utf8')).cloudMode")" = "local-only"
      - name: Record exact-head release manifest
        shell: bash
        run: |
          mkdir -p dist/release-evidence
          cp dist/frontend/qelly-release.json dist/release-evidence/QELLY_PROMPT2C_RELEASE_MANIFEST.json
          find dist/frontend -type f -print0 | sort -z | xargs -0 sha256sum > dist/release-evidence/QELLY_PROMPT2C_FRONTEND_SHA256.txt

  deploy-fallback:
    name: Deploy deterministic GitHub Pages fallback
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/prompt2c-global-public-beta'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact source with ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build deterministic fallback
        env:
          QELLY_STATIC_VISUAL_PREVIEW: 'true'
          QELLY_PROMPT2C_PUBLIC_BETA: 'true'
          QELLY_PUBLIC_BASE_PATH: /qelly-intelligence/
          QELLY_DEPLOYMENT_ENVIRONMENT: preview
          QELLY_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          QELLY_CLOUD_MODE: local-only
          QELLY_ENABLE_AUTH: 'false'
          QELLY_ENABLE_CLOUD_SYNC: 'false'
          QELLY_ENABLE_LIVE_PROVIDERS: 'false'
          QELLY_ENABLE_FEEDBACK_WRITES: 'false'
        shell: bash
        run: |
          npm run build:frontend
          printf '{"releaseSha":"%s","workflowRun":"%s","deployedAt":"%s","mode":"github-pages-public-beta-fallback","cloudMode":"local-only","authentication":false,"cloudSync":false,"liveProviders":false,"protectedWrites":false,"fallbackUrl":"https://hemangsah.github.io/qelly-intelligence/"}\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/frontend/qelly-release.json
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/frontend/qelly-release.json','utf8')).releaseSha")" = "${GITHUB_SHA}"
          npm run validate:pages-preview
          node scripts/validate-prompt2c-public-beta.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload exact-head frontend
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/frontend
      - name: Deploy exact-head fallback
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
