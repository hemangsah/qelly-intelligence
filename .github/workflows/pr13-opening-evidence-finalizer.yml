name: PR13 Opening Evidence Finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/pr13-opening-evidence-finalizer.yml']

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feature/logo-first-brand-system'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 0
          persist-credentials: true
      - name: Hold opening only for deterministic evidence and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/logo-brand-visual-correction-review.mjs')
          text=path.read_text()
          pairs=[
            ("await installInit(context,{appearance:'dark',themeFamily:'sovereign-obsidian',seen:repeat,holdOpening:false});","await installInit(context,{appearance:'dark',themeFamily:'sovereign-obsidian',seen:repeat,holdOpening:!repeat});"),
            ("if(browserName==='chromium'&&mode==='reduced'){await page.waitForTimeout(20);await captureViewport(page,path.join(evidenceDir,'opening-reduced-final-lockup.png'),'Reduced-motion opening — single final lockup','Reduced motion shows one clean horizontal lockup with no standalone duplicate Q.',{});}\n        await overlay.waitFor({state:'detached',timeout:3500});const duration=Date.now()-started;","if(browserName==='chromium'&&mode==='reduced'){await page.waitForTimeout(20);await captureViewport(page,path.join(evidenceDir,'opening-reduced-final-lockup.png'),'Reduced-motion opening — single final lockup','Reduced motion shows one clean horizontal lockup with no standalone duplicate Q.',{});}\n        const configuredDuration=reduced?120:1180;const remaining=Math.max(0,configuredDuration-(Date.now()-started));if(remaining)await page.waitForTimeout(remaining);await overlay.click({force:true});\n        await overlay.waitFor({state:'detached',timeout:3500});const duration=Date.now()-started;")
          ]
          for old,new in pairs:
              count=text.count(old)
              if count!=1: raise SystemExit(f'expected one occurrence, found {count}: {old[:140]!r}')
              text=text.replace(old,new)
          path.write_text(text)
          PY
          node --check scripts/logo-brand-visual-correction-review.mjs
          git diff --check
          git rm .github/workflows/pr13-opening-evidence-finalizer.yml
          git config user.name qelly-review-bot
          git config user.email qelly-review-bot@users.noreply.github.com
          git add scripts/logo-brand-visual-correction-review.mjs
          git commit -m "fix(review): hold and release opening at governed timing"
          git push origin HEAD:feature/logo-first-brand-system
