name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Scan repository for committed secrets
        run: npm run security:scan
      - name: Validate development environment and safety locks
        run: npm run env:check
      - name: Type and syntax check
        run: npm run typecheck
      - name: Lint and repository policy
        run: npm run lint
      - name: Validate governed design foundations
        run: npm run validate:design
      - name: Test with retained TAP log
        shell: bash
        run: |
          mkdir -p validation
          set -o pipefail
          npm test 2>&1 | tee validation/QELLY_TEST.log
      - name: Production build
        run: npm run build
      - name: Standalone frontend build
        run: QELLY_PUBLIC_API_BASE_URL=https://api.preview.invalid npm run build:frontend
      - name: Validate current product contract
        run: npm run validate:product
      - name: Rebuild current product inventory
        run: npm run inventory:product
      - name: Full-stack smoke
        run: npm run smoke
      - name: Verify database identity isolation
        run: NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
      - name: Release safety check
        run: npm run release:check
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/BUILD_INFO.json
            dist/frontend/BUILD_INFO.json
            validation/QELLY_TEST.log
            validation/PRODUCT_VALIDATION.json
            validation/SMOKE_LOG.json
            artifacts/QELLY_ROUTE_INVENTORY.json
            artifacts/QELLY_API_INVENTORY.json
            artifacts/QELLY_SOURCE_TREE.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Audit locked dependency graph
        run: npm audit --audit-level=high

  prompt2b-omnisource-forensic-checkpoint:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    permissions:
      contents: write
