name: qelly-preview-workloads

# Externally managed PostgreSQL, Redis, S3, email, and private ClamAV are injected
# through .env.preview. This file intentionally does not publish or emulate them.
services:
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.ops
    command: ["scripts/migrate-production.mjs"]
    env_file: ../../.env.preview
    restart: "no"

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file: ../../.env.preview
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: ../../.env.preview
    ports:
      - "4480:4480"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    restart: unless-stopped
