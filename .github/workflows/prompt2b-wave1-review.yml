name: Qelly Prompt 2B Wave 1 Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-wave1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-action-guard-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact guarded head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact parent and live branch
        env:
          EXPECTED_PARENT: 16f0b6058debe44c77cf7de7b56c8133fbe1fd54
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD_SHA"

      - name: Apply and verify per-record action evidence patch
        run: |
          set -euo pipefail
          python3 scripts/prompt2b-browser-action-guard.py
          python3 -m py_compile scripts/prompt2b-browser-action-guard.py
          node --check scripts/prompt2b-final-review.mjs
          grep -q "action-errors:" scripts/prompt2b-final-review.mjs
          grep -q "PROGRESS.json" scripts/prompt2b-final-review.mjs

      - name: Commit durable harness correction
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$HEAD_SHA"
          rm scripts/prompt2b-browser-action-guard.py
          git config user.name "Hemang Sah"
          git config user.email "274469799+hemangsah@users.noreply.github.com"
          git add scripts/prompt2b-final-review.mjs scripts/prompt2b-browser-action-guard.py
          git commit -m "fix(prompt2b): preserve browser action failures per record"
          git push origin "HEAD:$BRANCH"
