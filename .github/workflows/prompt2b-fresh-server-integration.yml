name: Qelly Prompt 2B Fresh Server Integration

on:
  push:
    branches: [feature/calculator-and-indicator-foundation]
    paths: [.github/workflows/prompt2b-fresh-server-integration.yml]

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-fresh-server-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Guard exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8f006a3e665c95bc33523ae94d282d567519ccbd"
          test "$(git ls-remote origin refs/heads/feature/calculator-and-indicator-foundation | cut -f1)" = "$GITHUB_SHA"
      - name: Integrate and diagnose focused gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/server/server.mjs')
          source=path.read_text()
          anchor="import { initializeProductionFoundation, productionFoundationHealth } from '../production/production-foundation.mjs';"
          addition=anchor+"\nimport { handleSavedCalculationRequest } from '../calculations/saved-calculation-routes.mjs';"
          if anchor not in source or 'handleSavedCalculationRequest' in source: raise SystemExit('server import guard failed')
          source=source.replace(anchor,addition,1)
          start=source.index("      if(request.method==='GET' && url.pathname==='/api/v1/calculations/saved')")
          end=source.index("\n\n      if(request.method==='GET' && url.pathname==='/api/v1/evidence/graphs')",start)
          replacement="      if(await handleSavedCalculationRequest({request,response,url,id,runtime,sid,json,bodyJson,scopedContext,idempotent})) return;"
          path.write_text(source[:start]+replacement+source[end:])
          PY
          node --check src/server/server.mjs
          node --check src/calculations/saved-calculation-routes.mjs
          set +e
          node --test tests/fresh-formula-catalog.test.mjs tests/fresh-indicator-catalog.test.mjs tests/saved-calculation-store.test.mjs tests/saved-calculation-lifecycle.test.mjs > /tmp/prompt2b-focused.log 2>&1
          status=$?
          set -e
          cat /tmp/prompt2b-focused.log
          if [ "$status" -ne 0 ]; then
            git checkout -- src/server/server.mjs
            {
              echo '# Qelly Prompt 2B Focused Gate Failure'
              echo
              echo '- Exact workflow head: `'$GITHUB_SHA'`'
              echo '- Server integration was not committed.'
              echo '- One-use workflow removed after recording the complete focused-test log.'
              echo
              echo '```text'
              cat /tmp/prompt2b-focused.log
              echo '```'
            } > project-state/QELLY_PROMPT2B_FOCUSED_GATE_FAILURE.md
          fi
          echo "$status" > /tmp/prompt2b-focused.status
      - name: Commit result and remove one-use workflow
        run: |
          set -euo pipefail
          status=$(cat /tmp/prompt2b-focused.status)
          rm .github/workflows/prompt2b-fresh-server-integration.yml
          git config user.name hemangsah
          git config user.email hemangsah.dn@gmail.com
          git add -A
          git diff --cached --check
          if [ "$status" -eq 0 ]; then
            git commit -m "feat(prompt2b): expose saved calculation lifecycle API"
          else
            git commit -m "test(prompt2b): record focused integration blocker"
          fi
          git push origin HEAD:feature/calculator-and-indicator-foundation
