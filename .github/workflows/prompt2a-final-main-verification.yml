name: Qelly Prompt 2A Final Main Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prompt2a-final-main-verification.yml'
      - 'project-state/**'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: qelly-prompt2a-final-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-final-main:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'chore/prompt2a-final-closeout'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_MAIN: ea16ac3ff71aae9c000772189e472e68cf876b44
      PUBLIC_URL: https://hemangsah.github.io/qelly-intelligence/
    steps:
      - name: Check out exact verified main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ea16ac3ff71aae9c000772189e472e68cf876b44
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies and browser engines
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify exact main and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run validate:brand
          npm run security:scan
          npm test
          npm run build
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:product
          npm run inventory:product
          npm run smoke
          NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
          npm run release:check
          npm audit --audit-level=high
          git diff --check

      - name: Verify exact-main browser and theme matrix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createServer } from 'node:http';
          import path from 'node:path';
          import { chromium, firefox, webkit } from 'playwright';
          const dist=path.resolve('dist/frontend');
          const mime={'.html':'text/html','.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.json':'application/json','.svg':'image/svg+xml','.woff2':'font/woff2','.webmanifest':'application/manifest+json'};
          const server=createServer(async(req,res)=>{const u=new URL(req.url,'http://127.0.0.1');let rel=decodeURIComponent(u.pathname).replace(/^\/qelly-intelligence\/?/,'');if(!rel||rel.endsWith('/'))rel+='index.html';let p=path.join(dist,rel);try{const b=await readFile(p);res.writeHead(200,{'content-type':mime[path.extname(p)]||'application/octet-stream'});res.end(b);}catch{const b=await readFile(path.join(dist,'index.html'));res.writeHead(200,{'content-type':'text/html'});res.end(b);}});
          await new Promise(r=>server.listen(4174,'127.0.0.1',r));
          const browsers=[['chromium',chromium],['firefox',firefox],['webkit',webkit]];
          const viewports=[[360,800],[390,844],[430,932],[768,1024],[1024,768],[1440,1000]];
          const routes=['feature-universe','market','asset-rankings','theme-personas','theme-lab','live-markets'];
          const themes=['dark','light','oled','high-contrast'];
          const records=[];
          for(const [browserName,type] of browsers){const browser=await type.launch({headless:true});for(const [width,height] of viewports){const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});for(const appearance of themes){await context.addInitScript((value)=>{localStorage.setItem('qelly-appearance',value);localStorage.setItem('qelly-opening-seen','true');},appearance);const page=await context.newPage();const consoleErrors=[],pageErrors=[],failed=[];page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('pageerror',e=>pageErrors.push(e.message));page.on('requestfailed',r=>{if(r.url().startsWith('http://127.0.0.1'))failed.push({url:r.url(),error:r.failure()?.errorText})});for(const route of routes){await page.goto(`http://127.0.0.1:4174/qelly-intelligence/#/${route}`,{waitUntil:'domcontentloaded',timeout:20000});await page.waitForSelector('#main',{timeout:15000});await page.waitForTimeout(100);const m=await page.evaluate(()=>{const html=document.documentElement,main=document.querySelector('#main');const logo=document.querySelector('img[src*="qelly"],svg[aria-label*="Qelly" i],.q-brand-lockup');return {text:(main?.textContent||'').trim().length,overflow:Math.max(0,html.scrollWidth-html.clientWidth),font:document.fonts.status,logo:Boolean(logo),appearance:html.dataset.resolvedAppearance||html.dataset.appearance||''};});const truth=route!=='live-markets'||/Illustrative watch universe/.test(await page.locator('#main').textContent());records.push({browser:browserName,width,height,appearance,route,...m,truth,consoleErrors:[...consoleErrors],pageErrors:[...pageErrors],failedResources:[...failed]});consoleErrors.length=0;pageErrors.length=0;failed.length=0;}await page.close();}await context.close();}await browser.close();}
          server.close();
          const failures=records.filter(r=>r.text===0||r.overflow>1||r.font!=='loaded'||!r.truth||r.consoleErrors.length||r.pageErrors.length||r.failedResources.length);
          await import('node:fs/promises').then(fs=>fs.mkdir('.prompt2a-closeout',{recursive:true}).then(()=>fs.writeFile('.prompt2a-closeout/FINAL_MAIN_BROWSER_MATRIX.json',JSON.stringify({head:process.env.EXPECTED_MAIN,records,failures},null,2)+'\n')));
          console.log(JSON.stringify({records:records.length,failures:failures.length},null,2));
          if(failures.length)process.exit(1);
          NODE

      - name: Verify exact-main push workflows and Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .prompt2a-closeout
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const repo=process.env.GH_REPO,sha=process.env.EXPECTED_MAIN,token=process.env.GH_TOKEN;
          const headers={Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Qelly-Prompt2A-Closeout'};
          const get=async url=>{const r=await fetch(url,{headers});if(!r.ok)throw new Error(`${r.status} ${url} ${await r.text()}`);return r.json()};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const required=['Continuous Integration','Container Build','Production Foundation Services','CodeQL'];
          let selected=[];
          for(let attempt=0;attempt<30;attempt++){const data=await get(`https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&event=push&per_page=100`);selected=required.map(name=>data.workflow_runs.find(run=>run.name===name)).filter(Boolean);if(selected.length===required.length&&selected.every(run=>run.status==='completed'))break;await sleep(10000);}
          if(selected.length!==required.length||selected.some(run=>run.conclusion!=='success'))throw new Error(`push workflow matrix incomplete: ${JSON.stringify(selected.map(r=>({name:r.name,status:r.status,conclusion:r.conclusion,id:r.id})))}`);
          let deployment=null,status=null;
          for(let attempt=0;attempt<30;attempt++){const deployments=await get(`https://api.github.com/repos/${repo}/deployments?sha=${sha}&environment=github-pages&per_page=20`);deployment=deployments[0]||null;if(deployment){const statuses=await get(deployment.statuses_url);status=statuses[0]||null;if(status?.state==='success')break;}await sleep(10000);}
          if(!deployment||status?.state!=='success')throw new Error(`Pages deployment not successful: ${JSON.stringify({deployment,status})}`);
          const urls=[process.env.PUBLIC_URL,`${process.env.PUBLIC_URL}manifest.webmanifest`];const publicChecks=[];for(const url of urls){const r=await fetch(url,{redirect:'follow'});publicChecks.push({url,status:r.status,ok:r.ok,contentType:r.headers.get('content-type')});if(!r.ok)throw new Error(`public URL failed ${url} ${r.status}`);}
          const report={schemaVersion:1,verifiedAt:new Date().toISOString(),repository:repo,exactMain:sha,pushWorkflows:selected.map(r=>({name:r.name,id:r.id,status:r.status,conclusion:r.conclusion,event:r.event,headSha:r.head_sha,createdAt:r.created_at,updatedAt:r.updated_at})),pages:{deploymentId:deployment.id,statusId:status.id,state:status.state,environmentUrl:status.environment_url||deployment.environment_url,createdAt:deployment.created_at,updatedAt:status.updated_at},publicChecks,truthLabel:'public static/read-only visual preview; not a connected full production product'};
          await writeFile('.prompt2a-closeout/FINAL_MAIN_GITHUB_STATE.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Upload Prompt 2A final-main evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2a-final-main-verification
          path: .prompt2a-closeout
          if-no-files-found: error
          retention-days: 14
