name: Accessibility
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/public/**'
      - 'scripts/release-v53-accessibility-focus.py'
      - 'tests/qelly-v53-reduced-motion-reveal.test.mjs'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qelly-v53-a11y-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  accessibility-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QELLY_V53_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact accessibility-focus head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QELLY_V53_EVIDENCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Guard exact accessibility-focus head
        run: test "$(git rev-parse HEAD)" = "$QELLY_V53_EVIDENCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated Chromium evidence runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Validate and build exact frontend
        run: |
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run security:scan
          npm test
          npm run build:frontend
      - name: Prove 200 percent zoom, keyboard, reduced motion and color-blind cues
        run: python -X utf8 scripts/release-v53-accessibility-focus.py
      - name: Verify accessibility-focus manifest
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          const root='preview/v53-accessibility-focus';
          const manifest=JSON.parse(await readFile(`${root}/manifest.json`,'utf8'));
          const files=await readdir(root);
          const zoomPngs=files.filter(name=>name.endsWith('__zoom200.png'));
          const colorPngs=files.filter(name=>name==='market__color-blind.png');
          const ok=manifest.status==='passed'&&manifest.canonicalRouteCount===71&&manifest.zoomRouteCount===6&&manifest.failureCount===0&&zoomPngs.length===6&&colorPngs.length===1&&manifest.colorBlind?.status==='passed';
          console.log(JSON.stringify({status:manifest.status,canonicalRouteCount:manifest.canonicalRouteCount,zoomRouteCount:manifest.zoomRouteCount,failureCount:manifest.failureCount,colorBlindStatus:manifest.colorBlind?.status,zoomPngs:zoomPngs.length,colorPngs:colorPngs.length},null,2));
          if(!ok)process.exit(1);
          NODE
      - name: Upload accessibility-focus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-v53-accessibility-focus-${{ env.QELLY_V53_EVIDENCE_SHA }}
          path: preview/v53-accessibility-focus
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
