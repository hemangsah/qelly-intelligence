name: Accessibility Floor Performance
on:
  pull_request:
    branches: [release/qelly-global-public-beta]
    paths:
      - apps/web/public/assets/qelly-production-shell.mjs
      - scripts/qelly-accessibility-floor-performance-e2e.mjs
      - .github/workflows/accessibility-floor-performance.yml
permissions:
  contents: read
env:
  QELLY_SCREEN_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  compare-accessibility-floor:
    name: Compare actual accessibility floor work
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Guard exact candidate head
        run: test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked cloud-only dependencies
        run: npm ci --ignore-scripts
      - name: Install cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Compare actual baseline and batched function
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qelly-accessibility-floor-performance-e2e.mjs
      - name: Preserve compact paired evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-accessibility-floor-${{ github.event.pull_request.head.sha }}
          path: accessibility-floor-evidence/report.json
          retention-days: 30
