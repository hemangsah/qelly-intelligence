name: Qelly Live Auth Isolation 98a88

on:
  push:
    branches: [forensics/qelly-live-auth-98a88]
    paths: [.github/workflows/qelly-live-auth-isolation.yml]

permissions:
  contents: read

concurrency:
  group: qelly-live-auth-isolation-98a88
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production Auth, cloud and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run temporary-mail Auth, cloud lifecycle and tenant isolation
        run: node forensics/qelly-live-auth-isolation-v2-runner.mjs
      - name: Upload redacted Auth and isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qelly-live-auth-isolation-98a88d7
          path: dist/live-auth-isolation
          if-no-files-found: error
          retention-days: 14
