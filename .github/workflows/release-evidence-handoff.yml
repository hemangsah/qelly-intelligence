name: Release Evidence Handoff
on:
  workflow_run:
    workflows: ['Browser E2E']
    types: [completed]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: qelly-browser-evidence-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: true
jobs:
  exact-pr-evidence:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'Browser E2E' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resolve completed exact-head browser archive and trustworthy Cloudflare preview
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BROWSER_RUN_URL: ${{ github.event.workflow_run.url }}
          BROWSER_RUN_ID: ${{ github.event.workflow_run.id }}
          BROWSER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          api_get() {
            curl --fail --silent --show-error \
              --retry 4 --retry-delay 1 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          run_json="$(api_get "$BROWSER_RUN_URL")"
          test "$(jq -r '.id' <<<"$run_json")" = "$BROWSER_RUN_ID"
          test "$(jq -r '.name' <<<"$run_json")" = 'Browser E2E'
          test "$(jq -r '.event' <<<"$run_json")" = 'pull_request'
          test "$(jq -r '.status' <<<"$run_json")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          sha="$(jq -r '.head_sha' <<<"$run_json")"
          test "$sha" = "$BROWSER_HEAD_SHA"
          test "${#sha}" -eq 40
          test "$(jq -r '.head_repository.full_name' <<<"$run_json")" = "$GITHUB_REPOSITORY"

          # Browser E2E API runs sometimes return pull_requests: []. Resolve
          # the matching open PR by commit, never guess from an empty array.
          pulls_json="$(api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$sha/pulls")"
          pr_url="$(jq -r --arg sha "$sha" \
            '[.[] | select(.state == "open" and .head.sha == $sha and .base.ref == "release/qelly-global-public-beta")][0].url // empty' <<<"$pulls_json")"
          if [ -z "$pr_url" ]; then
            echo 'No current open release PR at the verified Browser E2E head; handoff is inapplicable.'
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_json="$(api_get "$pr_url")"
          current_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [ "$current_sha" != "$sha" ]; then
            echo 'Browser run belongs to a superseded pull-request head; exact-PR evidence is intentionally not applicable.'
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '.base.ref' <<<"$pr_json")" = 'release/qelly-global-public-beta'

          artifacts_json="$(api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$BROWSER_RUN_ID/artifacts?per_page=100")"
          archive_name="qelly-complete-all-screens-$sha"
          archive="$(jq -c --arg name "$archive_name" \
            '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 1000000)][0] // empty' <<<"$artifacts_json")"
          test -n "$archive" || { echo 'Exact-head Browser E2E evidence artifact is absent or expired.' >&2; exit 1; }
          archive_id="$(jq -r '.id' <<<"$archive")"
          archive_size="$(jq -r '.size_in_bytes' <<<"$archive")"
          test "$archive_id" -gt 0

          # Require the current trusted Cloudflare Pages check, not a comment,
          # a bot claim or a prior success at a different revision.
          checks_json="$(api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")"
          cf="$(jq -c --arg sha "$sha" \
            '[.check_runs[] | select(.name == "Cloudflare Pages" and .app.slug == "cloudflare-workers-and-pages" and .head_sha == $sha)] | sort_by(.completed_at // .started_at // "") | last // empty' <<<"$checks_json")"
          test -n "$cf" || { echo 'No trusted Cloudflare Pages check at the exact browser head.' >&2; exit 1; }
          test "$(jq -r '.status' <<<"$cf")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$cf")" = 'success'
          jq -e '.output.summary | type == "string" and contains("Deploy successful!")' <<<"$cf" >/dev/null
          cf_id="$(jq -r '.id' <<<"$cf")"
          test "$cf_id" -gt 0

          # Revalidate current PR head after both external evidence queries.
          pr_json="$(api_get "$pr_url")"
          if [ "$(jq -r '.head.sha' <<<"$pr_json")" != "$sha" ] || [ "$(jq -r '.state' <<<"$pr_json")" != 'open' ]; then
            echo 'PR advanced or closed while evidence was being reconciled; skip superseded receipt.'
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r '.number' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "archive_id=$archive_id" >> "$GITHUB_OUTPUT"
          echo "archive_size=$archive_size" >> "$GITHUB_OUTPUT"
          echo "cloudflare_check_id=$cf_id" >> "$GITHUB_OUTPUT"
      - name: Checkout verified exact PR head
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm exact head and source evidence contract
        if: steps.pr.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.pr.outputs.sha }}"
          test -f .github/workflows/browser-e2e.yml
          test -f scripts/release-a5-screen-package.py
          mkdir -p dist/release-evidence-handoff
          jq -n --arg sha "${{ steps.pr.outputs.sha }}" \
            --argjson pr "${{ steps.pr.outputs.pr_number }}" \
            --argjson browserRun "${{ github.event.workflow_run.id }}" \
            --argjson archiveId "${{ steps.pr.outputs.archive_id }}" \
            --argjson archiveBytes "${{ steps.pr.outputs.archive_size }}" \
            --argjson cloudflareCheck "${{ steps.pr.outputs.cloudflare_check_id }}" \
            '{schema:"qelly.exact-head-evidence-handoff/2.0",headSha:$sha,prNumber:$pr,
              browser:{runId:$browserRun,conclusion:"success",completeArchiveId:$archiveId,
                completeArchiveBytes:$archiveBytes,validatedInSourceWorkflow:true},
              cloudflare:{checkRunId:$cloudflareCheck,app:"cloudflare-workers-and-pages",
                conclusion:"success",deploySummaryVerified:true},
              noDuplicateScreenshotCapture:true}' > dist/release-evidence-handoff/receipt.json
          test -s dist/release-evidence-handoff/receipt.json
          jq -e --arg sha "${{ steps.pr.outputs.sha }}" \
            '.headSha == $sha and .browser.conclusion == "success" and .cloudflare.conclusion == "success" and .noDuplicateScreenshotCapture == true' \
            dist/release-evidence-handoff/receipt.json >/dev/null
      - name: Publish small exact-head evidence receipt
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qelly-verified-evidence-receipt-${{ steps.pr.outputs.sha }}
          path: dist/release-evidence-handoff/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Link already validated full browser archive
        if: steps.pr.outputs.eligible == 'true'
        env:
          BROWSER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.pr }}
          ARCHIVE_ID: ${{ steps.pr.outputs.archive_id }}
        run: |
          {
            echo '## Exact-head release evidence'
            echo "PR: $PR_URL"
            echo "Browser E2E: https://github.com/$GH_REPO/actions/runs/$BROWSER_RUN_ID"
            echo "Verified screenshot archive: https://github.com/$GH_REPO/actions/runs/$BROWSER_RUN_ID/artifacts/$ARCHIVE_ID"
            echo 'Original Browser E2E run performed screenshot capture, 72-route completeness checks, accessibility and archive verification. This handoff did not recapture screenshots.'
          } >> "$GITHUB_STEP_SUMMARY"
