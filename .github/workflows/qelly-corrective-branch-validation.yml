name: Qelly Corrective Branch Validation

on:
  push:
    branches:
      - 'agent/qelly-*'
  pull_request:
    branches:
      - 'release/qelly-global-public-beta'
      - 'agent/qelly-*'

permissions:
  contents: read

concurrency:
  group: qelly-corrective-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete Node test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee qelly-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure="$(grep -m1 -E 'not ok|AssertionError|ERR_ASSERTION|Error:' qelly-test.log || true)"
            if [ -z "$failure" ]; then
              failure="$(tail -n 1 qelly-test.log || true)"
            fi
            failure="${failure//'%'/'%25'}"
            failure="${failure//$'\r'/'%0D'}"
            failure="${failure//$'\n'/'%0A'}"
            echo "::error title=Qelly Node test failure::$failure"
          fi
          exit "$status"

      - name: Build Cloudflare frontend bundle
        run: npm run build:frontend
