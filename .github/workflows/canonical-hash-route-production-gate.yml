name: Qelly Canonical Hash Route Gate

on:
  push:
    branches:
      - release/qelly-global-public-beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qelly-canonical-hash-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-hash-routes:
    name: Verify canonical hash routes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_URL: https://qelly-intelligence.pages.dev
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Wait for canonical Cloudflare convergence
        run: node scripts/wait-for-cloudflare-runtime-convergence.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify screenshot-critical hash routes
        run: node scripts/verify-canonical-hash-routes.mjs
      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-canonical-hash-routes-${{ github.sha }}
          path: dist/canonical-hash-route-verification
          if-no-files-found: error
          retention-days: 14
