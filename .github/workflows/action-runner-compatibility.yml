name: Action Runner Compatibility
on:
  pull_request:
    branches: [release/qelly-global-public-beta]
    paths: ['.github/workflows/**']
  push:
    branches: [release/qelly-global-public-beta]
    paths: ['.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qelly-action-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  QELLY_COMPATIBILITY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  prepare:
    name: Save isolated compatibility fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.fixture.outputs.digest }}
    steps:
      - name: Initialize isolated cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qelly-action-compatibility-cache
          key: qelly-action-compatibility-${{ env.QELLY_COMPATIBILITY_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Produce exact-head fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          sha = os.environ['QELLY_COMPATIBILITY_SHA']
          assert len(sha) == 40 and all(c in '0123456789abcdef' for c in sha)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qelly-action-compatibility-cache'
          root.mkdir(parents=True, exist_ok=True)
          data = json.dumps({'headSha': sha, 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': 'isolated-action-fixture'}, sort_keys=True).encode()
          (root / 'fixture.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + hashlib.sha256(data).hexdigest() + '\n')
          PY
      - name: Upload isolated fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qelly-action-fixture-${{ env.QELLY_COMPATIBILITY_SHA }}
          path: ${{ runner.temp }}/qelly-action-compatibility-cache/fixture.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload second fixture for multi-artifact layout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qelly-action-fixture-${{ env.QELLY_COMPATIBILITY_SHA }}-second
          path: ${{ runner.temp }}/qelly-action-compatibility-cache/fixture.json
          if-no-files-found: error
          retention-days: 1
  verify:
    name: Verify cache and artifact roundtrip
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore exact isolated cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qelly-action-compatibility-cache
          key: qelly-action-compatibility-${{ env.QELLY_COMPATIBILITY_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Download artifact by exact name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qelly-action-fixture-${{ env.QELLY_COMPATIBILITY_SHA }}
          path: ${{ runner.temp }}/qelly-action-compatibility-name
          digest-mismatch: error
      - name: Download single pattern match directly
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qelly-action-fixture-${{ env.QELLY_COMPATIBILITY_SHA }}
          path: ${{ runner.temp }}/qelly-action-compatibility-single-pattern
          merge-multiple: false
          digest-mismatch: error
      - name: Download multiple pattern matches into separate directories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qelly-action-fixture-${{ env.QELLY_COMPATIBILITY_SHA }}*
          path: ${{ runner.temp }}/qelly-action-compatibility-pattern
          merge-multiple: false
          digest-mismatch: error
      - name: Verify bytes, identity and extraction layout
        env:
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
          EXACT_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          assert os.environ['EXACT_CACHE_HIT'] == 'true'
          sha = os.environ['QELLY_COMPATIBILITY_SHA']
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          artifact = 'qelly-action-fixture-' + sha
          paths = [temp / 'qelly-action-compatibility-cache' / 'fixture.json', temp / 'qelly-action-compatibility-name' / 'fixture.json', temp / 'qelly-action-compatibility-single-pattern' / 'fixture.json', temp / 'qelly-action-compatibility-pattern' / artifact / 'fixture.json', temp / 'qelly-action-compatibility-pattern' / (artifact + '-second') / 'fixture.json']
          for path in paths:
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_DIGEST'], str(path)
              payload = json.loads(data)
              assert payload == {'headSha': sha, 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': 'isolated-action-fixture'}
          receipt = {'headSha': sha, 'runId': os.environ['GITHUB_RUN_ID'], 'cacheExactHit': True, 'verifiedTransfers': len(paths), 'fixtureSha256': os.environ['EXPECTED_DIGEST'], 'cacheAction': 'v6.1.0', 'downloadAction': 'v8.0.1', 'scope': 'isolated hosted runner fixture; no production data or deployment'}
          print(json.dumps(receipt, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Exact-head action compatibility\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY
