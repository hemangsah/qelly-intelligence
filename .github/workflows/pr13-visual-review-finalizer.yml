name: PR13 Visual Review Finalizer

on:
  push:
    branches: [feature/logo-first-brand-system]
    paths: ['.github/workflows/pr13-visual-review-finalizer.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact reviewer timing and checksum correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
              file=Path(path); text=file.read_text(); count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old,new))
          reviewer='scripts/logo-brand-visual-correction-review.mjs'
          replace(reviewer,"page=await context.newPage();stop=attachTelemetry(page,meta);const started=Date.now();await page.goto(appUrl('market'),{waitUntil:'domcontentloaded',timeout:30000});","page=await context.newPage();stop=attachTelemetry(page,meta);const navigationStarted=Date.now();await page.goto(appUrl('market'),{waitUntil:'domcontentloaded',timeout:30000});")
          replace(reviewer,"opening.push({...meta,overlayFrames:count,durationMs:Date.now()-started,result:count===0?'passed':'failed'});","opening.push({...meta,overlayFrames:count,durationMs:Date.now()-navigationStarted,result:count===0?'passed':'failed'});")
          replace(reviewer,"const overlay=page.locator('.qelly-opening');await overlay.waitFor({state:'visible',timeout:3000});","const overlay=page.locator('.qelly-opening');await overlay.waitFor({state:'visible',timeout:3000});const started=Date.now();")
          workflow='.github/workflows/logo-brand-visual-correction-review.yml'
          replace(workflow,'          sha256sum -c "$root/qelly-logo-first-brand-system-visual-correction-review.zip.sha256"','          (cd "$root" && sha256sum -c qelly-logo-first-brand-system-visual-correction-review.zip.sha256)')
          PY
          node --check scripts/logo-brand-visual-correction-review.mjs
          git diff --check
          git rm .github/workflows/pr13-visual-review-finalizer.yml
          git config user.name qelly-review-bot
          git config user.email qelly-review-bot@users.noreply.github.com
          git add scripts/logo-brand-visual-correction-review.mjs .github/workflows/logo-brand-visual-correction-review.yml
          git commit -m "fix(review): measure opening animation and verify exact archive"
          git push origin HEAD:feature/logo-first-brand-system
