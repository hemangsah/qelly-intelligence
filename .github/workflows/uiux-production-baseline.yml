name: UIUX Text Floor Attribution
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact current canonical production source
        required: true
        type: string
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .floor-attribution-runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies in cloud
        run: npm ci --ignore-scripts
      - name: Install official cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Measure existing floor work on the exact canonical source
        env:
          QELLY_PRODUCTION_SHA: ${{ inputs.production_sha }}
        run: node .floor-attribution-runner/scripts/qelly-floor-attribution-diagnostic.mjs
      - name: Preserve compact attribution report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-accessibility-floor-attribution-${{ inputs.production_sha }}
          path: preview/floor-attribution/report.json
          if-no-files-found: error
          retention-days: 7
