name: Decision Range Clearance Position Pair
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact baseline source for the isolated comparison
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        expected: [red, green]
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ inputs.production_sha }}
      QELLY_RANGE_EXPECT: ${{ matrix.expected }}
      QELLY_CSS_EXPERIMENT_BASELINE: preview/css-import-baseline
      QELLY_SCREEN_BATCH_SIZE: '10'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .range-clearance-runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies in cloud
        run: npm ci --ignore-scripts
      - name: Install official cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Bind existing visual runner executable path
        run: >-
          test -e /usr/bin/chromium || sudo ln -s "$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" /usr/bin/chromium
      - name: Build exact source in production-mode fixture configuration
        run: |
          test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
          npm run build:frontend
      - name: Exercise the unchanged selected-range assertions with paired clearance positioning
        run: |
          cp .range-clearance-runner/scripts/qelly-decision-range-clearance-$QELLY_RANGE_EXPECT.mjs scripts/qelly-decision-range-clearance-pair-runner.mjs
          set +e
          node scripts/qelly-decision-range-clearance-pair-runner.mjs
          result=$?
          set -e
          if [ "$QELLY_RANGE_EXPECT" = red ]; then
            test "$result" -ne 0
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const p=JSON.parse(await readFile('preview/decision-range-e2e/original-position-desktop.json','utf8'));assert.notEqual(p.clearance,'clear');assert.ok(p.plots.length+p.controls.length>0);console.log({expected:'red',oldPositionStillProtected:true,clearance:p.clearance});
          NODE
          else
            test "$result" -eq 0
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const r=JSON.parse(await readFile('preview/decision-range-e2e/report.json','utf8'));assert.equal(r.status,'passed');assert.equal(r.results.length,2);assert.equal(r.initialLoadingCases,4);for(const name of ['desktop','mobile']){const p=JSON.parse(await readFile('preview/decision-range-e2e/after-leaving-all-protected-content-'+name+'.json','utf8'));assert.equal(p.clearance,'clear');assert.equal(p.plots.length,0);assert.equal(p.controls.length,0);}console.log({expected:'green',allOriginalSelectedRangeAssertionsPassed:true,contexts:2,initialLoadingCases:4});
          NODE
          fi
      - name: Preserve paired source-bound evidence in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-decision-range-clearance-${{ matrix.expected }}-${{ github.sha }}
          path: preview/decision-range-e2e
          if-no-files-found: error
          retention-days: 7
