name: Chat Rich Content Focused Diagnostic
on:
  push:
    branches: [codex/uiux-chat-rich-presentation]
    paths:
      - .github/workflows/chat-rich-content-diagnostic.yml
      - apps/web/public/assets/ai/qelly-chat.mjs
      - apps/web/public/assets/ai/qelly-chat.css
      - tests/qelly-chat-rich-content.test.mjs
      - scripts/qelly-chat-rich-content-e2e.mjs
      - scripts/qelly-chat-rich-content-performance.mjs
permissions:
  contents: read
jobs:
  verify-rich-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ github.sha }}
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies in cloud
        run: npm ci --ignore-scripts
      - name: Verify actual assistant formatter values and hostile input
        run: |
          mkdir -p preview/chat-rich-content
          set -o pipefail
          node --test --test-reporter=tap tests/qelly-chat-rich-content.test.mjs | tee preview/chat-rich-content/unit.tap
      - name: Measure actual formatter CPU and generated markup without model execution
        run: node scripts/qelly-chat-rich-content-performance.mjs
      - name: Install official cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Bind Chromium to existing runner path
        run: >-
          test -e /usr/bin/chromium || sudo ln -s "$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" /usr/bin/chromium
      - name: Build exact frontend in cloud
        run: |
          test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
          npm run build:frontend
      - name: Verify assistant presentation without a Chat request
        run: node scripts/qelly-chat-rich-content-e2e.mjs
      - name: Independently validate baseline and adversarial Chat evidence
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync('preview/chat-rich-focused-e2e/report.json','utf8'));
          assert.equal(r.releaseSha,process.env.QELLY_SCREEN_EVIDENCE_SHA);assert.equal(r.status,'passed');assert.equal(r.results.length,10);assert.equal(r.amplificationResults.length,2);
          for(const x of [...r.results,...r.amplificationResults]){assert.equal(x.status,'passed');assert.equal(x.network.chatPosts,0);assert.equal(x.network.forwardedNonreads,0);assert.equal(x.network.forwardedExternal,0);}
          for(const x of r.amplificationResults){assert.equal(x.amplificationEvidence.elements,1);assert.equal(x.amplificationEvidence.plainFallback,true);assert.equal(x.amplificationEvidence.textCharacters,x.originalLimitCharacters);}
          NODE
      - name: Preserve exact-source results in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-chat-rich-content-${{ github.sha }}
          path: |
            preview/chat-rich-content
            preview/chat-rich-focused-e2e
          retention-days: 7
