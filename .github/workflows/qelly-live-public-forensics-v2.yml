name: Qelly Live Public Forensics V2

on:
  push:
    branches: [forensics/qelly-pages-blank-20260802]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://qelly-intelligence.pages.dev
      PREVIEW_URL: https://a92d8185.qelly-intelligence.pages.dev
      EXPECTED_RELEASE_SHA: 30e803f631e5ae01dc2a8e6227988dd72af5dd5a
      EXPECTED_FALLBACK_SHA: 603cece3091dc59cfb72680914e7056b40058022
      SUPABASE_PROJECT_REF: ssdgfgqnjlwzkgukzeef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Probe production and exact deployment preview
        run: |
          mkdir -p dist/live-forensics-v2
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const {chromium}=require('playwright');
          const targets={production:process.env.PRODUCTION_URL,preview:process.env.PREVIEW_URL};
          const expected=process.env.EXPECTED_RELEASE_SHA;
          const fallback=process.env.EXPECTED_FALLBACK_SHA;
          const projectRef=process.env.SUPABASE_PROJECT_REF;
          const clean=(value)=>String(value??'').replace(/sb_publishable_[A-Za-z0-9_-]+/g,'[REDACTED_PUBLISHABLE_KEY]');
          async function fetchText(base,path){
            try{
              const response=await fetch(`${base.replace(/\/$/,'')}/${path}`,{redirect:'follow',cache:'no-store',signal:AbortSignal.timeout(30000),headers:{'user-agent':'Qelly-Live-Forensics-V2/1.0'}});
              const text=await response.text();
              return {status:response.status,contentType:response.headers.get('content-type'),xRelease:response.headers.get('x-qelly-release'),cacheControl:response.headers.get('cache-control'),url:response.url,bytes:Buffer.byteLength(text),text};
            }catch(error){return {error:clean(error.message||error),text:''};}
          }
          async function probe(name,base,browser){
            const out={name,base,http:{},release:null,config:null,browser:{}};
            for(const [key,path] of Object.entries({index:'',release:'qelly-release.json?live-forensics-v2',config:'qelly-config.js?live-forensics-v2',apiConfig:'api/v1/config?live-forensics-v2',health:'api/v1/health?live-forensics-v2',readiness:'api/v1/readiness?live-forensics-v2',providers:'api/v1/providers/status?live-forensics-v2'})) out.http[key]=await fetchText(base,path);
            try{
              const parsed=JSON.parse(out.http.release.text);
              out.release={releaseSha:parsed.releaseSha,fallbackReleaseSha:parsed.fallbackReleaseSha,releaseMatches:parsed.releaseSha===expected,fallbackMatches:parsed.fallbackReleaseSha===fallback,authentication:parsed.authentication,cloudSync:parsed.cloudSync,liveProviders:parsed.liveProviders,protectedWrites:parsed.protectedWrites,publicSiteUrl:parsed.publicSiteUrl,mode:parsed.mode};
            }catch(error){out.release={parseError:clean(error.message||error),bodyPrefix:clean(out.http.release.text.slice(0,160))};}
            try{
              const sandbox={window:{}};
              vm.runInNewContext(out.http.config.text,sandbox,{timeout:1000});
              const cfg=sandbox.window.__QELLY_CONFIG__||{};
              const key=String(cfg.supabase?.publishableKey||'');
              out.config={releaseSha:cfg.releaseSha,releaseMatches:cfg.releaseSha===expected,deploymentStage:cfg.deploymentStage,publicSiteUrl:cfg.publicSiteUrl,apiBaseUrl:cfg.apiBaseUrl,staticVisualPreview:cfg.staticVisualPreview,dataMode:cfg.dataMode,capabilities:cfg.capabilities,supabaseUrl:cfg.supabase?.url,keyShape:{present:key.length>0,length:key.length,equalsProjectReference:key===projectRef,modernPublishablePrefix:key.startsWith('sb_publishable_'),legacyJwtShape:key.split('.').length===3}};
            }catch(error){out.config={parseError:clean(error.message||error),bodyPrefix:clean(out.http.config.text.slice(0,160))};}
            for(const key of Object.keys(out.http)) delete out.http[key].text;
            const context=await browser.newContext({viewport:{width:1440,height:1000},serviceWorkers:'block'});
            const page=await context.newPage();
            const consoleEvents=[],pageErrors=[],requestFailures=[],failingResponses=[];
            page.on('console',m=>{if(['error','warning'].includes(m.type()))consoleEvents.push({type:m.type(),text:clean(m.text()).slice(0,1000),location:m.location()});});
            page.on('pageerror',e=>pageErrors.push({name:e.name,message:clean(e.message).slice(0,1000),stack:clean(e.stack).slice(0,3000)}));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),resourceType:r.resourceType(),failure:r.failure()}));
            page.on('response',r=>{if(r.status()>=400)failingResponses.push({url:r.url(),status:r.status(),contentType:r.headers()['content-type']||null,resourceType:r.request().resourceType()});});
            try{
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
              out.browser.navigation={status:response?.status()??null,contentType:response?.headers()['content-type']||null};
              await page.waitForTimeout(13000);
              out.browser.dom=await page.evaluate(()=>({title:document.title,appReady:document.documentElement.dataset.appReady||null,themeReady:document.documentElement.dataset.themeReady||null,brandReady:document.documentElement.dataset.brandReady||null,appExists:Boolean(document.querySelector('#app')),mainChildCount:document.querySelector('#main')?.childElementCount??null,mainText:(document.querySelector('#main')?.innerText||'').slice(0,3000),bodyText:(document.body?.innerText||'').slice(0,3000),appVisibility:document.querySelector('.q-app')?getComputedStyle(document.querySelector('.q-app')).visibility:null,background:getComputedStyle(document.body).backgroundColor,configPresent:Boolean(window.__QELLY_CONFIG__),publicBetaStatus:window.__QELLY_PUBLIC_BETA_STATUS__||null,scripts:[...document.scripts].map(s=>({src:s.src,type:s.type,inline:Boolean(!s.src&&s.textContent.trim())}))}));
            }catch(error){out.browser.navigationError=clean(error.message||error);}
            out.browser.console=consoleEvents;
            out.browser.pageErrors=pageErrors;
            out.browser.requestFailures=requestFailures;
            out.browser.failingResponses=failingResponses;
            await page.screenshot({path:`dist/live-forensics-v2/${name}.png`,fullPage:true}).catch(()=>{});
            await context.close();
            return out;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const result={observedAt:new Date().toISOString(),expectedReleaseSha:expected,expectedFallbackSha:fallback,targets:{}};
            for(const [name,url] of Object.entries(targets)) result.targets[name]=await probe(name,url,browser);
            await browser.close();
            fs.writeFileSync('dist/live-forensics-v2/result.json',JSON.stringify(result,null,2));
          })().catch(error=>{fs.writeFileSync('dist/live-forensics-v2/runner-error.txt',clean(error.stack||error));process.exitCode=1;});
          NODE
      - name: Post redacted verdict to PR 25
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const result=JSON.parse(fs.readFileSync('dist/live-forensics-v2/result.json','utf8'));
            const clean=(value)=>String(value??'').replace(/`/g,"'").replace(/sb_publishable_[A-Za-z0-9_-]+/g,'[REDACTED_PUBLISHABLE_KEY]');
            const lines=['## Live Cloudflare Pages forensic verdict V2','',`Observed: \`${clean(result.observedAt)}\``,`Expected release: \`${clean(result.expectedReleaseSha)}\``,''];
            for(const [name,target] of Object.entries(result.targets||{})){
              lines.push(`### ${name}: ${clean(target.base)}`);
              for(const key of ['index','release','config','apiConfig','health','readiness','providers']){
                const item=target.http?.[key]||{};
                lines.push(`- ${key}: \`${clean(item.status??item.error)}\`; content type \`${clean(item.contentType)}\`; X-Qelly-Release \`${clean(item.xRelease)}\``);
              }
              lines.push(`- release exact: \`${Boolean(target.release?.releaseMatches)}\`; fallback exact: \`${Boolean(target.release?.fallbackMatches)}\``);
              lines.push(`- flags: auth=\`${clean(target.release?.authentication)}\`, sync=\`${clean(target.release?.cloudSync)}\`, providers=\`${clean(target.release?.liveProviders)}\`, writes=\`${clean(target.release?.protectedWrites)}\``);
              const key=target.config?.keyShape||{};
              lines.push(`- config exact: \`${Boolean(target.config?.releaseMatches)}\`; site=\`${clean(target.config?.publicSiteUrl)}\`; static preview=\`${clean(target.config?.staticVisualPreview)}\``);
              lines.push(`- key shape: present=\`${Boolean(key.present)}\`, length=\`${clean(key.length)}\`, equals project ref=\`${Boolean(key.equalsProjectReference)}\`, modern prefix=\`${Boolean(key.modernPublishablePrefix)}\`, legacy JWT=\`${Boolean(key.legacyJwtShape)}\``);
              const dom=target.browser?.dom||{};
              lines.push(`- Chromium: status=\`${clean(target.browser?.navigation?.status??target.browser?.navigationError)}\`, appReady=\`${clean(dom.appReady)}\`, themeReady=\`${clean(dom.themeReady)}\`, brandReady=\`${clean(dom.brandReady)}\`, visibility=\`${clean(dom.appVisibility)}\`, main children=\`${clean(dom.mainChildCount)}\``);
              lines.push(`- main text: ${clean(dom.mainText).slice(0,900)||'[empty]'}`);
              lines.push(`- page errors=\`${(target.browser?.pageErrors||[]).length}\`, request failures=\`${(target.browser?.requestFailures||[]).length}\`, failing responses=\`${(target.browser?.failingResponses||[]).length}\`, console warnings/errors=\`${(target.browser?.console||[]).length}\``);
              for(const entry of (target.browser?.pageErrors||[]).slice(0,5)) lines.push(`  - page error: \`${clean(entry.message).slice(0,700)}\``);
              for(const entry of (target.browser?.requestFailures||[]).slice(0,8)) lines.push(`  - request failure: \`${clean(entry.url)}\` — \`${clean(entry.failure?.errorText||entry.failure)}\``);
              for(const entry of (target.browser?.failingResponses||[]).slice(0,8)) lines.push(`  - response: \`${clean(entry.status)} ${clean(entry.url)}\` — \`${clean(entry.contentType)}\``);
              for(const entry of (target.browser?.console||[]).slice(0,8)) lines.push(`  - console ${clean(entry.type)}: \`${clean(entry.text).slice(0,700)}\``);
              lines.push('');
            }
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/25/comments`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({body:lines.join('\n')})});
            if(!response.ok)throw new Error(`comment_failed_${response.status}_${await response.text()}`);
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qelly-live-public-forensics-v2-${{ github.sha }}
          path: dist/live-forensics-v2
          if-no-files-found: error
          retention-days: 7
