name: Qelly Prompt 2B Harness Mobile Selector Fix

on:
  push:
    branches:
      - feature/calculator-and-indicator-foundation
    paths:
      - .github/workflows/prompt2b-harness-mobile-selector-fix.yml

permissions:
  contents: write

concurrency:
  group: qelly-prompt2b-harness-mobile-selector-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Guard and patch proven mobile selector defect
        env:
          EXPECTED_PARENT: 099d6d731cbe383bf2eaa9202c7dd3bb455fdb1d
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/prompt2b-final-review.mjs')
          source=path.read_text()
          old="""  await page.locator('#global-theme-selector').selectOption(theme.persona);\n  await page.waitForFunction(({persona,motionMode})=>{\n    const root=document.documentElement;\n    return root.dataset.theme===persona&&root.dataset.persona===persona&&\n      (motionMode==='reduced'?root.dataset.motion==='reduced':true);\n  },{persona:theme.persona,motionMode:motion},{timeout:10000});"""
          new="""  await page.evaluate((persona)=>{\n    const selector=document.querySelector('#global-theme-selector');\n    if(!selector)throw new Error('Governed persona selector is unavailable');\n    selector.value=persona;\n    selector.dispatchEvent(new Event('change',{bubbles:true}));\n  },theme.persona);\n  await page.waitForFunction((persona)=>{\n    const root=document.documentElement;\n    return root.dataset.theme===persona&&root.dataset.persona===persona;\n  },theme.persona,{timeout:10000});"""
          if old not in source: raise SystemExit('Expected harness selector block not found')
          path.write_text(source.replace(old,new,1))
          PY
          node --check scripts/prompt2b-final-review.mjs
      - name: Commit corrected harness and remove temporary workflow
        env:
          BRANCH: feature/calculator-and-indicator-foundation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/prompt2b-harness-mobile-selector-fix.yml
          git config user.name "Hemang Sah"
          git config user.email "274469799+hemangsah@users.noreply.github.com"
          git add scripts/prompt2b-final-review.mjs .github/workflows/prompt2b-harness-mobile-selector-fix.yml
          git commit -m "fix(prompt2b): apply governed personas in hidden mobile chrome"
          git push origin "HEAD:$BRANCH"
