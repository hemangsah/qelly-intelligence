name: Verify Style Readiness Focused Diagnostic
on:
  push:
    branches: [codex/uiux-verify-style-ready-nov02]
    paths:
      - .github/workflows/verify-style-ready-diagnostic.yml
      - apps/web/public/assets/ai/qelly-chat.mjs
      - apps/web/public/assets/ai/qelly-chat.css
      - apps/web/public/assets/qelly-verify-evidence.css
      - tests/qelly-chat-rich-content.test.mjs
      - scripts/qelly-verify-style-ready-e2e.mjs
      - scripts/qelly-chat-rich-content-performance.mjs
permissions:
  contents: read
jobs:
  verify-rich-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ github.sha }}
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies in cloud
        run: npm ci --ignore-scripts
      - name: Install official cloud Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Bind Chromium to existing runner path
        run: >-
          test -e /usr/bin/chromium || sudo ln -s "$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" /usr/bin/chromium
      - name: Build exact frontend in cloud
        run: |
          test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
          npm run build:frontend
      - name: Verify delayed, failed, cached and superseded Verify styles
        run: node scripts/qelly-verify-style-ready-e2e.mjs
      - name: Independently validate all Verification context and image evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          function validateVerifyStyleReadyReport(r,sha){
           assert.equal(r.sourceSha,sha);assert.equal(r.status,'passed');assert.equal(r.expectedCases,24);assert.equal(r.cases,24);assert.equal(r.results.length,24);assert.deepEqual(r.views,['analysis','methodology']);for(const k of ['productNumericalBehaviorChanged','newProvidersEnabled','modelExecutionRequestedByTest','realAuthenticationTested','productionAccepted'])assert.equal(r[k],false);
           const expected=['dark','light'].flatMap(a=>[1280,390].flatMap(w=>['analysis','methodology'].flatMap(v=>['delay','failure','abort'].map(m=>[a,w,v,m].join('/')))));assert.deepEqual(r.results.map(x=>[x.appearance,x.width,x.view,x.mode].join('/')).sort(),expected.sort());
           for(const x of r.results){assert.equal(x.actualAppearance,x.appearance);assert.equal(x.presenterWithheld,true);assert.equal(x.overflow,false);assert.equal(x.forwardedNonreads,0);assert.ok(x.stylesheetRequests>=1);if(x.mode==='abort'){assert.equal(x.aboutRetained,true);assert.equal(x.ordinarySurfaces.length,0);}else{assert.ok(x.ordinarySurfaces.length>0);for(const s of x.ordinarySurfaces){assert.deepEqual(s.borders,['0px','0px','0px','0px']);assert.equal(s.shadow,'none');}if(x.mode==='delay')assert.equal(x.warmSingleStyle,true);else{assert.ok(x.retryFocus.outline>=2);assert.ok(x.retryFocus.height>=44);}}}
           const method=r.results.filter(x=>x.view==='methodology'&&x.mode!=='abort');assert.equal(method.length,8);for(const x of method){assert.ok(Array.isArray(x.statusReadability)&&x.statusReadability.length>0);assert.ok(Array.isArray(x.ordinalReadability));assert.equal(x.ordinalReadability.length,5);for(const s of [...x.statusReadability,...x.ordinalReadability]){assert.ok(s.font>=12);assert.ok(s.contrast>=4.5);}}
           const samples=method.flatMap(x=>x.statusReadability),ordinals=method.flatMap(x=>x.ordinalReadability);assert.equal(samples.length,144);assert.equal(ordinals.length,40);return{valid:true,sourceSha:sha,contexts:24,delayed:8,unavailable:8,cancelled:8,warmSingleStyle:8,statusContrastSamples:samples.length,ordinalContrastSamples:ordinals.length,totalContrastSamples:samples.length+ordinals.length,minimumStatusContrast:Math.min(...samples.map(x=>x.contrast)),minimumOrdinalContrast:Math.min(...ordinals.map(x=>x.contrast)),forwardedNonreads:0};
          }
          const root=process.env.QELLY_VERIFY_REPORT_ROOT||'preview/verify-first-paint',sha=process.env.QELLY_SCREEN_EVIDENCE_SHA,bytes=await readFile(root+'/report.json'),r=JSON.parse(bytes),validation=validateVerifyStyleReadyReport(r,sha),digest=b=>createHash('sha256').update(b).digest('hex');
          const names=r.results.map(x=>[x.view,x.mode,x.appearance,x.width].join('-')+'.png');assert.equal(new Set(names).size,24);assert.deepEqual((await readdir(root)).filter(x=>x.endsWith('.png')).sort(),[...names].sort());const images=[];for(const file of [...names].sort()){const png=await readFile(root+'/'+file);assert.ok(png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));const width=png.readUInt32BE(16),height=png.readUInt32BE(20);assert.ok([1280,390].includes(width));assert.equal(width,Number(file.slice(0,-4).split('-').at(-1)));assert.ok(height>=500&&height<30000);images.push({file,sha256:digest(png),width,height});}
          const receipt={...validation,reportSha256:digest(bytes),screenshots:images};
          await writeFile(root+'/independent-gate-receipt.json',JSON.stringify(receipt)+'\n');console.log(JSON.stringify(receipt));
          NODE
      - name: Preserve Verify style readiness evidence in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-verify-first-paint-${{ github.sha }}
          path: preview/verify-first-paint
          if-no-files-found: error
          retention-days: 7

      - name: Download diagnostic Verification evidence on hosted runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-verify-first-paint-${{ github.sha }}
          path: ${{ runner.temp }}/qelly-verify-style-focused
          digest-mismatch: error
      - name: Verify the published diagnostic report and all image checksums
        env:
          QELLY_VERIFY_REPORT_ROOT: ${{ runner.temp }}/qelly-verify-style-focused
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          function validateVerifyStyleReadyReport(r,sha){
           assert.equal(r.sourceSha,sha);assert.equal(r.status,'passed');assert.equal(r.expectedCases,24);assert.equal(r.cases,24);assert.equal(r.results.length,24);assert.deepEqual(r.views,['analysis','methodology']);for(const k of ['productNumericalBehaviorChanged','newProvidersEnabled','modelExecutionRequestedByTest','realAuthenticationTested','productionAccepted'])assert.equal(r[k],false);
           const expected=['dark','light'].flatMap(a=>[1280,390].flatMap(w=>['analysis','methodology'].flatMap(v=>['delay','failure','abort'].map(m=>[a,w,v,m].join('/')))));assert.deepEqual(r.results.map(x=>[x.appearance,x.width,x.view,x.mode].join('/')).sort(),expected.sort());
           for(const x of r.results){assert.equal(x.actualAppearance,x.appearance);assert.equal(x.presenterWithheld,true);assert.equal(x.overflow,false);assert.equal(x.forwardedNonreads,0);assert.ok(x.stylesheetRequests>=1);if(x.mode==='abort'){assert.equal(x.aboutRetained,true);assert.equal(x.ordinarySurfaces.length,0);}else{assert.ok(x.ordinarySurfaces.length>0);for(const s of x.ordinarySurfaces){assert.deepEqual(s.borders,['0px','0px','0px','0px']);assert.equal(s.shadow,'none');}if(x.mode==='delay')assert.equal(x.warmSingleStyle,true);else{assert.ok(x.retryFocus.outline>=2);assert.ok(x.retryFocus.height>=44);}}}
           const method=r.results.filter(x=>x.view==='methodology'&&x.mode!=='abort');assert.equal(method.length,8);for(const x of method){assert.ok(Array.isArray(x.statusReadability)&&x.statusReadability.length>0);assert.ok(Array.isArray(x.ordinalReadability));assert.equal(x.ordinalReadability.length,5);for(const s of [...x.statusReadability,...x.ordinalReadability]){assert.ok(s.font>=12);assert.ok(s.contrast>=4.5);}}
           const samples=method.flatMap(x=>x.statusReadability),ordinals=method.flatMap(x=>x.ordinalReadability);assert.equal(samples.length,144);assert.equal(ordinals.length,40);return{valid:true,sourceSha:sha,contexts:24,delayed:8,unavailable:8,cancelled:8,warmSingleStyle:8,statusContrastSamples:samples.length,ordinalContrastSamples:ordinals.length,totalContrastSamples:samples.length+ordinals.length,minimumStatusContrast:Math.min(...samples.map(x=>x.contrast)),minimumOrdinalContrast:Math.min(...ordinals.map(x=>x.contrast)),forwardedNonreads:0};
          }
          const root=process.env.QELLY_VERIFY_REPORT_ROOT||'preview/verify-first-paint',sha=process.env.QELLY_SCREEN_EVIDENCE_SHA,bytes=await readFile(root+'/report.json'),r=JSON.parse(bytes),validation=validateVerifyStyleReadyReport(r,sha),digest=b=>createHash('sha256').update(b).digest('hex');
          const names=r.results.map(x=>[x.view,x.mode,x.appearance,x.width].join('-')+'.png');assert.equal(new Set(names).size,24);assert.deepEqual((await readdir(root)).filter(x=>x.endsWith('.png')).sort(),[...names].sort());const images=[];for(const file of [...names].sort()){const png=await readFile(root+'/'+file);assert.ok(png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));const width=png.readUInt32BE(16),height=png.readUInt32BE(20);assert.ok([1280,390].includes(width));assert.equal(width,Number(file.slice(0,-4).split('-').at(-1)));assert.ok(height>=500&&height<30000);images.push({file,sha256:digest(png),width,height});}
          const receipt={...validation,reportSha256:digest(bytes),screenshots:images};
          assert.deepEqual(JSON.parse(await readFile(root+'/independent-gate-receipt.json','utf8')),receipt);
          await writeFile(process.env.RUNNER_TEMP+'/qelly-verify-style-independent-receipt.json',JSON.stringify(receipt)+'\n');console.log(JSON.stringify(receipt));
          NODE
      - name: Retain compact independent Verification diagnostic receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-verify-first-paint-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/qelly-verify-style-independent-receipt.json
          if-no-files-found: error
          retention-days: 7
