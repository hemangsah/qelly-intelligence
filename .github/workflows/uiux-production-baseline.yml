name: Nov11 Closed Details Native Safety
on:
  push:
    branches: [codex/uiux-nov11-closed-details-native-safety]
    paths: [.github/workflows/uiux-production-baseline.yml]
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact production172 source; native safety diagnostic only
        required: true
        type: string
        default: 172eb87d5cd229a11eb751578fb26dfbe344b0db
permissions:
  contents: read
  actions: read
jobs:
  native-data:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ inputs.production_sha }}
    steps:
      - name: Require exact diagnostic source
        run: test "$QELLY_SCREEN_EVIDENCE_SHA" = 172eb87d5cd229a11eb751578fb26dfbe344b0db
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .closed-details-runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies only in cloud
        run: npm ci --ignore-scripts
      - name: Install official Chromium only in cloud
        run: npx --no-install playwright install --with-deps chromium
      - name: Bind diagnostic Chromium path
        run: >-
          test -e /usr/bin/chromium || sudo ln -s "$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" /usr/bin/chromium
      - name: Copy only guarded diagnostic helpers
        run: |
          test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
          for name in source-fragments browser-probe frame-capture native-runner fixture-cases; do
            cp ".closed-details-runner/work/nov11-closed-details-$name.mjs" scripts/
          done
          cp .closed-details-runner/work/nov11-closed-details-source-contract.json scripts/
      - name: Collect two-row fail-fast prefix before any native expansion or frontend build
        run: node scripts/nov11-closed-details-native-runner.mjs
      - name: Retain native observations and compositor frames only in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-nov11-closed-details-native-data-${{ inputs.production_sha }}
          path: preview/nov11-closed-details-native
          if-no-files-found: error
          retention-days: 7
  independent-native-policy:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [native-data]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUNNER_SHA: ${{ github.sha }}
      QELLY_SCREEN_EVIDENCE_SHA: ${{ inputs.production_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Download producer evidence only inside cloud validator
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "qelly-nov11-closed-details-native-data-$QELLY_SCREEN_EVIDENCE_SHA" --dir .closed-details-evidence
      - name: Prove independent acceptance rejects forged or partial positive evidence
        if: always()
        run: node work/nov11-closed-details-validator-controls.mjs
      - name: Decode every retained frame and independently reject unsafe opening
        if: always()
        run: node work/nov11-closed-details-publisher.mjs .closed-details-evidence preview/nov11-closed-details-publication
      - name: Publish compact native safety decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-nov11-closed-details-native-receipt-${{ inputs.production_sha }}
          path: |
            preview/nov11-closed-details-publication/receipt.json
            outputs/QELLY_NOV11_CLOSED_DETAILS_VALIDATOR_CONTROLS.json
          if-no-files-found: error
          retention-days: 7
