name: Qelly Logo Brand Source Bootstrap

on:
  push:
    branches: [feature/logo-first-brand-system]
    paths:
      - '.qelly-brand-bootstrap/**'
      - '.github/workflows/logo-brand-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qelly-logo-brand-source-bootstrap
  cancel-in-progress: true

jobs:
  install-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact logo branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/logo-first-brand-system
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install, verify, commit and push coherent logo source
        shell: bash
        env:
          FOUNDATION_SHA: 239f6f0c7c663801662f4e5f940ca76fb6941bf1
          EXPECTED_BUNDLE_SHA256: 840d9910e193daa3d001436c0c44b556b010742d5e779fd072f6db7bce313558
        run: |
          set -Eeuo pipefail
          failure_handler() {
            code=$?
            line=${BASH_LINENO[0]:-unknown}
            command=${BASH_COMMAND:-unknown}
            set +e
            git reset --hard HEAD
            git clean -fdx
            mkdir -p design/brand
            python - "$code" "$line" "$command" <<'PY'
          import json,sys,datetime
          code,line,command=sys.argv[1:]
          record={
            'result':'failed',
            'branch':'feature/logo-first-brand-system',
            'headBeforeRun':'${{ github.sha }}',
            'exitCode':int(code),
            'failingLine':line,
            'failingCommand':command,
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'partialProductSourceCommitted':False,
            'nextAction':'diagnose this exact command only'
          }
          open('design/brand/QELLY_BOOTSTRAP_STATUS.json','w').write(json.dumps(record,indent=2)+'\n')
          PY
            git config user.name 'Qelly Brand Automation'
            git config user.email 'hemangsah@users.noreply.github.com'
            git add design/brand/QELLY_BOOTSTRAP_STATUS.json
            git commit -m 'chore(brand): retain exact source installer failure' || true
            git push origin HEAD:feature/logo-first-brand-system || true
            exit "$code"
          }
          trap failure_handler ERR

          test "$(git rev-parse --abbrev-ref HEAD)" = 'feature/logo-first-brand-system'
          test "$(git merge-base HEAD "$FOUNDATION_SHA")" = "$FOUNDATION_SHA"
          compgen -G '.qelly-brand-bootstrap/chunk-*' >/dev/null

          archive=/tmp/qelly-brand-bundle.tar.gz
          extract=/tmp/qelly-brand-bundle
          cat .qelly-brand-bootstrap/chunk-* | tr -d '\r\n' | base64 --decode > "$archive"
          actual_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual_sha" = "$EXPECTED_BUNDLE_SHA256"
          gzip -t "$archive"
          rm -rf "$extract"
          mkdir -p "$extract"

          python - "$archive" "$extract" <<'PY'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1])
          destination=pathlib.Path(sys.argv[2]).resolve()
          with tarfile.open(archive,'r:gz') as tar:
              members=tar.getmembers()
              for member in members:
                  pure=pathlib.PurePosixPath(member.name)
                  parts=pure.parts
                  if pure.is_absolute() or '..' in parts or '.git' in parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f'unsafe archive member type: {member.name}')
                  resolved=(destination/member.name).resolve()
                  if resolved != destination and destination not in resolved.parents:
                      raise SystemExit(f'archive path escapes destination: {member.name}')
              tar.extractall(destination,filter='data')
          PY

          required=(
            apps/web/public/assets/qelly-brand.mjs
            scripts/generate-logo-assets.mjs
            scripts/logo-brand-governance.mjs
            scripts/logo-brand-review.mjs
            tests/logo-brand-system.test.mjs
            figma-brand-foundations/code.js
          )
          for path in "${required[@]}"; do test -f "$extract/$path"; done

          cp -a "$extract"/. .
          rm -rf .qelly-brand-bootstrap
          rm -f .github/workflows/logo-brand-bootstrap.yml
          rm -f design/brand/QELLY_BOOTSTRAP_STATUS.json

          npm ci --ignore-scripts
          npm run generate:brand-assets

          python - <<'PY'
          import hashlib,json,os,pathlib,struct,subprocess
          root=pathlib.Path('.').resolve()
          foundation=os.environ['FOUNDATION_SHA']
          excluded={
            'design/brand/QELLY_LOGO_SOURCE_MANIFEST.json',
            'design/brand/QELLY_LOGO_IMPLEMENTATION_STATUS.md'
          }
          status=subprocess.check_output(['git','status','--porcelain=v1','-z']).decode('utf-8')
          changed=set()
          for item in status.split('\0'):
              if not item: continue
              path=item[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              if path in excluded or path.startswith('.qelly-brand-bootstrap/'): continue
              absolute=root/path
              if absolute.is_file(): changed.add(path)

          def purpose(path):
              mappings=(
                ('apps/web/public/assets/brand/','official production logo asset'),
                ('apps/web/public/assets/qelly-brand','runtime brand integration'),
                ('apps/web/public/assets/routes/','logo-first product experience'),
                ('apps/web/public/','web shell, icon or manifest integration'),
                ('design/brand/','brand governance and handoff'),
                ('figma-brand-foundations/','editable Figma brand foundations'),
                ('scripts/','brand generation, validation or review automation'),
                ('tests/','brand governance regression coverage'),
                ('.github/workflows/','brand validation and visual review workflow'),
                ('package','locked repository command integration')
              )
              for prefix,label in mappings:
                  if path.startswith(prefix): return label
              return 'logo-first integration source'

          def png_dimensions(data):
              if data[:8]==b'\x89PNG\r\n\x1a\n' and len(data)>=24:
                  return [struct.unpack('>I',data[16:20])[0],struct.unpack('>I',data[20:24])[0]]
              return None

          def ico_dimensions(data):
              if len(data)<6 or data[:4]!=b'\x00\x00\x01\x00': return None
              count=struct.unpack('<H',data[4:6])[0]
              dims=[]; offset=6
              for _ in range(count):
                  if offset+16>len(data): break
                  dims.append([data[offset] or 256,data[offset+1] or 256])
                  offset+=16
              return dims

          files=[]
          for path in sorted(changed):
              data=(root/path).read_bytes()
              try: data.decode('utf-8'); kind='text'
              except UnicodeDecodeError: kind='binary'
              exists_before=subprocess.run(
                ['git','cat-file','-e',f'{foundation}:{path}'],
                stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL
              ).returncode==0
              entry={
                'path':path,
                'purpose':purpose(path),
                'kind':kind,
                'bytes':len(data),
                'sha256':hashlib.sha256(data).hexdigest(),
                'gitBlobSha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),
                'change':'updated' if exists_before else 'created',
                'validationResult':'verified-worktree-and-git-blob',
                'sourceProvenance':'prepared logo-first bundle reconstructed from the user-selected authoritative Qelly logo',
                'authoritativeSelectedLogoRelationship':'preserves the approved burgundy Q ring and tail, trajectory curve, red and green nodes, and QELLY wordmark'
              }
              dimensions=png_dimensions(data)
              icon_dimensions=ico_dimensions(data)
              if dimensions: entry['dimensions']=dimensions
              if icon_dimensions: entry['iconDimensions']=icon_dimensions
              files.append(entry)

          manifest={
            'schemaVersion':1,
            'repository':'hemangsah/qelly-intelligence',
            'branch':'feature/logo-first-brand-system',
            'foundationCommit':foundation,
            'foundationTag':'qelly-design-foundation-v1',
            'preparedBundleSha256':os.environ['EXPECTED_BUNDLE_SHA256'],
            'selectedLogo':'user-supplied authoritative Qelly mark',
            'ibmPlexLock':True,
            'manifestSelfExcludedFromRecursiveHash':True,
            'fileCount':len(files),
            'files':files
          }
          output=root/'design/brand/QELLY_LOGO_SOURCE_MANIFEST.json'
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          status_file=root/'design/brand/QELLY_LOGO_IMPLEMENTATION_STATUS.md'
          status_file.write_text(
            '# Qelly Logo Implementation Status\n\n'
            '## Durable installation\n\n'
            f'- Prepared bundle SHA-256: `{os.environ["EXPECTED_BUNDLE_SHA256"]}`\n'
            f'- Verified installed source files: `{len(files)}`\n'
            '- Missing intended files: `0` at installation stage\n'
            '- Failed files: `0`\n'
            '- Transport resolution: bounded Base64 chunks decoded to the recorded archive hash and passed strict tar-member validation\n'
            '- Every installed file records byte size, SHA-256 and Git blob SHA in `QELLY_LOGO_SOURCE_MANIFEST.json`\n'
            '- Next action: complete repository, browser, workflow and review-artifact validation\n',
            encoding='utf-8'
          )
          print(json.dumps({'installedFiles':len(files)},indent=2))
          PY

          node --check apps/web/public/assets/qelly-brand.mjs
          node --check apps/web/public/assets/routes/feature-universe.mjs
          node --check scripts/generate-logo-assets.mjs
          node --check scripts/logo-brand-governance.mjs
          node --check scripts/logo-brand-review.mjs
          node --check tests/logo-brand-system.test.mjs
          node --check figma-brand-foundations/code.js
          node --test tests/logo-brand-system.test.mjs
          npm run validate:brand
          npm run security:scan
          git diff --check

          QELLY_STATIC_VISUAL_PREVIEW=true \
          QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ \
          QELLY_DEPLOYMENT_ENVIRONMENT=logo-brand-bootstrap \
          npm run build:frontend
          npm run validate:pages-preview
          npm run smoke:pages-preview

          git add -A
          git diff --cached --check
          git config user.name 'Qelly Brand Automation'
          git config user.email 'hemangsah@users.noreply.github.com'
          git commit -m 'feat(brand): add official Qelly logo-first system'
          source_commit="$(git rev-parse HEAD)"

          python - "$source_commit" <<'PY'
          import hashlib,json,subprocess,sys
          commit=sys.argv[1]
          manifest=json.load(open('design/brand/QELLY_LOGO_SOURCE_MANIFEST.json',encoding='utf-8'))
          failures=[]
          for item in manifest['files']:
              data=subprocess.check_output(['git','show',f'{commit}:{item["path"]}'])
              sha256=hashlib.sha256(data).hexdigest()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if len(data)!=item['bytes'] or sha256!=item['sha256'] or blob!=item['gitBlobSha']:
                  failures.append({'path':item['path'],'bytes':len(data),'sha256':sha256,'gitBlobSha':blob})
          if failures:
              raise SystemExit(json.dumps({'verificationFailures':failures},indent=2))
          print(json.dumps({'commit':commit,'verifiedFiles':len(manifest['files'])},indent=2))
          PY

          trap - ERR
          git push origin HEAD:feature/logo-first-brand-system
