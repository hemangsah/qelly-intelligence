name: One-time Qelly SMTP canary

on:
  push:
    branches:
      - release/qelly-global-public-beta
    paths:
      - .github/workflows/one-time-smtp-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_URL: https://qelly-intelligence.pages.dev
      EXPECTED_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
    steps:
      - name: Resolve deployed public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "${PUBLIC_URL}/qelly-config.js?canary=${GITHUB_SHA}" \
            -o qelly-config.js
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const source = fs.readFileSync('qelly-config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox, { timeout: 1000 });
          const config = sandbox.window.__QELLY_CONFIG__ || {};
          const url = String(config.supabase?.url || '').replace(/\/$/, '');
          const key = String(config.supabase?.publishableKey || '');
          if (url !== process.env.EXPECTED_SUPABASE_URL) throw new Error(`unexpected_supabase_url_${url}`);
          const modern = /^sb_publishable_[A-Za-z0-9_-]{20,}$/.test(key);
          const legacy = key.split('.').length === 3 && key.length >= 100;
          if (!(modern || legacy)) throw new Error('invalid_publishable_key_shape');
          fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_URL=${url}\nSUPABASE_PUBLISHABLE_KEY=${key}\n`);
          NODE

      - name: Submit exactly one direct Supabase Auth signup
        shell: bash
        run: |
          set -euo pipefail
          CANARY_EMAIL="hemangsah.dn+qelly-smtp-canary-${GITHUB_RUN_ID}@gmail.com"
          CANARY_PASSWORD="QellyCanary!${GITHUB_RUN_ID}Aa9"
          export CANARY_EMAIL CANARY_PASSWORD
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('request.json', JSON.stringify({
            email: process.env.CANARY_EMAIL,
            password: process.env.CANARY_PASSWORD,
            data: { purpose: 'qelly-smtp-canary', github_run_id: process.env.GITHUB_RUN_ID }
          }));
          NODE
          status="$(curl --silent --show-error --max-time 60 \
            -o raw-response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/auth/v1/signup" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @request.json)"
          rm -f request.json
          export status
          node <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.env.status);
          let payload = {};
          try { payload = JSON.parse(fs.readFileSync('raw-response.json', 'utf8')); } catch {}
          const evidence = {
            checkedAt: new Date().toISOString(),
            httpStatus: status,
            canaryEmail: process.env.CANARY_EMAIL,
            accepted: status >= 200 && status < 300 && Boolean(payload.user?.id),
            userId: payload.user?.id || null,
            email: payload.user?.email || null,
            sessionIssued: Boolean(payload.access_token || payload.session),
            errorCode: payload.error_code || payload.code || null,
            errorMessage: payload.msg || payload.message || payload.error_description || payload.error || null
          };
          fs.writeFileSync('canary-evidence.json', JSON.stringify(evidence, null, 2));
          if (!evidence.accepted) {
            console.error(JSON.stringify({ httpStatus: evidence.httpStatus, errorCode: evidence.errorCode, errorMessage: evidence.errorMessage }));
            process.exit(1);
          }
          console.log(JSON.stringify({ httpStatus: evidence.httpStatus, accepted: true, userId: evidence.userId, sessionIssued: evidence.sessionIssued }));
          NODE
          rm -f raw-response.json

      - name: Upload redacted canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qelly-smtp-canary-${{ github.run_id }}
          path: canary-evidence.json
          if-no-files-found: warn
          retention-days: 3
