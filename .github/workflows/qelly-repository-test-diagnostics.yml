name: Qelly Repository Test Diagnostics

on:
  pull_request:
    branches:
      - release/qelly-global-public-beta
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qelly-repository-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-tests:
    name: Repository tests with diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Capture complete repository test output
        shell: bash
        run: |
          set +e
          mkdir -p dist/test-diagnostics
          npm test > dist/test-diagnostics/repository-tests.log 2>&1
          code=$?
          printf '%s\n' "$code" > dist/test-diagnostics/exit-code.txt
          printf 'repository test exit code: %s\n' "$code"
          exit 0
      - name: Upload repository test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-repository-test-diagnostics-${{ github.sha }}
          path: dist/test-diagnostics
          if-no-files-found: error
          retention-days: 14
      - name: Enforce repository test result
        shell: bash
        run: |
          code="$(cat dist/test-diagnostics/exit-code.txt)"
          if [ "$code" -ne 0 ]; then
            echo "Repository test suite failed with exit code $code. See uploaded diagnostics artifact."
            exit "$code"
          fi
