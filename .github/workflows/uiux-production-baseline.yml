name: Account Typography and Hover Cascade Diagnostic
on:
  workflow_dispatch:
    inputs:
      production_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QELLY_SCREEN_EVIDENCE_SHA: 1e8fabe7274a83c69b9c0d8f3306d0570f13f300
      QELLY_DEX_SOURCE_COMPARISON_EXPECT: 'candidate'
      QELLY_DEX_CONTROL_MATRIX: 'true'
      QELLY_DEX_TYPE_EXPECT: 'green'
      QELLY_DEX_LIVE: 'false'
      QELLY_CSS_EXPERIMENT_BASELINE: preview/css-import-baseline
      QELLY_SCREEN_BATCH_SIZE: '10'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .account-runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Guard current product source
        run: |
          test '${{ inputs.production_sha }}' = '1e8fabe7274a83c69b9c0d8f3306d0570f13f300'
          test "$(git rev-parse HEAD)" = '1e8fabe7274a83c69b9c0d8f3306d0570f13f300'
      - name: Install locked dependencies only in cloud
        run: npm ci --ignore-scripts
      - name: Install pinned official browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.65.0
          timeout 5m python -m playwright install chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version | grep -E '(^| )158\.'
      - name: Build unchanged current production product
        run: npm run build:frontend
      - name: Measure existing synthetic account states and exact matched CSS
        run: |
          cp .account-runner/scripts/qelly-account-cascade-diagnostic.mjs scripts/qelly-account-cascade-diagnostic.mjs
          node scripts/qelly-account-cascade-diagnostic.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qelly-account-editorial-cascade-diagnostic-${{ github.sha }}
          path: preview/account-editorial-e2e
          if-no-files-found: error
          retention-days: 7
