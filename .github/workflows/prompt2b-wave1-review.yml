name: Qelly Prompt 2B Wave 1 Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: qelly-prompt2b-wave1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wave1-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      QELLY_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Wave 1 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies and browser engines
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python3 -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            playwright==1.61.0 \
            pyee==13.0.1 \
            greenlet==3.5.3 \
            typing-extensions==4.16.0
          python3 -m pip check
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify installed source manifest
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const manifest=JSON.parse(await readFile('project-state/QELLY_PROMPT2B_SOURCE_MANIFEST.json','utf8'));
          const failures=[];
          for(const file of manifest.files){
            const size=(await stat(file.path)).size;
            const blob=execFileSync('git',['hash-object',file.path],{encoding:'utf8'}).trim();
            if(size!==file.bytes||blob!==file.gitBlobSha)failures.push({path:file.path,expectedBytes:file.bytes,actualBytes:size,expectedBlob:file.gitBlobSha,actualBlob:blob});
          }
          if(manifest.files.length!==manifest.fileCount)failures.push({manifestCount:manifest.files.length,declared:manifest.fileCount});
          console.log(JSON.stringify({verified:manifest.files.length-failures.length,failures},null,2));
          if(failures.length)process.exit(1);
          NODE

      - name: Run repository, formula, security and release gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QELLY_REVIEW_HEAD"
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run validate:brand
          npm run security:scan
          npm test
          node --test tests/calculation-engine.test.mjs tests/calculation-security.test.mjs tests/indicator-engine.test.mjs tests/saved-calculation-store.test.mjs
          npm run build
          QELLY_STATIC_VISUAL_PREVIEW=true QELLY_PUBLIC_BASE_PATH=/qelly-intelligence/ npm run build:frontend
          npm run validate:pages-preview
          npm run smoke:pages-preview
          npm run validate:product
          npm run inventory:product
          npm run smoke
          NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
          npm run release:check
          npm audit --audit-level=high
          git diff --check

      - name: Run Chromium Firefox WebKit accessibility and performance matrix
        run: |
          set -euo pipefail
          node scripts/prompt2b-final-review.mjs
          npm run a11y

      - name: Create font-free runnable compiled preview
        run: |
          set -euo pipefail
          mkdir -p .prompt2b-review/compiled-preview
          cp -a dist/frontend/. .prompt2b-review/compiled-preview/
          find .prompt2b-review/compiled-preview -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -delete
          cat > .prompt2b-review/compiled-preview/README.md <<'EOF'
          # Qelly Prompt 2B compiled preview

          This is the exact disconnected static build used by the browser matrix. Serve this directory with any static HTTP server and open the generated `index.html` under the `/qelly-intelligence/` base path.

          Governed font binaries are intentionally excluded from the downloadable review artifact. The repository and validated build retain IBM Plex Sans Variable; the review copy falls back to the declared system stack when those binary files are absent.

          No external financial provider, broker, exchange, wallet, trading, custody or cloud-save service is connected.
          EOF
          if find .prompt2b-review -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) | grep -q .; then exit 1; fi

      - name: Package and integrity-check review artifact
        run: |
          set -euo pipefail
          cp project-state/QELLY_PROMPT2B_SOURCE_MANIFEST.json .prompt2b-review/
          cp project-state/QELLY_PROMPT2B_EXECUTION_LEDGER.md .prompt2b-review/
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const root='.prompt2b-review';
          const walk=async dir=>{const out=[];for(const entry of await readdir(dir,{withFileTypes:true})){const full=path.join(dir,entry.name);if(entry.isDirectory())out.push(...await walk(full));else out.push(full);}return out;};
          const files=(await walk(root)).sort();
          const checks=[];
          for(const file of files){const body=await readFile(file);checks.push({path:path.relative(root,file).replaceAll('\\','/'),bytes:body.length,sha256:createHash('sha256').update(body).digest('hex')});}
          await writeFile(path.join(root,'CHECKSUMS.json'),JSON.stringify({schemaVersion:1,head:process.env.QELLY_REVIEW_HEAD,files:checks},null,2)+'\n');
          NODE
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('.prompt2b-review')
          target=pathlib.Path('qelly-prompt2b-calculator-indicator-foundation-review.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file(): archive.write(file,file.relative_to(root.parent).as_posix())
          with zipfile.ZipFile(target) as archive:
              bad=archive.testzip()
              if bad: raise SystemExit(f'CRC failed: {bad}')
              names=archive.namelist()
              prohibited=[name for name in names if name.lower().endswith(('.woff','.woff2','.ttf','.otf'))]
              if prohibited: raise SystemExit(f'font binaries prohibited: {prohibited}')
          PY
          sha256sum qelly-prompt2b-calculator-indicator-foundation-review.zip > qelly-prompt2b-calculator-indicator-foundation-review.zip.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          p=pathlib.Path('qelly-prompt2b-calculator-indicator-foundation-review.zip')
          with zipfile.ZipFile(p) as z: entries=len(z.infolist())
          meta={'schemaVersion':1,'head':os.environ['QELLY_REVIEW_HEAD'],'filename':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'entryCount':entries,'crcVerified':True,'prohibitedFontBinaries':0}
          pathlib.Path('qelly-prompt2b-calculator-indicator-foundation-review.metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload complete Prompt 2B Wave 1 review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qelly-prompt2b-calculator-indicator-foundation-review
          path: |
            qelly-prompt2b-calculator-indicator-foundation-review.zip
            qelly-prompt2b-calculator-indicator-foundation-review.zip.sha256
            qelly-prompt2b-calculator-indicator-foundation-review.metadata.json
            .prompt2b-review
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # BEGIN PROMPT2B_SMOKE_CLOSURE_INTEGRATOR
  closure-integrate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact closure head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact parent and live branch
        env:
          EXPECTED_PARENT: 178629f8e2eb7829c701bf7b4ba13cf0f5854049
          LIVE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$LIVE_HEAD"
          test "$(git ls-remote origin refs/heads/feature/calculator-and-indicator-foundation | cut -f1)" = "$LIVE_HEAD"
      - name: Reconcile smoke and release harness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/smoke.mjs');s=p.read_text()
          def one(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'expected one smoke anchor, found {s.count(old)}: {old[:100]}')
              s=s.replace(old,new,1)
          one("config.routes.length === 66 && config.apiRoutes.length === 199","config.routes.length === 70 && config.apiRoutes.length === 202")
          one("config.waveStatus.part22 && config.schemaValidation.schemasLoaded === 70","config.waveStatus.part22 && config.schemaValidation.schemasLoaded === 72")
          one("coverage.schemasLoaded === 70","coverage.schemasLoaded === 72")
          anchor="""  const indicator=(await request('/api/v1/indicators/run',{method:'POST',body:{indicatorId:'sma',inputs:{close:[1,2,3,4,5],period:3}}})).json();
          expect(indicator.status==='success'&&indicator.outputs.value.at(-1)===4,'deterministic indicator API invalid');"""
          addition=anchor+"""
          const freshCalculation=(await request('/api/v1/calculations/run',{method:'POST',body:{formulaId:'fresh-present-value',inputs:{futureValue:110,rate:0.1,periods:1}}})).json();
          expect(freshCalculation.status==='success'&&Math.abs(freshCalculation.outputs.value-100)<1e-8&&freshCalculation.truthState==='FRESH_REIMPLEMENTATION_2026','fresh formula API invalid');
          const freshIndicator=(await request('/api/v1/indicators/run',{method:'POST',body:{indicatorId:'fresh-price-momentum',inputs:{close:Array.from({length:30},(_,index)=>100+index),period:14}}})).json();
          expect(freshIndicator.status==='success'&&freshIndicator.outputs.value.at(-1)===14&&freshIndicator.truthState==='FRESH_REIMPLEMENTATION_2026','fresh indicator API invalid');
          const saved=(await request('/api/v1/calculations/saved',{method:'POST',status:201,body:{name:'Fresh PV smoke',result:freshCalculation,notes:'Prompt 2B lifecycle smoke',tags:['fresh','smoke'],favorite:true},headers:{'Idempotency-Key':'prompt2b-saved-create'}})).json();
          const savedList=(await request('/api/v1/calculations/saved?q=Fresh%20PV&favorite=true&sort=name-asc')).json();
          expect(savedList.items.some(item=>item.id===saved.id)&&savedList.persistence.schemaVersion===2,'saved calculation list invalid');
          const savedRead=(await request(`/api/v1/calculations/saved/${saved.id}`)).json();
          expect(savedRead.version===1&&savedRead.formulaVersion==='2.0.0'&&savedRead.revisions.length===1,'saved calculation read invalid');
          const savedUpdated=(await request(`/api/v1/calculations/saved/${saved.id}`,{method:'PATCH',body:{name:'Fresh PV updated',notes:'Updated smoke',tags:['fresh','updated'],favorite:false},headers:{'Idempotency-Key':'prompt2b-saved-update'}})).json();
          expect(savedUpdated.version===2&&savedUpdated.revisions.length===2&&savedUpdated.name==='Fresh PV updated','saved calculation update invalid');
          const duplicate=(await request(`/api/v1/calculations/saved/${saved.id}/duplicate`,{method:'POST',status:201,body:{name:'Fresh PV duplicate'},headers:{'Idempotency-Key':'prompt2b-saved-duplicate'}})).json();
          expect(duplicate.id!==saved.id&&duplicate.version===1&&duplicate.name==='Fresh PV duplicate','saved calculation duplicate invalid');
          const savedRevisions=(await request(`/api/v1/calculations/saved/${saved.id}/revisions`)).json();
          expect(savedRevisions.currentVersion===2&&savedRevisions.items.length===2,'saved calculation revisions invalid');
          const firstRevision=savedRevisions.items.find(item=>item.version===1);
          const savedRestored=(await request(`/api/v1/calculations/saved/${saved.id}/restore`,{method:'POST',body:{revisionId:firstRevision.revisionId},headers:{'Idempotency-Key':'prompt2b-saved-restore'}})).json();
          expect(savedRestored.version===3&&savedRestored.name==='Fresh PV smoke'&&savedRestored.revisions.length===3,'saved revision restore invalid');
          const duplicateDeleted=(await request(`/api/v1/calculations/saved/${duplicate.id}`,{method:'DELETE',headers:{'Idempotency-Key':'prompt2b-saved-delete-duplicate'}})).json();
          const originalDeleted=(await request(`/api/v1/calculations/saved/${saved.id}`,{method:'DELETE',headers:{'Idempotency-Key':'prompt2b-saved-delete-original'}})).json();
          expect(duplicateDeleted.deleted&&originalDeleted.deleted,'saved calculation delete invalid');"""
          one(anchor,addition)
          one("  const result={\n    status:'smoke-passed'","  const expectedRequests=290;\n  expect(log.length===expectedRequests,`request denominator mismatch: ${log.length} !== ${expectedRequests}`);\n  const result={\n    status:'smoke-passed'")
          one("requests:log.length,","requests:log.length,requestDenominator:expectedRequests,")
          one("deterministicCalculations:true,deterministicIndicators:true,indiaCustomCharges:true","deterministicCalculations:true,deterministicIndicators:true,freshCatalog:true,savedCalculationLifecycle:true,indiaCustomCharges:true")
          p.write_text(s)
          p=Path('scripts/release-check.mjs');s=p.read_text()
          if s.count('&& smoke.requests === 279')!=1: raise SystemExit('release smoke denominator anchor missing')
          p.write_text(s.replace('&& smoke.requests === 279','&& smoke.requests === 290',1))
          PY
          node --check scripts/smoke.mjs
          node --check scripts/release-check.mjs
      - name: Run focused and full closure gates
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --test tests/calculation-security.test.mjs tests/calculation-service-parity.test.mjs tests/browser-saved-calculation-lifecycle.test.mjs tests/saved-calculation-lifecycle.test.mjs tests/saved-calculation-store.test.mjs
          npm run validate:product
          npm run inventory:product
          npm run smoke
          npm run release:check
      - name: Remove integrators and commit exact closure
        run: |
          set -euo pipefail
          rm -f .github/workflows/prompt2b-closure-smoke-integration.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/prompt2b-wave1-review.yml')
          s=p.read_text()
          marker='  # BEGIN PROMPT2B_SMOKE_CLOSURE_INTEGRATOR\n'
          if s.count(marker)!=1: raise SystemExit('integration marker missing')
          p.write_text(s.split(marker,1)[0].rstrip()+'\n')
          PY
          git config user.name hemangsah
          git config user.email hemangsah.dn@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "test(prompt2b): close fresh catalog and saved lifecycle smoke"
          git push origin HEAD:feature/calculator-and-indicator-foundation
