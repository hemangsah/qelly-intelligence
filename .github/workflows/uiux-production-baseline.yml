name: Integrated DEX Typography and Source Comparison Diagnostic
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact isolated typography baseline 1b3bc2ba7d700deff82ee6ddb56ebb23c7f55b19
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        expected: [baseline, candidate]
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ matrix.expected == 'baseline' && inputs.production_sha || github.sha }}
      QELLY_DEX_SOURCE_COMPARISON_EXPECT: ${{ matrix.expected }}
      QELLY_DEX_CONTROL_MATRIX: 'true'
      QELLY_DEX_TYPE_EXPECT: 'green'
      QELLY_DEX_LIVE: 'false'
      QELLY_CSS_EXPERIMENT_BASELINE: preview/css-import-baseline
      QELLY_SCREEN_BATCH_SIZE: '10'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.expected == 'baseline' && inputs.production_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .dex-source-runner
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Guard exact baseline and source identity
        run: |
          test '${{ inputs.production_sha }}' = '1b3bc2ba7d700deff82ee6ddb56ebb23c7f55b19'
          test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Install locked dependencies only in cloud
        run: npm ci --ignore-scripts
      - name: Install the current matched official Chromium without changing product dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.65.0
          timeout 5m python -m playwright install chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          ldd "$chromium_path" > "$RUNNER_TEMP/qelly-browser-libraries.txt"
          if grep -F "not found" "$RUNNER_TEMP/qelly-browser-libraries.txt"; then exit 1; fi
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Build exact source using inherited production-mode fixture configuration
        run: npm run build:frontend
      - name: Verify preserved core typography and native source disclosures in each exact arm
        run: |
          node scripts/qelly-dex-typography-owner-pair.mjs
          node scripts/qelly-dex-typography-owner-published.mjs preview/dex-typography-owner-pair green "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Preserve source-bound typography evidence without product acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-integrated-typography-${{ matrix.expected }}-${{ github.sha }}
          path: preview/dex-typography-owner-pair
          if-no-files-found: error
          retention-days: 7
      - name: Verify original DEX journeys and governed source comparison
        run: |
          cp .dex-source-runner/scripts/qelly-dex-source-comparison-pair.mjs scripts/qelly-dex-source-comparison-pair.mjs
          cp .dex-source-runner/scripts/qelly-dex-source-comparison-report.mjs scripts/qelly-dex-source-comparison-report.mjs
          cp .dex-source-runner/scripts/qelly-dex-source-comparison-bindings.mjs scripts/qelly-dex-source-comparison-bindings.mjs
          cp .dex-source-runner/scripts/qelly-dex-source-comparison-published.mjs scripts/qelly-dex-source-comparison-published.mjs
          node scripts/qelly-dex-source-comparison-pair.mjs
          node scripts/qelly-dex-source-comparison-published.mjs "preview/dex-source-comparison-$QELLY_DEX_SOURCE_COMPARISON_EXPECT" "$QELLY_DEX_SOURCE_COMPARISON_EXPECT" "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Preserve source-bound diagnostic evidence in cloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-source-comparison-${{ matrix.expected }}-${{ github.sha }}
          path: preview/dex-source-comparison-${{ matrix.expected }}
          if-no-files-found: error
          retention-days: 7
  verify-published:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.production_sha }}
          path: .typography-baseline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-dex-controls-source-comparison-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/dex-source-comparison/baseline
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-dex-controls-source-comparison-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/dex-source-comparison/candidate
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-dex-controls-integrated-typography-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/dex-source-comparison/typography-baseline
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qelly-dex-controls-integrated-typography-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/dex-source-comparison/typography-candidate
          digest-mismatch: error
      - name: Independently validate reports and every decoded PNG before pairing exact governed metadata
        env:
          BASE_SHA: ${{ inputs.production_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node scripts/qelly-dex-source-comparison-published.mjs "$RUNNER_TEMP/dex-source-comparison/baseline" baseline "$BASE_SHA" --verify
          node scripts/qelly-dex-source-comparison-published.mjs "$RUNNER_TEMP/dex-source-comparison/candidate" candidate "$HEAD_SHA" --verify
          node scripts/qelly-dex-source-comparison-published.mjs "$RUNNER_TEMP/dex-source-comparison" pair "$HEAD_SHA"
          node .typography-baseline/scripts/qelly-dex-typography-owner-published.mjs "$RUNNER_TEMP/dex-source-comparison/typography-baseline" green "$BASE_SHA" --verify
          node scripts/qelly-dex-typography-owner-published.mjs "$RUNNER_TEMP/dex-source-comparison/typography-candidate" green "$HEAD_SHA" --verify
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const root=process.env.RUNNER_TEMP+'/dex-source-comparison',read=async p=>JSON.parse(await readFile(root+'/'+p)),a=await read('typography-baseline/independent-gate-receipt.json'),b=await read('typography-candidate/independent-gate-receipt.json'),comparison=await read('pair-receipt.json');
          for(const[r,source,negatives]of[[a,process.env.BASE_SHA,66],[b,process.env.HEAD_SHA,69]]){assert.equal(r.sourceSha,source);assert.equal(r.arm,'green');assert.equal(r.contexts,8);assert.equal(r.measuredLabels,288);assert.equal(r.controlMeasurements,88);assert.equal(r.sourceDisclosureCases,104);assert.equal(r.disclosureTextMeasurements,832);assert.equal(r.screenshots.length,64);assert.ok(r.screenshots.every(i=>i.pixelsDecoded&&i.chunksCrcVerified));assert.equal(r.negativeVariants.length,negatives);assert.equal(r.imageNegativeVariants.length,7);assert.ok(r.minimumFont>=14);assert.equal(r.labelsBelow14,0);assert.equal(r.controlsBelow14,0);assert.equal(r.disclosureLabelsBelow14,0);assert.equal(r.productionAccepted,false);}
          assert.equal(b.comparisonInitialControlStates,8);assert.equal(comparison.baseline,process.env.BASE_SHA);assert.equal(comparison.head,process.env.HEAD_SHA);assert.equal(comparison.contextsPerArm,8);assert.equal(comparison.negativePairs.length,4);
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex'),receipt={schema:'qelly.dex.integrated-diagnostic/1.0',baseline:process.env.BASE_SHA,head:process.env.HEAD_SHA,contextsPerArm:8,typographyImages:128,comparisonImages:112,totalDecodedImages:240,typographyReportNegatives:{baseline:66,candidate:69},comparisonReportNegatives:{baseline:26,candidate:47},originalCoreControlMeasurementsPerArm:88,originalSourceDisclosureCasesPerArm:104,originalPrimaryLabelsPerArm:288,originalDisclosureTextPerArm:832,separatelyGovernedInitialComparisonControls:8,baselineTypographyReceiptSha256:sha(await readFile(root+'/typography-baseline/independent-gate-receipt.json')),candidateTypographyReceiptSha256:sha(await readFile(root+'/typography-candidate/independent-gate-receipt.json')),comparisonPairReceiptSha256:sha(await readFile(root+'/pair-receipt.json')),canonicalPngValidatorReused:true,allChecksPassed:true,productionAccepted:false,fullDexWaveAccepted:false};await writeFile(root+'/integrated-receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-source-comparison-pair-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/dex-source-comparison/pair-receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qelly-dex-controls-integrated-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/dex-source-comparison/integrated-receipt.json
          if-no-files-found: error
          retention-days: 7
