name: Focused UI Owner Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qelly-focused-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QELLY_DIAGNOSTIC_MODE: theme
      QELLY_PRODUCT_SHA: 8dfc0c1c80358d7f6d116ce9993ec409255b51c7
      QELLY_SCREEN_EVIDENCE_SHA: 8dfc0c1c80358d7f6d116ce9993ec409255b51c7
      CF_PAGES_COMMIT_SHA: 8dfc0c1c80358d7f6d116ce9993ec409255b51c7
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: isolated-owner-fixtures
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
      QELLY_PUBLIC_PRODUCT_ANALYTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Verify precise product source
        run: |
          git fetch --depth=1 origin "$QELLY_PRODUCT_SHA"
          git diff --exit-code "$QELLY_PRODUCT_SHA" HEAD -- apps/web/public packages functions scripts/build-frontend.mjs scripts/finalize-public-runtime.mjs scripts/finalize-governed-discovery.mjs scripts/coalesce-css-imports.mjs
      - name: Install locked dependencies and official Playwright browser
        run: |
          npm ci --ignore-scripts
          timeout 5m npx playwright install --with-deps chromium
      - name: Build finalized production runtime
        run: npm run build:frontend
      - name: Run focused owner matrix
        run: node scripts/qelly-focused-owner-diagnostics.mjs
      - name: Retain compact report and selected PNG
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/qelly-focused-owner-diagnostics.mjs publish
