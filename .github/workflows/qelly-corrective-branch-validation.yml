name: Qelly Corrective Branch Validation

on:
  push:
    branches:
      - 'agent/qelly-*'
  pull_request:
    branches:
      - 'release/qelly-global-public-beta'
      - 'agent/qelly-*'

permissions:
  contents: read

concurrency:
  group: qelly-corrective-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete Node test suite
        id: node_tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee qelly-node-test-output.log

      - name: Upload failing Node test trace
        if: failure() && steps.node_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: qelly-node-test-output
          path: qelly-node-test-output.log
          if-no-files-found: error
          retention-days: 1

      - name: Build Cloudflare frontend bundle
        run: npm run build:frontend
