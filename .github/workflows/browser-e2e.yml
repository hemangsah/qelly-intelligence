name: Browser E2E
on:
  pull_request:
    branches: [main, release/qelly-global-public-beta]
    types: [opened, synchronize, reopened]
    # Required by branch protection: every PR head must produce this check,
    # including workflow-only and documentation-only maintenance.
  push:
    branches: [main, release/qelly-global-public-beta]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: qelly-all-screens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QELLY_SCREEN_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QELLY_CSS_EXPERIMENT_BASELINE: preview/css-import-baseline
      QELLY_SCREEN_BATCH_SIZE: '10'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QELLY_REQUIRE_PUBLIC_RUNTIME: 'true'
      QELLY_PROMPT2C_PUBLIC_BETA: 'true'
      QELLY_PUBLIC_SITE_URL: https://terminal.qellyintelligence.com
      QELLY_PUBLIC_SUPABASE_URL: https://ssdgfgqnjlwzkgukzeef.supabase.co
      QELLY_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_shape_only_012345678901234567890123456789
      QELLY_DEPLOYMENT_ENVIRONMENT: production
      QELLY_EVIDENCE_CONTEXT: cloudflare-pages-production
      QELLY_ENABLE_AUTH: 'true'
      QELLY_ENABLE_AUTH_EMAIL_DELIVERY: 'true'
      QELLY_ENABLE_CLOUD_SYNC: 'true'
      QELLY_ENABLE_LIVE_PROVIDERS: 'true'
      QELLY_ENABLE_FEEDBACK_WRITES: 'true'
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QELLY_SCREEN_EVIDENCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Guard exact evidence head
        run: test "$(git rev-parse HEAD)" = "$QELLY_SCREEN_EVIDENCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated visual evidence runtime
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          timeout 5m python -m playwright install chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Validate exact production artifact before browser capture
        run: |
          npm run env:check
          npm run typecheck
          npm run lint
          npm run validate:design
          npm run security:scan
          npm test
          npm run build:frontend
          test -s dist/frontend/index.html
          test -s dist/frontend/qelly-config.js
          grep -F '"emailDelivery":true' dist/frontend/qelly-config.js
          grep -F "renderGovernedUnavailable" dist/frontend/assets/app.js
          grep -F "renderConverterWorkspace" dist/frontend/assets/app.js
          test -s dist/frontend/assets/routes/converter.mjs
          test -s dist/frontend/assets/routes/converter-v3.css
          test -s dist/frontend/assets/routes/asset-intelligence-v2.css
          test -s dist/frontend/assets/routes/advanced-chart-v2.css
          test -s dist/frontend/assets/routes/fundamentals-estimates-v2.css
          test -s dist/frontend/assets/routes/filing-workspace-v2.css
          test -s dist/frontend/assets/routes/event-calendar-v2.css
          test -s dist/frontend/assets/routes/comparison-lab-v2.css
          test -s dist/frontend/assets/routes/alert-rules-v2.css
          test -s dist/frontend/assets/routes/notification-triage-v2.css
          test -s dist/frontend/assets/routes/screener-lab-v2.css
          grep -F "renderGovernedTrustCenterV2" dist/frontend/assets/app.js
      - name: Verify Decision chart readability and keyboard-selected range contrast
        env:
          QELLY_CHART_READABILITY_EXPECT: green
        run: node scripts/qelly-decision-chart-readability-e2e.mjs
      - name: Validate30 chart contexts10 keyboard selections and14 images
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import {validateDecisionChartReadabilityReport,decisionChartReadabilityInvalidReports} from './scripts/qelly-decision-chart-readability-report.mjs';const sha=process.env.QELLY_SCREEN_EVIDENCE_SHA,root=process.env.QELLY_READABILITY_ROOT||'preview/decision-chart-readability',bytes=await readFile(root+'/report.json'),r=JSON.parse(bytes),expected={"cssSha":"3e448d76f44cae03d1c93090e7fffe31dbcc80c0436605eaaec1e659a0ef1fc7","routeSha":"a41453df7cc3e247d3c7d144b602957eba37ec8eb3c03da4264706d806dc77de","svgHashes":{"dark/1280/720/simple":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/1280/720/advanced":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/1280/720/research":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/1280/900/simple":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/1280/900/advanced":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/1280/900/research":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/768/900/simple":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/768/900/advanced":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/768/900/research":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/390/900/simple":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/390/900/advanced":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/390/900/research":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/320/900/simple":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/320/900/advanced":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b0478d1d3367d240f","dark/320/900/research":"6ee3c075de65395e657d2d6f5bfd33adcd75cf9371e46f0b047