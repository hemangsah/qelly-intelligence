name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Scan repository for committed secrets
        run: npm run security:scan
      - name: Validate development environment and safety locks
        run: npm run env:check
      - name: Type and syntax check
        run: npm run typecheck
      - name: Lint and repository policy
        run: npm run lint
      - name: Validate governed design foundations
        run: npm run validate:design
      - name: Test with retained TAP log
        shell: bash
        run: |
          mkdir -p validation
          set -o pipefail
          npm test 2>&1 | tee validation/QELLY_TEST.log
      - name: Production build
        run: npm run build
      - name: Standalone frontend build
        run: QELLY_PUBLIC_API_BASE_URL=https://api.preview.invalid npm run build:frontend
      - name: Validate current product contract
        run: npm run validate:product
      - name: Rebuild current product inventory
        run: npm run inventory:product
      - name: Full-stack smoke
        run: npm run smoke
      - name: Verify database identity isolation
        run: NODE_ENV=test QELLY_DEVELOPMENT_IDENTITY_ENABLED=false node scripts/production-identity-check.mjs
      - name: Release safety check
        run: npm run release:check
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qelly-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/BUILD_INFO.json
            dist/frontend/BUILD_INFO.json
            validation/QELLY_TEST.log
            validation/PRODUCT_VALIDATION.json
            validation/SMOKE_LOG.json
            artifacts/QELLY_ROUTE_INVENTORY.json
            artifacts/QELLY_API_INVENTORY.json
            artifacts/QELLY_SOURCE_TREE.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit locked dependency graph
        run: npm audit --audit-level=high

  prompt2b-final-harness-correction:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/calculator-and-indicator-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact harness head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact parent and live branch
        env:
          EXPECTED_PARENT: ff6acff494c78265ec564632f86339f6d998aa1f
          LIVE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$LIVE_HEAD"
          test "$(git ls-remote origin refs/heads/feature/calculator-and-indicator-foundation | cut -f1)" = "$LIVE_HEAD"
      - name: Correct exact truth and Python Playwright initialization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prompt2b-final-review.mjs');s=p.read_text()
          old="'calculator-detail':/Fresh Present Value/i.test(text)&&/No broker, exchange or provider/i.test(text),"
          new="'calculator-detail':/Present Value/i.test(text)&&/FRESH_REIMPLEMENTATION_2026/.test(text)&&/No broker, exchange or provider/i.test(text),"
          if s.count(old)!=1: raise SystemExit(f'calculator truth anchor count {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          p=Path('scripts/release-a5-accessibility-check.py');s=p.read_text()
          old="context.add_init_script(\"\"\"seed=>{sessionStorage.setItem('qelly.brand.opening.v1','seen');localStorage.setItem('qelly.calculations.v1',JSON.stringify(seed));}\"\"\", SAVED_SEED)"
          new="context.add_init_script(\"sessionStorage.setItem('qelly.brand.opening.v1','seen');localStorage.setItem('qelly.calculations.v1',\" + json.dumps(json.dumps(SAVED_SEED)) + \');\')"
          if s.count(old)!=1: raise SystemExit(f'a11y init anchor count {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/prompt2b-final-review.mjs
          python3 -m py_compile scripts/release-a5-accessibility-check.py
      - name: Commit tested harness files only
        run: |
          set -euo pipefail
          git config user.name hemangsah
          git config user.email hemangsah.dn@gmail.com
          git add scripts/prompt2b-final-review.mjs scripts/release-a5-accessibility-check.py
          git diff --cached --check
          git commit -m "test(prompt2b): correct final browser and accessibility harnesses"
          git push origin HEAD:feature/calculator-and-indicator-foundation
